const COLORES=['azul','verde','naranja','morado'];
const CSSCOLOR={azul:'#1687ff',verde:'#20c979',naranja:'#ff8a22',morado:'#a05cff'};
const DURACION_NORMAL=20,DURACION_RAYO=10;
const $=s=>document.querySelector(s), main=$('#main');
let sb=null, channel=null, role='home', sala=null, equipo=null, hostToken=null, teams=[], answers=[], serverOffset=0, muted=false, audioCtx=null, musicTimer=null, tickSecond=-1, wakeLock=null, refreshTimer=null, timerRAF=null, revealTimer=null, scored=new Set(), local=null;
const configured=()=>/^https:\/\//.test(SUPABASE_URL)&&!SUPABASE_URL.includes('PEGA_AQUI')&&SUPABASE_ANON_KEY.length>30&&!SUPABASE_ANON_KEY.includes('PEGA_AQUI');
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(m,ms=2600){let t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.add('hidden'),ms)}
function setConn(ok,msg){$('#conn').textContent=ok?'🟢 En línea':(msg||'🔴 Sin conexión, reconectando…')}
function rand(n=24){let a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
function code4(){let a='ABCDEFGHJKLMNPQRSTUVWXYZ';return Array.from({length:4},()=>a[Math.floor(Math.random()*a.length)]).join('')}
function qDuration(i){return i>=15?DURACION_RAYO:DURACION_NORMAL}
function medal(i){return ['🥇 1º','🥈 2º','🥉 3º','4º'][i]||`${i+1}º`}
function fmtMs(ms){return (Math.max(0,ms)/1000).toFixed(1)+' s'}
function rankTeams(){return [...teams].sort((a,b)=>b.puntaje-a.puntaje||a.nombre.localeCompare(b.nombre))}
function teamPos(id){let r=rankTeams(),t=r.find(x=>x.id===id);return t?1+r.findIndex(x=>x.puntaje===t.puntaje):'-'}
function calcMs(r){if(r.ms!=null)return r.ms;if(!sala?.pregunta_inicio)return 999999;return Math.max(0,new Date(r.creada_en)-new Date(sala.pregunta_inicio))}
function currentAnswers(){return answers.filter(r=>r.pregunta_idx===sala?.pregunta_actual).sort((a,b)=>calcMs(a)-calcMs(b)||new Date(a.creada_en)-new Date(b.creada_en))}
function answerByTeam(id){return currentAnswers().find(r=>r.equipo_id===id)}
function arrivalIndex(id){return currentAnswers().findIndex(r=>r.equipo_id===id)}
function audio(){if(muted)return null;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}
function tone(freq=440,d=.08,type='sine',vol=.05,delay=0){let a=audio();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+d);o.connect(g).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d)}
function sfx(kind){if(kind==='pop')tone(520,.07,'square',.035);if(kind==='ok'){tone(660,.12,'sine',.05);tone(880,.14,'sine',.04,.09)}if(kind==='bad'){tone(160,.28,'sawtooth',.04);tone(110,.32,'sawtooth',.03,.12)}if(kind==='first'){[660,880,1100].forEach((f,i)=>tone(f,.11,'sine',.05,i*.09))}if(kind==='siren'){for(let i=0;i<8;i++)tone(i%2?850:430,.12,'square',.035,i*.11)}if(kind==='fan'){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.055,i*.13))}if(kind==='tick')tone(900,.025,'square',.025)}
function startMusic(){if(muted||musicTimer)return;let seq=[262,330,392,330,294,349,440,349],i=0;musicTimer=setInterval(()=>{if(!muted&&role==='host')tone(seq[i++%seq.length],.08,'triangle',.012)},430)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
function confetti(n=35){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<n;i++){let e=document.createElement('i');e.className='confetti';e.textContent=['◆','●','★','✦'][i%4];e.style.left=Math.random()*100+'vw';e.style.setProperty('--x',(Math.random()*300-150)+'px');e.style.setProperty('--d',(1.5+Math.random()*2)+'s');e.style.color=['#ffd34d','#20c979','#1687ff','#ff8a22','#a05cff'][i%5];document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}}
async function keepAwake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch{}}
async function full(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.exitFullscreen)await document.exitFullscreen()}catch{}}
function home(){role='home';cleanupRealtime();let pre=new URLSearchParams(location.search),c=(pre.get('sala')||'').toUpperCase(),ver=pre.get('ver')==='1';if(c){return ver?joinSpectator(c):joinForm(c)}main.innerHTML=`<section class="card hero"><div>🌎 🔭 🚀</div><h1>Reto Cósmico</h1><p>Concurso en vivo · Ciencias Naturales 9.º · C.E.B.G. El Jiral</p><div class="actions"><button class="btn" id="create">👨‍🏫 Crear sala</button><button class="btn good" id="join">📱 Unirse</button><button class="btn secondary" id="local">📴 Jugar sin internet</button></div><p class="note">20 preguntas · velocidad · rachas · ronda relámpago</p></section>`;$('#create').onpointerdown=createRoom;$('#join').onpointerdown=()=>joinForm('');$('#local').onpointerdown=localSetup}
async function initSB(){if(!configured())return false;try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{realtime:{params:{eventsPerSecond:20}}});let t=Date.now();let {data,error}=await sb.from('salas').select('creada_en').limit(1);if(error)throw error;serverOffset=0;setConn(true);return true}catch(e){console.warn(e);setConn(false);return false}}
async function createRoom(){audio();if(!await initSB()){toast('Supabase no está configurado o no hay conexión. Puede usar el modo local.');return localSetup()}hostToken=rand();let codigo;for(let i=0;i<12;i++){codigo=code4();let {data}=await sb.from('salas').select('codigo').eq('codigo',codigo).maybeSingle();if(!data)break}let {data,error}=await sb.from('salas').insert({codigo,host_token:hostToken,estado:'lobby',pregunta_actual:-1,duracion_seg:20}).select().single();if(error)return toast('No pude crear la sala: '+error.message,5000);sala=data;role='host';await subscribe();renderHost();startMusic()}
function joinForm(pref=''){role='join';main.innerHTML=`<section class="card"><h2>📱 Unirse al concurso</h2><div class="form"><input id="room" class="input" maxlength="4" autocomplete="off" placeholder="Código de 4 letras" value="${esc(pref)}"><input id="name" class="input" maxlength="24" autocomplete="off" placeholder="Nombre del equipo"><button class="btn good" id="go">Entrar</button><button class="btn secondary" id="back">Volver</button></div></section>`;$('#go').onpointerdown=joinTeam;$('#back').onpointerdown=home}
async function joinTeam(){audio();let codigo=$('#room').value.trim().toUpperCase(),nombre=$('#name').value.trim().replace(/\s+/g,' ');if(codigo.length!==4||nombre.length<2)return toast('Escriba el código y un nombre de equipo.');if(!await initSB())return toast('No hay conexión con Supabase.');let {data:s,error}=await sb.from('salas').select('*').eq('codigo',codigo).maybeSingle();if(error||!s)return toast('No encontré esa sala.');sala=s;let {data:old}=await sb.from('equipos').select('*').eq('sala',codigo).eq('nombre',nombre).maybeSingle();if(old){equipo=old}else{let {data:used}=await sb.from('equipos').select('color').eq('sala',codigo);let free=COLORES.find(c=>!(used||[]).some(x=>x.color===c));if(!free)return toast('La sala ya tiene 4 equipos.');let {data:newT,error:e}=await sb.from('equipos').insert({sala:codigo,nombre,color:free}).select().single();if(e)return toast(e.message.includes('duplicate')?'Ese nombre o color ya está ocupado.':'No pude unir el equipo: '+e.message);equipo=newT}role='team';await subscribe();await refresh();renderTeam();keepAwake()}
async function joinSpectator(c){if(!await initSB())return toast('No hay conexión con Supabase.');let {data}=await sb.from('salas').select('*').eq('codigo',c).maybeSingle();if(!data){main.innerHTML='<section class="card"><h2>Sala no encontrada</h2></section>';return}sala=data;role='spectator';await subscribe();await refresh();renderSpectator()}
async function subscribe(){cleanupRealtime(false);channel=sb.channel('sala-'+sala.codigo+'-'+rand(4)).on('postgres_changes',{event:'*',schema:'public',table:'salas',filter:`codigo=eq.${sala.codigo}`},p=>{if(p.eventType==='DELETE'){toast('La sala terminó.');return home()}sala=p.new;renderRole()}).on('postgres_changes',{event:'*',schema:'public',table:'equipos',filter:`sala=eq.${sala.codigo}`},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'respuestas',filter:`sala=eq.${sala.codigo}`},p=>{if(p.new&&!answers.some(x=>x.id===p.new.id))answers.push(p.new);renderRole();maybeAutoClose()}).subscribe(st=>setConn(st==='SUBSCRIBED'));refreshTimer=setInterval(refresh,5000)}
function cleanupRealtime(remove=true){clearInterval(refreshTimer);refreshTimer=null;cancelAnimationFrame(timerRAF);clearTimeout(revealTimer);if(remove&&channel&&sb)sb.removeChannel(channel);channel=null}
async function refresh(){if(!sb||!sala)return;try{let [sr,tr,rr]=await Promise.all([sb.from('salas').select('*').eq('codigo',sala.codigo).maybeSingle(),sb.from('equipos').select('*').eq('sala',sala.codigo),sb.from('respuestas').select('*').eq('sala',sala.codigo).order('creada_en')]);if(sr.data)sala=sr.data;if(tr.data)teams=tr.data;if(rr.data)answers=rr.data;if(equipo)equipo=teams.find(x=>x.id===equipo.id)||equipo;setConn(true);renderRole();maybeAutoClose()}catch{setConn(false)}}
function renderRole(){if(role==='host')renderHost();else if(role==='team')renderTeam();else if(role==='spectator')renderSpectator()}
function roomHeader(extra=''){return `<div class="counter">Sala ${esc(sala.codigo)} · ${sala.pregunta_actual>=0?'Pregunta '+(sala.pregunta_actual+1)+' de 20':'Esperando inicio'} ${extra}</div>`}
function scores(){return `<div class="scoreGrid">${rankTeams().map((t,i)=>`<div class="teamCard" style="--team:${CSSCOLOR[t.color]}"><div class="name">${i===0&&t.puntaje>0?'👑 ':''}${esc(t.nombre)}</div><div class="pts">${t.puntaje}</div><div class="meta">${esc(t.color)} · 🔥 ${t.racha||0} · mejor ${t.mejor_racha||0}</div></div>`).join('')||'<p>Aún no hay equipos.</p>'}</div>`}
function liveFour(){let arr=currentAnswers();let ordered=[...teams].sort((a,b)=>COLORES.indexOf(a.color)-COLORES.indexOf(b.color));return `<div class="liveFour">${ordered.map(t=>{let r=arr.find(x=>x.equipo_id===t.id),idx=r?arr.indexOf(r):-1,state=sala?.pregunta_actual<0?'Listo para jugar':r?`${medal(idx)} Respondió · ${fmtMs(calcMs(r))}`:'🤔 Pensando…';return `<div class="liveTeam ${r?'answered':''}" style="--team:${CSSCOLOR[t.color]}"><div class="liveName">${esc(t.nombre)}</div><div class="livePts">${t.puntaje} pts</div><div class="liveState">${state}<br>🔥 ${t.racha||0}</div></div>`}).join('')}${ordered.length<4?Array.from({length:4-ordered.length},()=>'<div class="liveTeam" style="--team:#526273"><div class="liveName">Esperando…</div><div class="livePts">—</div><div class="liveState">Falta equipo</div></div>').join(''):''}</div>`}
function questionPanel(showOpts=false){let i=sala.pregunta_actual;if(i<0)return `<div class="questionBox"><div class="question">Esperando equipos…</div><p>Comparta el código para comenzar.</p></div>`;let q=PREGUNTAS[i];return `<div class="questionBox">${roomHeader(i>=15?'<b>⚡ RELÁMPAGO ×2</b>':'')}<div class="question">${esc(q.q)}</div><div class="timerNum" id="timerNum">--</div><div class="bar"><i id="timeBar"></i></div>${showOpts?`<div class="answers">${q.o.map((x,j)=>`<div class="answer" style="--team:#294d75"><span class="letter">${'ABCD'[j]}</span>${esc(x)}</div>`).join('')}</div>`:''}</div>`}
function arrivals(reveal=false){let arr=currentAnswers(),q=PREGUNTAS[sala.pregunta_actual];return `<div><h2>⚡ Orden de llegada</h2>${arr.map((r,i)=>{let t=teams.find(x=>x.id===r.equipo_id),ok=q&&r.opcion===q.c,g=reveal?gainFor(r,i):null;return `<div class="arrivalRow"><b>${medal(i)}</b><span>${esc(t?.nombre||'Equipo')}</span><span>${fmtMs(calcMs(r))}</span>${reveal?`<span class="gain ${ok?'correct':'wrong'}">${ok?'✅':'❌'} ${ok?'+'+g:' +0'}</span>`:''}</div>`}).join('')||'<p>Nadie ha respondido todavía.</p>'}</div>`}
function isExpired(){if(!sala?.pregunta_inicio||sala.pregunta_actual<0)return false;return Date.now()+serverOffset>=new Date(sala.pregunta_inicio).getTime()+qDuration(sala.pregunta_actual)*1000}
function allAnswered(){return teams.length>0&&currentAnswers().length>=teams.length}
function shouldReveal(){return isExpired()||allAnswered()||scored.has(sala?.pregunta_actual)}
function renderHost(){if(!sala)return;let i=sala.pregunta_actual,reveal=shouldReveal();main.innerHTML=`<section class="card">${liveFour()}<div class="layout"><div>${questionPanel(true)}${reveal&&i>=0?revealBlock():''}</div><aside><div class="code">${esc(sala.codigo)}</div><div id="qr" class="qr"></div>${scores()}<div class="actions" style="margin-top:12px"><button class="btn good" id="next">${i<0?'▶ Iniciar':i<19?'Siguiente ▶':'🏁 Final'}</button><button class="btn warn" id="pause">⏸ Pausar</button><button class="btn danger" id="end">Terminar y borrar sala</button></div><p class="note">Pausa/borrado requieren permisos UPDATE/DELETE en <code>salas</code>; con el RLS suministrado se aplica una pausa visual segura.</p></aside></div></section>`;makeQR();$('#next').onpointerdown=nextHost;$('#pause').onpointerdown=()=>toast('Pausa visual: el esquema RLS actual no permite actualizar salas desde anon.');$('#end').onpointerdown=endRoom;runTimer();if(reveal&&i>=0)scoreQuestion(i)}
function revealBlock(){let q=PREGUNTAS[sala.pregunta_actual];return `<div class="card reveal"><h2>Respuesta: <span class="correct">${'ABCD'[q.c]}. ${esc(q.o[q.c])}</span></h2><p>${esc(q.e)}</p>${arrivals(true)}</div>`}
function makeQR(){let e=$('#qr');if(!e||typeof QRCode==='undefined')return;e.innerHTML='';let u=new URL(location.href);u.search='';u.searchParams.set('sala',sala.codigo);new QRCode(e,{text:u.toString(),width:150,height:150,correctLevel:QRCode.CorrectLevel.M})}
async function nextHost(){audio();let i=sala.pregunta_actual;if(i>=0&&!shouldReveal()){toast('La pregunta sigue abierta. Espere el tiempo o a todos los equipos.');return}if(i>=0)await scoreQuestion(i,true);if(i>=19)return finalScreen();let ni=i+1;if(ni===15){document.body.insertAdjacentHTML('beforeend','<div class="lightning" id="zap">⚡ RONDA RELÁMPAGO ⚡<br><small>10 segundos · puntos dobles</small></div>');sfx('siren');setTimeout(()=>$('#zap')?.remove(),1700);await new Promise(r=>setTimeout(r,900))}let {data,error}=await sb.rpc('iniciar_pregunta',{p_sala:sala.codigo,p_token:hostToken,p_idx:ni,p_duracion:qDuration(ni)});if(error)return toast('No pude iniciar: '+error.message,5000);sala.pregunta_actual=ni;sala.pregunta_inicio=data;sala.duracion_seg=qDuration(ni);sala.estado='jugando';tickSecond=-1;renderHost()}
function gainFor(r,arrIdx){let i=r.pregunta_idx,q=PREGUNTAS[i];if(r.opcion!==q.c)return 0;let dur=qDuration(i)*1000,ms=calcMs(r),speed=Math.round(100*Math.max(0,dur-ms)/dur),order=[50,30,20,10][arrIdx]||0,base=100+speed+order;let t=teams.find(x=>x.id===r.equipo_id),streak=(t?.racha||0)+1,bonus=streak>=3?25:0,total=base+bonus;return i>=15?total*2:total}
async function scoreQuestion(i,force=false){if(role!=='host'||scored.has(i)||!shouldReveal())return;scored.add(i);let arr=answers.filter(r=>r.pregunta_idx===i).sort((a,b)=>calcMs(a)-calcMs(b)||new Date(a.creada_en)-new Date(b.creada_en));let updates=[];for(let t of teams){let r=arr.find(x=>x.equipo_id===t.id),ok=r&&r.opcion===PREGUNTAS[i].c,idx=r?arr.indexOf(r):-1,newR=ok?(t.racha||0)+1:0,g=ok?gainFor(r,idx):0;updates.push({id:t.id,puntaje:(t.puntaje||0)+g,racha:newR,mejor_racha:Math.max(t.mejor_racha||0,newR)})}for(let u of updates){let {error}=await sb.from('equipos').update({puntaje:u.puntaje,racha:u.racha,mejor_racha:u.mejor_racha}).eq('id',u.id);if(error)console.warn(error)}await refresh();let firstCorrect=arr.find(r=>r.opcion===PREGUNTAS[i].c);if(firstCorrect)sfx('first')}
function maybeAutoClose(){if(role==='host'&&allAnswered()&&!scored.has(sala.pregunta_actual)){clearTimeout(revealTimer);revealTimer=setTimeout(()=>{scoreQuestion(sala.pregunta_actual);renderHost()},1500)}}
function runTimer(){cancelAnimationFrame(timerRAF);let n=$('#timerNum'),b=$('#timeBar');if(!n||!b||!sala?.pregunta_inicio)return;let dur=qDuration(sala.pregunta_actual)*1000,start=new Date(sala.pregunta_inicio).getTime();let loop=()=>{let left=Math.max(0,dur-(Date.now()+serverOffset-start)),sec=Math.ceil(left/1000),pct=left/dur*100;n.textContent=(left/1000).toFixed(1)+' s';b.style.width=pct+'%';b.style.background=pct>50?'#20c979':pct>25?'#ffd34d':'#ff4560';if(sec<=5&&sec>0&&sec!==tickSecond){tickSecond=sec;sfx('tick')}if(left>0&&!allAnswered())timerRAF=requestAnimationFrame(loop);else{n.textContent='0.0 s';if(role==='host'&&!scored.has(sala.pregunta_actual)){scoreQuestion(sala.pregunta_actual);setTimeout(renderHost,150)}}};loop()}
function renderTeam(){if(!sala||!equipo)return;let i=sala.pregunta_actual;if(i<0){main.innerHTML=`<section class="card hero">${roomHeader()}<h2>¡Listos, ${esc(equipo.nombre)}!</h2><p>Color: <b style="color:${CSSCOLOR[equipo.color]}">${equipo.color}</b> · Puntaje ${equipo.puntaje}</p><div class="code">${esc(sala.codigo)}</div></section>`;return}let q=PREGUNTAS[i],mine=answerByTeam(equipo.id),reveal=shouldReveal();main.innerHTML=`<section class="card" style="--team:${CSSCOLOR[equipo.color]}">${roomHeader(i>=15?'⚡ ×2':'')}${liveFour()}<div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(equipo.nombre)} · ${equipo.puntaje} pts</b><b>Pos. ${teamPos(equipo.id)}</b></div><div class="question">${esc(q.q)}</div><div class="timerNum" id="timerNum">--</div><div class="bar"><i id="timeBar"></i></div>${mine?`<div class="arrival">Respuesta enviada ✅ · ${medal(arrivalIndex(equipo.id))} · ${fmtMs(calcMs(mine))}<p>Esperando a los demás…</p></div>`:`<div class="answers">${q.o.map((x,j)=>`<button class="answer" data-o="${j}" style="--team:${CSSCOLOR[equipo.color]}"><span class="letter">${'ABCD'[j]}</span>${esc(x)}</button>`).join('')}</div>`}${reveal?`<div class="card reveal"><h2>${mine?.opcion===q.c?'<span class="correct">✅ ¡Correcto!</span>':'<span class="wrong">❌ ¡Casi!</span>'}</h2><p>Correcta: <b>${'ABCD'[q.c]}. ${esc(q.o[q.c])}</b></p><p>${esc(q.e)}</p></div>`:''}</section>`;document.querySelectorAll('.answer').forEach(b=>b.onpointerdown=()=>sendAnswer(+b.dataset.o));runTimer()}
async function sendAnswer(op){audio();if(!equipo||answerByTeam(equipo.id))return toast('Ya enviaste tu respuesta.');if(isExpired())return toast('La pregunta ya cerró.');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);sfx('pop');try{navigator.vibrate?.(35)}catch{}let {data,error}=await sb.rpc('responder',{p_sala:sala.codigo,p_equipo:equipo.id,p_pregunta:sala.pregunta_actual,p_opcion:op});if(error){document.querySelectorAll('.answer').forEach(x=>x.disabled=false);return toast(error.message.includes('abierta')?'La pregunta ya cerró.':'No pude enviar: '+error.message)}answers.push({id:'local-'+Date.now(),sala:sala.codigo,equipo_id:equipo.id,pregunta_idx:sala.pregunta_actual,opcion:op,creada_en:new Date(new Date(sala.pregunta_inicio).getTime()+data).toISOString(),ms:data});let place=arrivalIndex(equipo.id);tone(520+Math.max(0,3-place)*100,.08,'square',.04);renderTeam()}
function renderSpectator(){let i=sala.pregunta_actual,reveal=shouldReveal();main.innerHTML=`<section class="card"><span class="spectatorTag">👀 Modo espectador</span>${liveFour()}<div class="layout"><div>${questionPanel(true)}${reveal&&i>=0?revealBlock():''}${i>=0?arrivals(reveal):''}</div><aside><div class="code">${esc(sala.codigo)}</div>${scores()}</aside></div></section>`;runTimer()}
async function endRoom(){if(!confirm('¿Terminar la sala?'))return;let {error}=await sb.from('salas').delete().eq('codigo',sala.codigo).eq('host_token',hostToken);if(error){toast('El RLS actual no permite borrar salas con anon. La partida se mostrará como final localmente.',5000);return finalScreen()}home()}
function finalScreen(){cancelAnimationFrame(timerRAF);sfx('fan');confetti(90);let r=rankTeams(),pos=0,last=null;main.innerHTML=`<section class="card hero"><h1>🏆 Resultado final</h1><div class="podium">${r.map((t,i)=>{if(t.puntaje!==last){pos=i+1;last=t.puntaje}return `<div class="pod p${Math.min(i+1,4)}" style="--team:${CSSCOLOR[t.color]}"><div class="rank">${pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':'4º'}</div><div class="name"><b>${esc(t.nombre)}</b></div><div>${t.puntaje} pts</div></div>`}).join('')}</div>${stats()}<h2>${r[0]?'¡Excelente trabajo, '+esc(r[0].nombre)+'! 🎉':'¡Buen trabajo!'}</h2><p>Todos aprendieron, compitieron y llegaron hasta el final. ¡Nos vemos en el próximo reto!</p><div class="actions">${role==='host'?'<button class="btn good" id="again">Jugar de nuevo</button><button class="btn" id="newRoom">Nueva sala</button>':'<button class="btn" id="backHome">Inicio</button>'}</div></section>`;$('#again')?.addEventListener('pointerdown',replay);$('#newRoom')?.addEventListener('pointerdown',()=>{cleanupRealtime();createRoom()});$('#backHome')?.addEventListener('pointerdown',home)}
function stats(){let per=teams.map(t=>{let rs=answers.filter(r=>r.equipo_id===t.id),ok=rs.filter(r=>PREGUNTAS[r.pregunta_idx]?.c===r.opcion),avg=rs.length?rs.reduce((s,r)=>s+calcMs(r),0)/rs.length:Infinity;return{t,ok:ok.length,avg}});let fast=[...per].sort((a,b)=>a.avg-b.avg)[0],acc=[...per].sort((a,b)=>b.ok-a.ok)[0],st=[...teams].sort((a,b)=>(b.mejor_racha||0)-(a.mejor_racha||0))[0];return `<div class="card"><h2>Estadísticas</h2><p>⚡ Equipo más rápido: <b>${fast&&isFinite(fast.avg)?esc(fast.t.nombre)+' · '+fmtMs(fast.avg):'—'}</b></p><p>🎯 Más aciertos: <b>${acc?esc(acc.t.nombre)+' · '+acc.ok:'—'}</b></p><p>🔥 Mejor racha: <b>${st?esc(st.nombre)+' · '+(st.mejor_racha||0):'—'}</b></p></div>`}
async function replay(){toast('Con el esquema RLS actual no se pueden borrar respuestas anteriores. Crearé una sala nueva para evitar duplicados.');setTimeout(()=>{cleanupRealtime();createRoom()},1400)}
function localSetup(){cleanupRealtime();role='localSetup';main.innerHTML=`<section class="card"><h2>📴 Jugar sin internet</h2><p>Todos juegan en este dispositivo. Ideal para proyector, pantalla táctil o computadora.</p><div class="form"><select id="count" class="input"><option value="2">2 equipos</option><option value="3">3 equipos</option><option value="4" selected>4 equipos</option></select><input id="n1" class="input" value="Equipo Azul"><input id="n2" class="input" value="Equipo Verde"><input id="n3" class="input" value="Equipo Naranja"><input id="n4" class="input" value="Equipo Morado"><button class="btn good" id="startLocal">Comenzar</button><button class="btn secondary" id="back">Volver</button></div></section>`;$('#startLocal').onpointerdown=()=>{let n=+$(`#count`).value,names=[1,2,3,4].slice(0,n).map(i=>$(`#n${i}`).value.trim()||`Equipo ${i}`);local={i:-1,start:0,teams:names.map((nombre,j)=>({id:'L'+j,nombre,color:COLORES[j],puntaje:0,racha:0,mejor_racha:0,correct:0,times:[],answered:false,op:null,ms:null})),revealed:false};localNext()};$('#back').onpointerdown=home}
function localNext(){audio();if(local.i>=0&&!local.revealed)return toast('Primero cierre la pregunta.');if(local.i>=19)return localFinal();local.i++;local.revealed=false;local.start=performance.now();local.teams.forEach(t=>{t.answered=false;t.op=null;t.ms=null});if(local.i===15){sfx('siren');toast('⚡ RONDA RELÁMPAGO: 10 segundos y puntos dobles!',3000)}renderLocal();local._timer=setInterval(()=>{if(performance.now()-local.start>=qDuration(local.i)*1000){clearInterval(local._timer);localReveal()}else renderLocalTimer()},100)}
function renderLocal(){let q=PREGUNTAS[local.i];main.innerHTML=`<section class="card">${roomHeaderLocal()}<div class="question">${esc(q.q)}</div><div class="timerNum" id="timerNum">${qDuration(local.i).toFixed(1)} s</div><div class="bar"><i id="timeBar"></i></div>${local.teams.map(t=>`<div class="localTeam" style="--team:${CSSCOLOR[t.color]}"><b>${esc(t.nombre)} · ${t.puntaje} pts · 🔥 ${t.racha}</b>${t.answered?`<div>Respuesta enviada ✅ · ${fmtMs(t.ms)}</div>`:`<div class="localBtns">${q.o.map((_,j)=>`<button data-t="${t.id}" data-o="${j}">${'ABCD'[j]}</button>`).join('')}</div>`}</div>`).join('')}<div class="actions"><button class="btn warn" id="closeLocal">Cerrar pregunta</button></div></section>`;document.querySelectorAll('.localBtns button').forEach(b=>b.onpointerdown=()=>localAnswer(b.dataset.t,+b.dataset.o));$('#closeLocal').onpointerdown=localReveal;renderLocalTimer()}
function roomHeaderLocal(){return `<div class="counter">📴 Local · Pregunta ${local.i+1} de 20 ${local.i>=15?'· ⚡ ×2':''}</div>`}
function renderLocalTimer(){let n=$('#timerNum'),b=$('#timeBar');if(!n||!b)return;let dur=qDuration(local.i)*1000,left=Math.max(0,dur-(performance.now()-local.start)),pct=left/dur*100;n.textContent=(left/1000).toFixed(1)+' s';b.style.width=pct+'%';b.style.background=pct>50?'#20c979':pct>25?'#ffd34d':'#ff4560'}
function localAnswer(id,op){let t=local.teams.find(x=>x.id===id);if(!t||t.answered||local.revealed)return;t.answered=true;t.op=op;t.ms=Math.round(performance.now()-local.start);sfx('pop');renderLocal();if(local.teams.every(x=>x.answered))setTimeout(localReveal,1500)}
function localReveal(){if(local.revealed)return;clearInterval(local._timer);local.revealed=true;let q=PREGUNTAS[local.i],arr=local.teams.filter(t=>t.answered).sort((a,b)=>a.ms-b.ms);for(let t of local.teams){let ok=t.op===q.c,idx=arr.indexOf(t);if(ok){t.racha++;t.correct++;t.times.push(t.ms);let dur=qDuration(local.i)*1000,speed=Math.round(100*Math.max(0,dur-t.ms)/dur),g=100+speed+([50,30,20,10][idx]||0)+(t.racha>=3?25:0);t.puntaje+=(local.i>=15?g*2:g);t.mejor_racha=Math.max(t.mejor_racha,t.racha)}else t.racha=0}main.innerHTML=`<section class="card">${roomHeaderLocal()}<h2>Correcta: <span class="correct">${'ABCD'[q.c]}. ${esc(q.o[q.c])}</span></h2><p>${esc(q.e)}</p><h2>⚡ Orden de llegada</h2>${arr.map((t,i)=>`<div class="arrivalRow"><b>${medal(i)}</b><span>${esc(t.nombre)}</span><span>${fmtMs(t.ms)}</span><span>${t.op===q.c?'✅':'❌'}</span></div>`).join('')}<div class="actions"><button class="btn good" id="lnext">${local.i===19?'Ver podio':'Siguiente ▶'}</button></div></section>`;$('#lnext').onpointerdown=localNext}
function localFinal(){sfx('fan');confetti(80);let r=[...local.teams].sort((a,b)=>b.puntaje-a.puntaje),last=null,pos=0,fast=[...local.teams].sort((a,b)=>(a.times.reduce((s,x)=>s+x,0)/Math.max(1,a.times.length))-(b.times.reduce((s,x)=>s+x,0)/Math.max(1,b.times.length)))[0],acc=[...local.teams].sort((a,b)=>b.correct-a.correct)[0],st=[...local.teams].sort((a,b)=>b.mejor_racha-a.mejor_racha)[0];main.innerHTML=`<section class="card hero"><h1>🏆 Podio</h1><div class="podium">${r.map((t,i)=>{if(t.puntaje!==last){pos=i+1;last=t.puntaje}return `<div class="pod p${i+1}" style="--team:${CSSCOLOR[t.color]}"><div class="rank">${pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':'4º'}</div><b>${esc(t.nombre)}</b><div>${t.puntaje}</div></div>`}).join('')}</div><div class="card"><p>⚡ Más rápido: <b>${esc(fast.nombre)}</b></p><p>🎯 Más aciertos: <b>${esc(acc.nombre)} · ${acc.correct}</b></p><p>🔥 Mejor racha: <b>${esc(st.nombre)} · ${st.mejor_racha}</b></p></div><h2>¡Increíble trabajo de todos!</h2><div class="actions"><button class="btn good" id="localAgain">Jugar de nuevo</button><button class="btn secondary" id="home">Inicio</button></div></section>`;$('#localAgain').onpointerdown=localSetup;$('#home').onpointerdown=home}
$('#soundBtn').onpointerdown=()=>{muted=!muted;$('#soundBtn').textContent=muted?'🔇':'🔊';if(muted)stopMusic();else{audio();startMusic()}};$('#fullBtn').onpointerdown=full;window.addEventListener('online',()=>{setConn(true);if(sb&&sala)refresh()});window.addEventListener('offline',()=>setConn(false));document.addEventListener('pointerdown',()=>audio(),{once:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&role==='team')keepAwake()});
(async()=>{if(configured())await initSB();else setConn(false,'🟠 Supabase sin configurar');home()})();
</script></body></html>
