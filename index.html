<style>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// ▼▼ Pega aquí la URL del proyecto y la clave "anon/publishable" (NUNCA la service_role) ▼▼
const CONFIG={url:'https://luewrpzgetqslxqmdcxv.supabase.co',key:'sb_publishable_zJc68aiTxJs7HBgaqeHxrQ_JDcm91xG'};
const sb=createClient(CONFIG.url||'https://sin-configurar.supabase.co',CONFIG.key||'sin-configurar');
const $=s=>document.querySelector(s),app=$('#app'),draw=h=>app.innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
const TIPOS={multiple:'Selección múltiple',verdadero_falso:'Verdadero o falso',completar:'Completar el espacio',relacionar:'Relacionar columnas',ordenar:'Ordenar la secuencia'};
const etiquetaEval=t=>t==='e3'?'Evaluación 3':t==='e2'?'Evaluación 2':'Evaluación 1';
let MODO_E='e2'; // motor de técnicas que ve el estudiante: 'e2' o 'e3'
const tecnicasDe=m=>m==='e3'?E3_TECNICAS:E2_TECNICAS;
function claveMarca(tipo){const p=window.__ciaPeriodoActual;return 'cia-realizado:'+est?.id+':'+(p?.id||'sin-periodo')+':'+(p?.tecnica||'defecto')+':'+tipo;}
function marcarRealizado(tipo){try{localStorage.setItem(claveMarca(tipo),'1');}catch(e){console.warn('No se pudo guardar marca local',e);}}
async function recuperarRealizados(){
 if(!est?.cedula)return;
 try{const {data,error}=await sb.rpc('cia_marcas_realizadas',{p_cedula:est.cedula});
 if(error)throw error;const p=window.__ciaPeriodoActual;
 for(const x of (Array.isArray(data)?data:[])){if(String(x.periodo_id||'sin-periodo')===String(p?.id||'sin-periodo')){try{localStorage.setItem(claveMarca(x.tipo),'1')}catch(_){}}}
 pintarRealizados();
 }catch(e){console.warn('Marcas de servidor no disponibles; se mantienen las locales:',e.message)}
}
async function registrarRealizadoServidor(tipo){
 try{
  const {error}=await sb.rpc('cia_registrar_marca',{p_cedula:est.cedula,p_periodo:window.__ciaPeriodoActual?.id||null,p_tipo:tipo});
  if(error)throw error;
  marcarRealizado(tipo);
  pintarRealizados();
  return true;
 }catch(e){console.warn('No se pudo sincronizar marca:',e.message||e);return false;}
}
function pintarRealizados(){document.querySelectorAll('[data-t],[data-e2t]').forEach(b=>{const tipo=b.dataset.t?'banco:'+b.dataset.t:MODO_E+':'+b.dataset.e2t;try{b.classList.toggle('practica-hecha',localStorage.getItem(claveMarca(tipo))==='1');}catch(e){}});}
const META=18; // 18 por tipo x 5 tipos = 90 preguntas (mínimo pedido: 80)
let est=null;
const fmt=c=>Array.isArray(c)?(Array.isArray(c[0])?c.map(p=>p.join(' = ')).join('; '):c.join(' → ')):c;

function inicio(){draw(`<div class=card><h2>¿Quién eres?</h2>${CONFIG.url?'':'<p class=err>Falta configurar Supabase en index.html (CONFIG).</p>'}<button class=big id=e>Soy estudiante</button><button class="big sec" id=d>Soy docente</button></div>`);$('#e').onclick=loginEst;$('#d').onclick=loginDoc;}

/* ---------- ESTUDIANTE ---------- */
function loginEst(){draw(`<div class=card><h2>Ingreso de estudiante</h2><p>Escribe tu cédula tal como aparece en la matrícula. El sistema identifica tu grado y salón automáticamente.</p><label>Cédula<input id=c inputmode=text autocomplete=off placeholder="Ejemplo: 3-123-456"></label><p class=err id=m></p><button id=go>Entrar</button><button class=sec id=b>Volver</button></div>`);
$('#b').onclick=inicio;
$('#c').onkeydown=e=>{if(e.key==='Enter')$('#go').click();};
$('#go').onclick=async()=>{const c=$('#c').value.trim();if(!c)return $('#m').textContent='Escribe tu cédula.';
 const boton=$('#go');boton.disabled=true;$('#m').textContent='Comprobando matrícula…';
 try{const {data,error}=await sb.rpc('cia_ingresar_cedula',{p_cedula:c});if(error){$('#m').textContent=error.code==='PGRST202'?'Primero ejecute cia_acceso_solo_cedula.sql en Supabase.':error.message;return;}
 if(!data||!data.id){$('#m').textContent='No se encontró una cédula única en la matrícula. Consulte al profesor.';return;}
 est={...data,cedula:c,nombreVerificacion:data.nombres};menu();}finally{boton.disabled=false;}};}
async function tecnicaActiva(){try{const {data,error}=await sb.rpc('cia_tecnica_activa',{p_cedula:est.cedula});return !error&&(data==='e2'||data==='e3')?data:'banco';}catch{return 'banco';}}
async function obtenerPeriodo(){
 try{const {data,error}=await sb.rpc('cia_periodo_activo',{p_cedula:est.cedula});if(error)throw error;return {periodo:Array.isArray(data)?data[0]:data,error:null};}
 catch(e){return {periodo:null,error:e.message||String(e)};}
}
function periodoHtml(p){if(!p)return '<div class="card"><h3>Prácticas para estudiantes</h3><p>No hay un periodo vigente para tu salón.</p></div>';
 const cierre=p.fin||p.cierre,fecha=cierre?new Date(cierre):null;const sinFin=fecha&&fecha.getFullYear()>=2099;
 return `<div class="card"><h3>${esc(p.titulo||'Periodo de práctica')}</h3><p class="s">${esc(p.inicio?new Date(p.inicio).toLocaleString('es-PA'):'')} — ${esc(fecha&&!isNaN(fecha)?(sinFin?'Sin fecha de cierre':fecha.toLocaleString('es-PA')):'')}</p><b id="periodo-reloj">Calculando tiempo…</b><div id="periodo-notas" class="wrap"><p class="s">Consultando notas…</p></div></div>`;
}
let periodoReloj=null;
function iniciarReloj(p){if(periodoReloj)clearInterval(periodoReloj);if(!p)return;
 const fin=new Date(p.fin||p.cierre).getTime();if(new Date(p.fin||p.cierre).getFullYear()>=2099){const el=$('#periodo-reloj');if(el)el.textContent='Práctica abierta · sin fecha de cierre';return;}const actualizar=()=>{const el=$('#periodo-reloj');if(!el){clearInterval(periodoReloj);periodoReloj=null;return;}if(!Number.isFinite(fin)){el.textContent='Cierre sin fecha válida';return;}let t=Math.max(0,Math.floor((fin-Date.now())/1000));if(!t){el.textContent='Cerrado';app.querySelectorAll('[data-t],[data-e2t]').forEach(b=>b.disabled=true);return;}const d=Math.floor(t/86400);t%=86400;el.textContent=`Te faltan ${d} días ${Math.floor(t/3600)} horas ${Math.floor(t%3600/60)} minutos`;};actualizar();periodoReloj=setInterval(actualizar,15000);
}
async function mostrarNotasPeriodo(){const el=$('#periodo-notas');if(!el)return;const {data,error}=await sb.rpc('cia_periodo_notas',{p_est:est.id});if(!$('#periodo-notas'))return;if(error){el.textContent='No se pudieron consultar las notas: '+error.message;return;}
 const filas=Array.isArray(data)?data:(data?.practicas||data?.notas||[]);if(!Array.isArray(filas)||!filas.length){el.innerHTML='<p class="s">Todavía no hay notas para este periodo.</p>';return;}
 const nota=x=>{const n=Number(x);return Number.isFinite(n)?n.toFixed(2):'1.00'};
 const periodoActual=window.__ciaPeriodoActual;
 const tipos=['e2','e3'].includes(periodoActual?.tecnica)?tecnicasDe(periodoActual.tecnica):TIPOS;
 const detalle=filas.filter(f=>tipos[f.practica||f.tipo||f.tecnica||f.nombre]);
 const completas=detalle.length===5;
 const items=Object.entries(tipos).map(([clave,nombre])=>{
   const f=detalle.find(x=>(x.practica||x.tipo||x.tecnica||x.nombre)===clave);
   return `<tr><td>${esc(nombre)}</td><td>${nota(f?.mejor_nota??f?.nota_5??f?.nota??1)}</td></tr>`;
 });
 const promedio=Object.keys(tipos).reduce((suma,k)=>{
   const f=detalle.find(x=>(x.practica||x.tipo||x.tecnica||x.nombre)===k);
   return suma+Number(f?.mejor_nota??f?.nota_5??f?.nota??1);
 },0)/5;
 el.innerHTML=`<table><thead><tr><th>Práctica</th><th>Mejor nota</th></tr></thead><tbody>${items.join('')}</tbody></table><p><b>Nota final: ${nota(promedio)} / 5.00</b></p>${!completas?'<p class="s">Aviso: Supabase no está devolviendo el detalle de las cinco prácticas; las notas faltantes aparecen como 1.00 hasta corregir la función SQL.</p>':''}`;
}
async function menu(auto){const consulta=await obtenerPeriodo(),periodo=consulta.periodo;window.__ciaPeriodoActual=periodo;const activa=periodo?(['e2','e3'].includes(periodo.tecnica)?periodo.tecnica:'banco'):await tecnicaActiva();MODO_E=activa;const cerrado=periodo&&new Date(periodo.fin||periodo.cierre).getTime()<=Date.now();draw(`<div class=card><h2>Hola, ${esc(est.nombres)}</h2>${activa!=='banco'?`<p>Elige tu ejercicio. Cada intento trae 8 preguntas. Responde todas antes de enviar.</p>${e2PanelHTML()}`:`<p>Elige un ejercicio. Cada intento trae 8 preguntas distintas. Responde todas antes de enviar.</p>${`<h3>Evaluación 1</h3><div class="practicas-grid">`+Object.entries(TIPOS).map(([k,v])=>`<button class=big data-t=${k}>${v}</button>`).join('')+`</div>`}`}<p class=err id=m></p><button class=sec id=s>Salir</button></div>${periodoHtml(periodo)}`);if(periodo){iniciarReloj(periodo);await mostrarNotasPeriodo();}pintarRealizados();await recuperarRealizados();if(cerrado)app.querySelectorAll('[data-t],[data-e2t]').forEach(b=>b.disabled=true);
const contenedor=document.createElement('div');contenedor.className='card';contenedor.innerHTML='<h2>Evaluaciones asignadas</h2><p id=ev-est-msg>Buscando evaluaciones vigentes…</p><div id=ev-est-list></div><button class=sec id=ev-est-recargar>Actualizar evaluaciones</button>';app.append(contenedor);
 const historial=document.createElement('div');historial.className='card';historial.innerHTML='<h2>Mi historial de evaluaciones</h2><p id=hist-estado>Consultando intentos…</p><div class=wrap id=hist-tabla></div><button class=sec id=hist-actualizar>Actualizar historial</button>';app.append(historial);
 const cargarHistorial=async()=>{const {data,error}=await sb.rpc('cia_eval_historial',{p_est:est.id,p_cedula:est.cedula,p_nombre:est.nombreVerificacion});const estado=$('#hist-estado'),tabla=$('#hist-tabla');if(!estado||!tabla)return;if(error){estado.textContent='Historial no disponible: '+error.message;return;}const filas=data||[];estado.textContent=filas.length?`${filas.length} intento(s) registrado(s). La mejor nota se calcula por evaluación y día.`:'Aún no hay intentos registrados.';tabla.innerHTML=filas.length?`<table><tr><th>Evaluación</th><th>Fecha</th><th>Estado</th><th>Nota</th><th>Mejor del día</th></tr>${filas.map(x=>`<tr><td>${esc(x.titulo)}</td><td>${esc(new Date(x.inicio).toLocaleString('es-PA'))}</td><td>${x.enviado_en?'Entregado':'Pendiente'}</td><td>${x.nota_5==null?'—':Number(x.nota_5).toFixed(2)}</td><td>${x.mejor_dia==null?'—':Number(x.mejor_dia).toFixed(2)}</td></tr>`).join('')}</table>`:'';};$('#hist-actualizar').onclick=cargarHistorial;await cargarHistorial();

// Mezcla Fisher-Yates: se aplica una sola vez por intento, nunca al volver atrás.
function mezclarOpciones(valores){const a=[...valores];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quiz(d,tipoPractica){
 const opcionesIntento=new Map();
 for(const q of d.preguntas){const x=q.datos||{};
  if(q.tipo==='multiple'||q.tipo==='completar')opcionesIntento.set(q.id,mezclarOpciones(x.opciones||[]));
  else if(q.tipo==='verdadero_falso')opcionesIntento.set(q.id,mezclarOpciones(['Verdadero','Falso']));
  else if(q.tipo==='relacionar')opcionesIntento.set(q.id,mezclarOpciones(x.der||[]));
  else if(q.tipo==='ordenar')opcionesIntento.set(q.id,mezclarOpciones(x.items||[]));
 }
 let i=0;const R={};const inicioIntento=Date.now();let enviando=false;
 const resumen=()=>{const total=d.preguntas.length,contestadas=d.preguntas.filter(q=>R[q.id]!==undefined).length;return `${contestadas} de ${total} respondidas`;};
 const enviar=async()=>{if(enviando)return;const pendientes=d.preguntas.filter(q=>R[q.id]===undefined);if(pendientes.length){alert(`Faltan ${pendientes.length} preguntas por responder.`);return;}if(!confirm(`¿Enviar las ${d.preguntas.length} respuestas para calificar? No podrá modificarlas después.`))return;enviando=true;draw('<div class=card><h2>Guardando respuestas…</h2><p>Espere mientras Supabase calcula su resultado.</p></div>');const {data,error}=await sb.rpc('cia_enviar',{p_est:est.id,p_intento:d.intento,p_resp:R});if(error){enviando=false;draw(`<div class=card><h2>No se pudo enviar</h2><p class=err>${esc(error.message)}</p><button id=reintentar>Reintentar envío</button></div>`);$('#reintentar').onclick=enviar;return;}marcarRealizado("banco:"+tipoPractica);await registrarRealizadoServidor("banco:"+tipoPractica);resultado(data);};
 const paso=()=>{const q=d.preguntas[i],x=q.datos;let cu='';
  if(q.tipo=='multiple'||q.tipo=='completar')cu=opcionesIntento.get(q.id).map(o=>`<button class=op data-v="${esc(o)}">${esc(o)}</button>`).join('');
  else if(q.tipo=='verdadero_falso')cu=opcionesIntento.get(q.id).map(o=>`<button class=op data-v="${o}">${o}</button>`).join('');
  else if(q.tipo=='relacionar')cu=x.izq.map(a=>`<label>${esc(a)}<select data-a="${esc(a)}"><option value="">Elige…</option>${opcionesIntento.get(q.id).map(b=>`<option>${esc(b)}</option>`).join('')}</select></label>`).join('');
  else{R[q.id]=R[q.id]||[...opcionesIntento.get(q.id)];cu='<div id=lst></div>';}
  draw(`<div class=card><div class=bar><i style="width:${i/d.preguntas.length*100}%"></i></div><p class=s>Pregunta ${i+1} de ${d.preguntas.length} · ${resumen()}</p><h3>${esc(q.enunciado)}</h3>${cu}<p class=err id=m></p><button id=nx>${i<d.preguntas.length-1?'Siguiente':'Revisar y enviar'}</button><button class=sec id=anterior ${i===0?'disabled':''}>Anterior</button><p class=s>Tiempo transcurrido: ${Math.floor((Date.now()-inicioIntento)/60000)} minutos</p></div>`);
  app.querySelectorAll('.op').forEach(b=>{b.classList.toggle('sel',R[q.id]===b.dataset.v);b.onclick=()=>{R[q.id]=b.dataset.v;app.querySelectorAll('.op').forEach(o=>o.classList.toggle('sel',o==b));};});
  app.querySelectorAll('select').forEach(s=>{s.value=R[q.id]?.[s.dataset.a]||'';s.onchange=()=>{(R[q.id]=R[q.id]||{})[s.dataset.a]=s.value;};});
  if(q.tipo=='ordenar'){const L=()=>{$('#lst').innerHTML=R[q.id].map((o,k)=>`<div class=row><span>${k+1}. ${esc(o)}</span><span><button class=sec data-m="${k}:-1" aria-label="Subir">▲</button><button class=sec data-m="${k}:1" aria-label="Bajar">▼</button></span></div>`).join('');
   $('#lst').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const [k,s]=b.dataset.m.split(':').map(Number),a=R[q.id];if(a[k+s]===undefined)return;[a[k],a[k+s]]=[a[k+s],a[k]];L();});};L();}
  $('#anterior').onclick=()=>{if(i>0){i--;paso();}};
  $('#nx').onclick=()=>{const r=R[q.id];if(q.tipo==='relacionar'?(!r||x.izq.some(a=>!r[a])):r===undefined||r===null||r==='')return $('#m').textContent='Responde antes de continuar.';if(i<d.preguntas.length-1){i++;return paso();}const faltan=d.preguntas.filter(v=>R[v.id]===undefined).length;draw(`<div class=card><h2>Revisar intento</h2><p>${resumen()}</p><p>${faltan?'Aún faltan '+faltan+' respuestas.':'Todas las respuestas están registradas.'}</p><p>Tiempo transcurrido: ${Math.floor((Date.now()-inicioIntento)/60000)} minutos.</p><button id=confirmar ${faltan?'disabled':''}>Enviar y calificar</button><button class=sec id=volver>Volver a revisar</button></div>`);$('#confirmar').onclick=enviar;$('#volver').onclick=()=>{i=d.preguntas.length-1;paso();};};};
 paso();}
function quizEvaluacion(d){let pos=0,env=false;const respuestas={};const preguntas=d.preguntas||[];const opcionesEvaluacion=new Map(preguntas.map(q=>[q.id,mezclarOpciones(q.datos?.opciones|| (q.tipo==='verdadero_falso'?['Verdadero','Falso']:[]))]));const vence=new Date(d.vence).getTime();let reloj;
 const tiempo=()=>Math.max(0,Math.ceil((vence-Date.now())/1000));
 const entregar=async(forzado=false)=>{if(env)return;if(!forzado&&!confirm('¿Entregar la evaluación? Ya no podrá modificar sus respuestas.'))return;env=true;clearInterval(reloj);draw('<div class=card><h2>Calificando evaluación…</h2></div>');const {data,error}=await sb.rpc('cia_eval_entregar',{p_est:est.id,p_cedula:est.cedula,p_nombre:est.nombreVerificacion,p_intento:d.intento,p_respuestas:respuestas});if(error){draw(`<div class=card><h2>Problema al entregar</h2><p class=err>${esc(error.message)}</p><button id=reintentar>Reintentar</button></div>`);$('#reintentar').onclick=()=>{env=false;entregar(true)};return;}draw(`<div class=card><h2>Evaluación entregada</h2><p>Calificación: <b>${Number(data.nota_5).toFixed(2)} / 5.00</b></p><p>Aciertos: ${data.aciertos} de ${data.total}</p><button id=volver>Volver a mis actividades</button></div>`);$('#volver').onclick=menu;};
 const mostrar=()=>{if(tiempo()<=0)return entregar(true);const q=preguntas[pos],op=opcionesEvaluacion.get(q.id);draw(`<div class=card><h2>${esc(d.titulo)}</h2><p>Pregunta ${pos+1} de ${preguntas.length} · <strong id=cronometro></strong></p><div class=bar><i style="width:${100*(pos+1)/preguntas.length}%"></i></div><h3>${esc(q.enunciado)}</h3>${op.map(o=>`<button class="op ${respuestas[q.id]===o?'sel':''}" data-resp="${esc(o)}">${esc(o)}</button>`).join('')}<p class=err id=aviso></p><button id=atras ${pos===0?'disabled':''}>Anterior</button><button id=adelante>${pos===preguntas.length-1?'Revisar y entregar':'Siguiente'}</button><button class=sec id=entregar>Entregar ahora</button></div>`);app.querySelectorAll('[data-resp]').forEach(b=>b.onclick=()=>{respuestas[q.id]=b.dataset.resp;app.querySelectorAll('[data-resp]').forEach(x=>x.classList.toggle('sel',x===b));});$('#atras').onclick=()=>{pos--;mostrar()};$('#adelante').onclick=()=>{if(pos<preguntas.length-1){pos++;mostrar()}else{const sin=preguntas.filter(x=>respuestas[x.id]===undefined).length;if(sin&&!confirm(`Quedan ${sin} preguntas sin responder. ¿Desea entregar?`))return;entregar()}};$('#entregar').onclick=()=>entregar();actualizar();};
 $('#ev-asignar-preguntas').onclick=async()=>{const st=$('#ev-asignar-estado'),cat=$('#ev-catalogo').value;if(!cat)return st.textContent='Seleccione primero una evaluación del catálogo.';const materia=$('#ev-materia').value,grado=$('#ev-grupo').value.split('|')[0];if(!materia||!grado)return st.textContent='Seleccione materia y salón.';const elegibles=banco.filter(x=>{const c=clasePorId.get(x.id);return c&&c.materia_id===materia&&String(c.grado)===grado&&(!$('#ev-tema').value||(x.tema||'Sin tema')===$('#ev-tema').value)&&(!$('#ev-nivel').value||x.nivel===$('#ev-nivel').value);});if(!elegibles.length)return st.textContent='No hay preguntas con esos filtros.';if(!confirm(`¿Vincular ${elegibles.length} preguntas a esta evaluación?`))return;const ya=idsCatalogo.get(cat)||new Set(),nuevas=elegibles.filter(x=>!ya.has(String(x.id)));if(!nuevas.length)return st.textContent='Todas estas preguntas ya estaban vinculadas.';const b=$('#ev-asignar-preguntas');b.disabled=true;let total=0;for(let i=0;i<nuevas.length;i+=100){const lote=nuevas.slice(i,i+100).map(x=>({docente_id:uid,catalogo_id:Number(cat),pregunta_id:x.id}));const {error}=await sb.from('cia_catalogo_preguntas').insert(lote);if(error){st.textContent='Error: '+error.message;b.disabled=false;return;}for(const x of nuevas.slice(i,i+100))ya.add(String(x.id));total+=lote.length;}idsCatalogo.set(cat,ya);st.textContent=`${total} preguntas vinculadas correctamente.`;b.disabled=false;actualizar();};
 const actualizar=()=>{const c=$('#cronometro');if(c)c.textContent=`Tiempo restante: ${Math.floor(tiempo()/60)}:${String(tiempo()%60).padStart(2,'0')}`;if(tiempo()<=0){clearInterval(reloj);entregar(true)}};mostrar();reloj=setInterval(actualizar,1000);

async function tBanco(uid){
 const {data:pr,error}=await sb.from('cia_preguntas').select('id,enunciado,tema,nivel,creado_en').eq('docente_id',uid).order('creado_en',{ascending:false});
 if(error){$('#v').innerHTML=`<div class=card>${avisoError(error)}</div>`;return;}
 const niveles={facil:0,medio:0,dificil:0};const temas=new Map();
 pr.forEach(p=>{if(p.nivel in niveles)niveles[p.nivel]++;const tema=(p.tema||'Sin tema').trim();temas.set(tema,(temas.get(tema)||0)+1);});
 const temasOrdenados=[...temas.entries()].sort((a,b)=>b[1]-a[1]);
 const conteos=new Map();pr.forEach(p=>{const k=clavePregunta(p.enunciado);conteos.set(k,(conteos.get(k)||0)+1);});
 const repetidas=pr.filter(p=>conteos.get(clavePregunta(p.enunciado))>1).length;
 $('#v').innerHTML=`<div class=card><h2>Banco de preguntas: ${pr.length}</h2><p class=s>Suba un PDF con texto y genere preguntas mediante Gemini (plan gratuito sujeto a límites).</p><label>PDF de la clase<input id=pdf type=file accept="application/pdf"></label><p id=fu class=s></p><label>Nombre del banco<input id=bn placeholder="Ej. La célula, 9.º grado"></label><label>Cantidad<select id=cant><option selected>20</option><option>40</option><option>60</option><option>80</option></select></label><label>Técnicas de preguntas<select id=tecnicas multiple size=6><option value="seleccion_multiple" selected>Selección múltiple</option><option value="verdadero_falso" selected>Verdadero o falso</option><option value="completar" selected>Completar</option><option value="relacionar" selected>Relacionar columnas</option><option value="ordenar" selected>Ordenar secuencia</option><option value="caso" selected>Casos prácticos</option></select></label><p class=s>Use Ctrl para seleccionar varias técnicas. Las preguntas se revisan antes de guardarse.</p><button id=gen disabled>Generar preguntas con IA</button><p class=s id=st role=status>Primero seleccione un PDF. Revise las preguntas antes de guardarlas.</p><div id=prev></div></div><div class=card><h3>Resumen del banco</h3><div class="resumen-banco"><div><b>${pr.length}</b><span>Total</span></div><div><b>${niveles.facil}</b><span>Fáciles</span></div><div><b>${niveles.medio}</b><span>Medias</span></div><div><b>${niveles.dificil}</b><span>Difíciles</span></div></div><p class=s><b>Temas:</b> ${temasOrdenados.map(([tema,cantidad])=>`${esc(tema)} (${cantidad})`).join(' · ')||'Sin preguntas'}</p><button id=pregunta-azar class=sec ${pr.length?'':'disabled'}>Revisar pregunta al azar</button><p id=azar-estado class=s role=status></p><button id=exportar-csv class=sec ${pr.length?'':'disabled'}>Exportar CSV</button><button id=exportar-filtradas class=sec ${pr.length?'':'disabled'}>Exportar preguntas filtradas CSV</button><button id=exportar-json class=sec ${pr.length?'':'disabled'}>Respaldar JSON completo</button><p class=s>Las exportaciones contienen únicamente preguntas del docente conectado. El JSON incluye respuestas y explicaciones: no lo comparta con estudiantes.</p><p id=estado-exportacion class=s role=status></p></div><div class=card><h3>Herramientas docentes · 5 etapas</h3><p class=s>Revisión y preparación de evaluaciones. Estas herramientas no modifican las notas ni las preguntas.</p><button id=auditar-banco class=sec>1. Auditar calidad</button><button id=descargar-auditoria class=sec>2. Descargar auditoría CSV</button><button id=practica-docente class=sec>3. Practicar 10 preguntas</button><button id=imprimir-banco class=sec>4. Imprimir banco filtrado</button><button id=descargar-practica class=sec>5. Exportar práctica JSON</button><p id=auditoria-resumen class=s role=status></p><div id=practica-panel></div></div><div class=card><h3>Preguntas guardadas</h3><p class=s>${repetidas} preguntas pertenecen a grupos con enunciados repetidos (revisión manual; no se elimina nada automáticamente).</p><label>Buscar pregunta o tema<input id=buscar-pregunta placeholder="Escriba para filtrar"></label><label>Filtrar por tema<select id=filtro-tema><option value="">Todos los temas</option>${temasOrdenados.map(([t])=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select></label><label>Filtrar por dificultad<select id=filtro-nivel><option value="">Todas</option><option value="facil">Fácil</option><option value="medio">Medio</option><option value="dificil">Difícil</option></select></label><label><input type=checkbox id=solo-repetidas> Mostrar solo repetidas</label><p id=contador-preguntas class=s></p><div id=lista-preguntas>${pr.map(p=>`<div class=row data-item data-busca="${esc((p.enunciado+' '+(p.tema||'')).toLowerCase())}" data-tema="${esc((p.tema||'Sin tema').trim())}" data-nivel="${esc(p.nivel||'')}" data-duplicada="${conteos.get(clavePregunta(p.enunciado))>1?'si':'no'}"><span><b>${esc(p.tema||'Sin tema')}</b> · ${esc(p.nivel||'Sin nivel')}<p>${esc(p.enunciado)}</p></span><span><button class=sec data-ver="${p.id}">Vista previa</button><button class=sec data-e="${p.id}">Editar</button><button class=sec data-del="${p.id}">Eliminar</button></span></div><hr>`).join('')||'<p>Aún no hay preguntas.</p>'}</div></div>`;
 // Etapa 2: publicación individual con revisión explícita del docente.
 const panelPublicacion=document.createElement('div');
 panelPublicacion.className='card';
 panelPublicacion.innerHTML='<h3>Enviar preguntas a prácticas rápidas</h3><p class="s">Solo se publican preguntas compatibles y aprobadas. No modifica preguntas ni notas existentes.</p><button id="ver-candidatas" class="sec">Consultar candidatas</button><p id="estado-candidatas" class="s" role="status"></p><div id="lista-candidatas"></div>';
 $('#v').appendChild(panelPublicacion);
 $('#ver-candidatas').onclick=async()=>{
  const estado=$('#estado-candidatas'),lista=$('#lista-candidatas');
  estado.textContent='Consultando preguntas...';lista.innerHTML='';
  const {data,error}=await sb.from('cia8_candidatas_desde_banco').select('pregunta_origen_id,enunciado,tipo_destino,estado').eq('docente_id',uid).order('enunciado');
  if(error){estado.textContent='No se pudo consultar. Ejecute primero el SQL de Etapa 2: '+error.message;return;}
  const candidatas=(data||[]).filter(x=>x.estado==='CANDIDATA_PARA_REVISION');
  estado.textContent=`${candidatas.length} candidatas para aprobar · ${(data||[]).length-candidatas.length} existentes o pendientes de adaptación.`;
  lista.innerHTML=candidatas.map(q=>`<div class="row"><span><b>${esc(q.tipo_destino)}</b><p>${esc(q.enunciado)}</p></span><button class="sec" data-publicar="${esc(q.pregunta_origen_id)}">Revisar y aprobar</button></div>`).join('')||'<p>No hay candidatas nuevas.</p>';
  lista.querySelectorAll('[data-publicar]').forEach(b=>b.onclick=async()=>{
   b.disabled=true;
   const {data:p,error:e}=await sb.from('cia_preguntas').select('enunciado,correcta,distractores,explicacion,tema').eq('id',b.dataset.publicar).eq('docente_id',uid).single();
   if(e){estado.textContent=e.message;b.disabled=false;return;}
   const opciones=Array.isArray(p.distractores)?p.distractores:[];
   if(!confirm(`REVISIÓN DOCENTE\n\n${p.enunciado}\n\nCorrecta: ${p.correcta}\nDistractores: ${opciones.join(' | ')}\n\n¿Aprobar y publicar esta pregunta para prácticas rápidas?`)){b.disabled=false;return;}
   const origen=b.dataset.publicar;
   try {
    const {data:r,error:re}=await sb.rpc('cia8_publicar_desde_banco',{p_origen:origen});
    if(re)throw new Error(re.message);
    // Una respuesta RPC positiva por sí sola no confirma la persistencia.
    const {data:v,error:ve}=await sb.from('cia8_origen_banco')
      .select('pregunta_practica_id').eq('pregunta_origen_id',origen).limit(1);
    if(ve)throw new Error('No se pudo verificar la publicación: '+ve.message);
    const destino=v?.[0]?.pregunta_practica_id;
    if(!destino){
     estado.textContent='No se confirmó la publicación en cia8_origen_banco. La pregunta permanece pendiente. Resultado RPC: '+JSON.stringify(r??null);
     b.disabled=false;return;
    }
    const {data:guardada,error:ge}=await sb.from('cia8_preguntas')
      .select('id').eq('id',destino).maybeSingle();
    if(ge)throw new Error('No se pudo verificar la pregunta publicada: '+ge.message);
    if(!guardada){estado.textContent='La vinculación existe, pero falta la pregunta de práctica. Revise Supabase.';b.disabled=false;return;}
    estado.textContent=r?.ya_existia?'Esta pregunta ya estaba publicada (verificada).':'Pregunta publicada y verificada en Supabase.';
    b.closest('.row').remove();
   }catch(err){estado.textContent='Publicación sin confirmar: '+err.message;b.disabled=false;}

  });
 };
 const visiblesBanco=()=>{const ids=new Set([...app.querySelectorAll('[data-item]')].filter(el=>!el.hidden).map(el=>el.querySelector('[data-e]').dataset.e));return pr.filter(p=>ids.has(String(p.id)));};
 const revisarCalidad=async()=>{const {data,error}=await sb.from('cia_preguntas').select('id,enunciado,correcta,distractores,explicacion,tema,nivel').eq('docente_id',uid);if(error)throw error;return(data||[]).map(p=>{const problemas=[];if(String(p.enunciado||'').trim().length<20)problemas.push('Enunciado corto');if(!String(p.correcta||'').trim())problemas.push('Sin respuesta');if(!String(p.explicacion||'').trim())problemas.push('Sin explicación');if(!String(p.tema||'').trim())problemas.push('Sin tema');if(!['facil','medio','dificil'].includes(p.nivel))problemas.push('Dificultad no reconocida');const opts=Array.isArray(p.distractores)?p.distractores:[];if(opts.length<2)problemas.push('Pocas opciones incorrectas');if(opts.some(x=>String(x).trim().toLowerCase()===String(p.correcta||'').trim().toLowerCase()))problemas.push('Respuesta repetida entre distractores');return {...p,problemas};});};
 $('#auditar-banco').onclick=async()=>{const el=$('#auditoria-resumen');el.textContent='Revisando preguntas...';try{const a=await revisarCalidad(),mal=a.filter(p=>p.problemas.length);el.textContent=`Revisadas ${a.length} preguntas. ${a.length-mal.length} sin alertas y ${mal.length} para revisar. Las alertas son orientativas.`;$('#practica-panel').innerHTML=mal.slice(0,30).map(p=>`<p><b>${esc(p.tema||'Sin tema')}</b>: ${esc(p.enunciado)} <span class=err>(${esc(p.problemas.join(', '))})</span></p>`).join('')||'<p>No se encontraron alertas.</p>';}catch(e){el.textContent='No se pudo auditar: '+e.message;}};
 $('#descargar-auditoria').onclick=async()=>{try{const a=await revisarCalidad();const filas=[['tema','nivel','enunciado','alertas'],...a.map(p=>[p.tema,p.nivel,p.enunciado,p.problemas.join('; ')])];descargarArchivo('cia_auditoria_preguntas.csv','\ufeff'+filas.map(r=>r.map(csvCelda).join(',')).join('\r\n'),'text/csv;charset=utf-8');$('#auditoria-resumen').textContent=`Auditoría exportada: ${a.length} preguntas.`;}catch(e){$('#auditoria-resumen').textContent=e.message;}};
 const obtenerPractica=async()=>{const ids=new Set(visiblesBanco().map(p=>String(p.id)));const {data,error}=await sb.from('cia_preguntas').select('id,enunciado,correcta,distractores,explicacion,tema,nivel').eq('docente_id',uid);if(error)throw error;return(data||[]).filter(p=>ids.has(String(p.id))).sort(()=>Math.random()-.5).slice(0,10);};

 $('#descargar-practica').onclick=async()=>{try{const qs=await obtenerPractica();if(!qs.length)return alert('No hay preguntas filtradas.');descargarArchivo('cia_practica_docente.json',JSON.stringify({tipo:'practica_docente',fecha:new Date().toISOString(),preguntas:qs.map(({enunciado,correcta,distractores,explicacion,tema,nivel})=>({enunciado,correcta,distractores,explicacion,tema,nivel}))},null,2),'application/json');$('#auditoria-resumen').textContent=`Práctica exportada: ${qs.length} preguntas. Contiene respuestas; no compartir con estudiantes.`;}catch(e){$('#auditoria-resumen').textContent=e.message;}};

 $('#exportar-json').onclick=async()=>{const b=$('#exportar-json');b.disabled=true;$('#estado-exportacion').textContent='Preparando respaldo...';try{const {data,error}=await sb.from('cia_preguntas').select('enunciado,correcta,distractores,explicacion,tema,nivel,metadatos').eq('docente_id',uid).order('creado_en',{ascending:false});if(error)throw error;descargarArchivo('cia_banco_respaldo.json',JSON.stringify({version:1,fecha:new Date().toISOString(),preguntas:data},null,2),'application/json');$('#estado-exportacion').textContent=`Respaldo descargado: ${data.length} preguntas.`;}catch(e){$('#estado-exportacion').textContent='Error al exportar: '+e.message;}finally{b.disabled=false;}};
 const filtrar=()=>{const bus=$('#buscar-pregunta').value.toLowerCase().trim(),nivel=$('#filtro-nivel').value,tema=$('#filtro-tema').value,solo=$('#solo-repetidas').checked;let visibles=0;app.querySelectorAll('[data-item]').forEach(el=>{const mostrar=el.dataset.busca.includes(bus)&&(!nivel||el.dataset.nivel===nivel)&&(!tema||el.dataset.tema===tema)&&(!solo||el.dataset.duplicada==='si');el.hidden=!mostrar;if(mostrar)visibles++;});$('#contador-preguntas').textContent=`Mostrando ${visibles} de ${pr.length} preguntas`;};

async function ciaResultadosPeriodos(uid){
 const host=document.querySelector('#cia-resultados-periodos');
 if(!host)return;
 const {data:periodos,error}=await sb.from('cia_periodos').select('id,titulo,tecnica,grado,seccion,inicio,fin').eq('docente_id',uid).order('inicio',{ascending:false});

 if(!periodos?.length){host.innerHTML='<p class=s>No hay periodos de práctica registrados.</p>';return;}
 host.innerHTML='<h2>Estadísticas y notas por periodo</h2><p class=s>Resultados reales consultados desde Supabase. Seleccione un periodo para revisar las notas de su salón y exportar el CSV. Si una consulta falla, no se inventan calificaciones.</p><label>Periodo<select id="cia-periodo-resultado">'+periodos.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.titulo+' · '+p.grado+'° '+(p.seccion||'Todas')+' · '+etiquetaEval(p.tecnica))+'</option>').join('')+'</select></label><p class=s id="cia-periodo-estado"></p><div class=wrap id="cia-periodo-tabla"></div><button id="cia-periodo-csv" disabled>Exportar periodo CSV</button>';
 const selector=host.querySelector('#cia-periodo-resultado'),estado=host.querySelector('#cia-periodo-estado'),tabla=host.querySelector('#cia-periodo-tabla'),boton=host.querySelector('#cia-periodo-csv');
 const resumen=document.createElement('div');resumen.id='cia-estadisticas-salon';resumen.setAttribute('aria-live','polite');tabla.before(resumen);
 let exportRows=[],exportHeaders=[];
 async function cargar(){
  const id=selector.value,p=periodos.find(x=>String(x.id)===id);
  estado.textContent='Cargando notas…';tabla.innerHTML='';resumen.innerHTML='';boton.disabled=true;
  try{
   /* La función SQL del docente debe aceptar p_periodo y verificar la identidad del docente. */
   const {data,error}=await sb.rpc('cia_periodo_resultados_v2',{p_periodo:id});
   if(error)throw error;
   const filas=Array.isArray(data)?data:(Array.isArray(data?.estudiantes)?data.estudiantes:[]);
   const tipos=p.tecnica==='e3'?['errores3','mision3','prediccion3','clasificacion3','evidencia3']:p.tecnica==='e2'?['detective','quien','causa','mito','casos']:['multiple','verdadero_falso','completar','relacionar','ordenar'];

   const nota=(r,t,i)=>{const x=r[t]??r['nota_'+t]??r['nota'+(i+1)]??r.notas?.[t]??r.notas?.[i];return x===undefined||x===null?'—':Number(x).toFixed(2);};
   exportHeaders=['Nombre','Cédula','Grado','Sección',...nombres,'Nota final'];

   tabla.innerHTML='<table><thead><tr>'+exportHeaders.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+(exportRows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(String(v))+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="9">Sin estudiantes para este periodo</td></tr>')+'</tbody></table>';
   const {data:estadisticas,error:errorEst}=await sb.rpc('cia_periodo_estadisticas_v2',{p_periodo:id});
   if(errorEst){resumen.innerHTML='<p class=s role=alert>Estadísticas no disponibles: '+esc(errorEst.message)+'</p>';}
   else {
     const datos=Array.isArray(estadisticas)?estadisticas:[];
     resumen.innerHTML='<h3>Estadísticas reales por salón</h3>'+(datos.length?'<div class=wrap><table><thead><tr><th>Grado</th><th>Salón</th><th>Estudiantes</th><th>Con entregas</th><th>Promedio</th></tr></thead><tbody>'+datos.map(r=>'<tr><td>'+esc(String(r.grado??''))+'</td><td>'+esc(String(r.seccion??''))+'</td><td>'+esc(String(r.estudiantes??0))+'</td><td>'+esc(String(r.con_entregas??0))+'</td><td>'+esc(r.promedio==null?'—':Number(r.promedio).toFixed(2))+'</td></tr>').join('')+'</tbody></table></div>':'<p class=s>Sin estadísticas para este periodo.</p>');
   }
   estado.textContent=filas.length+' estudiante(s) · Sin entrega: — (no se calcula nota ficticia en el navegador) · '+new Date(p.inicio).toLocaleString('es-PA')+' – '+new Date(p.fin).toLocaleString('es-PA');
   boton.disabled=!filas.length;
  }catch(e){resumen.innerHTML='';estado.textContent='No se pudieron obtener las notas del periodo: '+e.message+'. Verifique el nombre y parámetros de la función SQL del docente.';exportRows=[];}
 }
 selector.onchange=cargar;
 boton.onclick=()=>descargarArchivo('cia_periodo_'+selector.value+'.csv','\ufeff'+[exportHeaders,...exportRows].map(r=>r.map(csvCelda).join(',')).join('\r\n'),'text/csv;charset=utf-8');
 await cargar();
}

/* ======== ENLACE 2 · DOCENTE (banco de técnicas con Gemini) ======== */
const E4_TECNICAS={matematica4:'Matemática científica',espanol4:'Español científico',crucigrama4:'Crucigrama científico',rompecabezas4:'Rompecabezas científico',decisiones4:'Reto de decisiones'};
const E3_TECNICAS={errores3:'Detective de errores aplicado',mision3:'Misión científica',prediccion3:'¿Qué pasaría si…?',clasificacion3:'Clasificación científica',evidencia3:'Encuentra la evidencia'};
const E2_TECNICAS={detective:'Detective de errores',quien:'¿Quién soy?',causa:'Causa y efecto',mito:'Mito o ciencia',casos:'Casos prácticos'};
const E2_META=8,E2_GRADOS=['7','8','9','10','11','12'];
const e2Sin=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const e2Clave=s=>e2Sin(s).replace(/[^a-z0-9]+/g,' ').trim();

function e2Normalizar(p){
 if(!p||typeof p!=='object')return{error:'Registro vacío o inválido'};
 const clave=e2Sin(p.tipo??p.tecnica??p.tipo_pregunta).replace(/[^a-z0-9]+/g,'_');
 const mapa={errores3:'errores3',mision3:'mision3',prediccion3:'prediccion3',clasificacion3:'clasificacion3',evidencia3:'evidencia3',detective:'detective',detective_de_errores:'detective',error:'detective',quien:'quien',quien_soy:'quien',quien_soy_:'quien',causa:'causa',causa_efecto:'causa',causa_y_efecto:'causa',mito:'mito',mito_o_ciencia:'mito',caso:'casos',casos:'casos',casos_practicos:'casos',caso_practico:'casos'};
 const tipo=mapa[clave];if(!tipo)return{error:'Técnica no reconocida: '+String(p.tipo??p.tecnica??'sin tipo')};
 const pregunta=String(p.pregunta??p.enunciado??'').trim();if(!pregunta)return{error:'Enunciado vacío'};
 const fuente=p.opciones??p.alternativas??[];
 let opciones=Array.isArray(fuente)?fuente.map(x=>typeof x==='string'?x:String(x?.texto??x?.valor??'')).map(x=>x.trim()).filter(Boolean):[];
 let respuesta=String(p.respuesta??p.respuesta_correcta??p.correcta??'').trim();
 if(/^[A-D]$/i.test(respuesta)&&opciones.length>=respuesta.toUpperCase().charCodeAt(0)-64)respuesta=opciones[respuesta.toUpperCase().charCodeAt(0)-65];
 const igual=(a,b)=>e2Sin(a).replace(/\s+/g,' ')===e2Sin(b).replace(/\s+/g,' ');
 const existente=opciones.find(x=>igual(x,respuesta));if(existente)respuesta=existente;
 if(!respuesta)return{error:'Sin respuesta correcta'};
 if(!opciones.some(x=>igual(x,respuesta)))opciones.unshift(respuesta);
 opciones=opciones.filter((x,i)=>opciones.findIndex(y=>igual(x,y))===i);
 if(opciones.length<3)return{error:'Menos de tres alternativas distintas'};
 opciones=[respuesta,...opciones.filter(x=>!igual(x,respuesta)).slice(0,2)];
 for(let i=opciones.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opciones[i],opciones[j]]=[opciones[j],opciones[i]]}
 return{tipo,pregunta,opciones,respuesta,explicacion:String(p.explicacion??p.justificacion??'').trim(),guardada:false};
}

/* ======== MATERIAS · flujo guiado: materia → salones → PDF, grado y técnica → preguntas ======== */
const SECCIONES=['A','B','C','D'];
const BANCO_TIPOS={seleccion_multiple:'Selección múltiple',verdadero_falso:'Verdadero o falso',completar:'Completar el espacio'};
const NIVELES=['facil','medio','dificil'];
let matActual=null,pdfCache=null;
const porGrado=(a,b)=>(Number(a)||0)-(Number(b)||0);
async function leerPdf(file){
 if(!file||file.type!=='application/pdf')throw Error('Seleccione un archivo PDF');
 if(file.size>10*1024*1024)throw Error('El PDF supera 10 MB');
 if(!window.pdfjsLib)throw Error('No se cargó el lector de PDF; revise la conexión');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
 const pag=[];for(let n=1;n<=doc.numPages;n++){const c=await(await doc.getPage(n)).getTextContent();pag.push(c.items.map(x=>x.str).join(' '));}
 const texto=pag.join('\n').slice(0,45000);
 if(texto.trim().length<150)throw Error('PDF sin texto suficiente; los PDF escaneados requieren OCR');
 return {nombre:file.name,texto,paginas:doc.numPages};
}
async function invocarIA(body){
 const {data,error}=await sb.functions.invoke('cia-generar',{body});
 if(error){let msg=error.message;try{const j=await error.context.json();if(j?.error)msg=j.error}catch{}throw Error(msg)}
 if(data?.error)throw Error(data.error);return data;
}
function bancoNormalizar(p){
 if(!p||typeof p!=='object')return{error:'Registro inválido'};
 const tipo=String(p.tipo||'').trim();if(!BANCO_TIPOS[tipo])return{error:'Tipo no reconocido: '+tipo};
 const enunciado=String(p.pregunta??p.enunciado??'').trim();if(!enunciado)return{error:'Enunciado vacío'};
 let ops=(Array.isArray(p.opciones)?p.opciones:[]).map(x=>String(x??'').trim()).filter(Boolean);
 ops=ops.filter((x,i)=>ops.findIndex(y=>e2Sin(y)===e2Sin(x))===i);
 let correcta=String(p.respuesta??p.correcta??'').trim();
 const ex=ops.find(x=>e2Sin(x)===e2Sin(correcta));if(ex)correcta=ex;
 if(!correcta||!ops.includes(correcta))return{error:'La respuesta no está entre las opciones'};
 if(tipo==='verdadero_falso'){if(ops.length!==2)return{error:'Verdadero/falso mal formado'};}
 else if(ops.length<3)return{error:'Menos de tres opciones'};
 return{tipo,enunciado,opciones:ops,correcta,explicacion:String(p.explicacion??'').trim(),nivel:NIVELES.includes(p.dificultad)?p.dificultad:'medio'};
}
const e2Unificar=r=>{const p=e2Normalizar(r);return p.error?p:{tipo:p.tipo,enunciado:p.pregunta,opciones:p.opciones,correcta:p.respuesta,explicacion:p.explicacion,nivel:'medio'};};

/* Catálogo configurable: evaluaciones adicionales basadas en los motores existentes. */
async function ciaCatalogoEvaluaciones(uid,box){

  panel.innerHTML=`<hr><h3>Evaluaciones adicionales</h3><p class=s>Las evaluaciones 1 y 2 se conservan. Las evaluaciones adicionales pueden usar el motor Enlace 2 o el Banco. Su catálogo y orden se guardan en Supabase. Las prácticas Enlace 2 todavía comparten el motor de intentos; no son calificaciones independientes por catálogo. Puede pausar o duplicar una configuración sin afectar las notas.</p><div class=row style="flex-wrap:wrap"><input id=cia-cat-nombre maxlength=100 placeholder="Evaluación ${items.length+3}" aria-label="Nombre de la nueva evaluación"><select id=cia-cat-motor aria-label="Tipo de ejercicios"><option value=banco>Ejercicios de Evaluación 1</option><option value=e2>Ejercicios de Evaluación 2</option><option value=e3>Ejercicios de Evaluación 3</option></select><button id=cia-cat-crear>Agregar evaluación</button></div><p id=cia-cat-estado class=s role=status></p><div class=wrap><table><thead><tr><th>Orden</th><th>Nombre</th><th>Tipo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${items.map((x,i)=>`<tr><td>${i+3}</td><td>${esc(x.nombre)}</td><td>${x.motor==='e3'?'Evaluación 3':x.motor==='e2'?'Evaluación 2':'Evaluación 1 · Banco'}</td><td>${x.activa?'Activa':'Pausada'}</td><td><button class=sec data-cat-up="${esc(String(x.id))}" ${i===0?'disabled':''}>↑</button> <button class=sec data-cat-down="${esc(String(x.id))}" ${i===items.length-1?'disabled':''}>↓</button> <button class=sec data-cat-edit="${esc(String(x.id))}">Renombrar</button> <button class=sec data-cat-toggle="${esc(String(x.id))}">${x.activa?'Pausar':'Activar'}</button> <button class=sec data-cat-copy="${esc(String(x.id))}">Duplicar</button> <button class=sec data-cat-del="${esc(String(x.id))}">Eliminar</button></td></tr>`).join('')||'<tr><td colspan=4>No hay evaluaciones adicionales. Las evaluaciones 1, 2 y 3 ya están disponibles.</td></tr>'}</tbody></table></div>`;
  // Vista previa de las cinco técnicas disponibles para las evaluaciones Enlace 2.
  const e2Items=items.filter(x=>x.motor==='e2');
  if(e2Items.length){const preview=document.createElement('div');preview.className='card';preview.innerHTML='<h4>Evaluaciones que usan Enlace 2</h4><p class=s>Estas evaluaciones usan las cinco técnicas existentes: Detective de errores, ¿Quién soy?, Causa y efecto, Mito o ciencia y Casos prácticos. Las preguntas se administran en Materias → Preguntas. La independencia de intentos requiere una función SQL adicional.</p>'+e2Items.map(x=>'<p><b>'+esc(x.nombre)+'</b> · '+(x.activa?'Activa':'Pausada')+'</p>').join('');panel.append(preview);}
  const msg=panel.querySelector('#cia-cat-estado');
  panel.querySelector('#cia-cat-crear').onclick=async()=>{const nombre=panel.querySelector('#cia-cat-nombre').value.trim()||`Evaluación ${items.length+3}`,motor=panel.querySelector('#cia-cat-motor').value;if(nombre.length>100)return;const {error:e}=await sb.from('cia_catalogo_evaluaciones').insert({docente_id:uid,nombre,motor,orden:items.length+3});if(e)return msg.textContent=e.message;await cargar();};
  const guardar=async(a,b)=>{const {error:e}=await sb.rpc('cia_catalogo_intercambiar',{p_primero:a.id,p_segundo:b.id});if(e)return msg.textContent='No se pudo ordenar: '+e.message+' (ejecute el SQL de esta etapa)';await cargar();};
  panel.querySelectorAll('[data-cat-up],[data-cat-down]').forEach(b=>b.onclick=async()=>{const id=b.dataset.catUp||b.dataset.catDown,i=items.findIndex(x=>String(x.id)===id),j=i+(b.dataset.catUp?-1:1);if(i<0||j<0||j>=items.length)return;await guardar(items[i],items[j]);});
  panel.querySelectorAll('[data-cat-edit]').forEach(b=>b.onclick=async()=>{const x=items.find(x=>String(x.id)===b.dataset.catEdit);if(!x)return;const nombre=prompt('Nombre de la evaluación:',x.nombre)?.trim();if(!nombre||nombre.length>100)return;const {error:e}=await sb.from('cia_catalogo_evaluaciones').update({nombre}).eq('id',x.id).eq('docente_id',uid);if(e)return msg.textContent=e.message;await cargar();});

  panel.querySelectorAll('[data-cat-del]').forEach(b=>b.onclick=async()=>{const x=items.find(x=>String(x.id)===b.dataset.catDel);if(!x||!confirm('¿Eliminar la configuración «'+x.nombre+'»? Si tiene evaluaciones oficiales vinculadas, Supabase impedirá borrarla.'))return;const {error:e}=await sb.from('cia_catalogo_evaluaciones').delete().eq('id',x.id).eq('docente_id',uid);if(e)return msg.textContent=e.message;await cargar();});
 };await cargar();
}

/* Paso 2 · Paquete de preguntas (JSON). Ya no se generan preguntas con Gemini: la IA externa las crea desde el prompt y aquí se suben. */
/*PQ-INI*/
const PQ_PROMPT="Eres un docente experto en evaluación escolar. Te adjunto un PDF de lectura. Crea un PAQUETE DE PREGUNTAS basado ÚNICAMENTE en ese PDF (sin inventar datos ni usar información externa).\n\nDATOS\n- Materia: {{MATERIA}}\n- Grado: {{GRADO}}\n- Cantidad total: {{CANTIDAD}}\n- Lenguaje claro y apropiado para el grado. Mezcla dificultad fácil, medio y difícil (aprox. 35 % / 40 % / 25 %).\n\nOBJETIVO\nEstas preguntas se subirán a una plataforma y el docente decidirá después con qué técnica las usa (Evaluación 1, 2, 3 o 4). Por eso TODAS las preguntas deben funcionar con alternativas, y las que corresponden a crucigrama o rompecabezas deben traer además sus datos extra.\n\nREGLAS GENERALES\n1. Recorre TODO el PDF de principio a fin y reparte las preguntas proporcionalmente entre sus secciones. No repitas preguntas ni hagas variantes casi iguales.\n2. Cada pregunta lleva un \"titulo\" corto, único y descriptivo (máx. 80 caracteres) con el que se guardará, por ejemplo: \"Función de la membrana celular\". No uses títulos genéricos como \"Pregunta 1\".\n3. Reparte las preguntas de forma equitativa entre estos tipos (campo \"tipo\"; usa exactamente estas palabras):\n   - seleccion_multiple, verdadero_falso, completar\n   - detective (presenta un error conceptual y pregunta cómo corregirlo)\n   - quien (¿Quién soy? con pistas para reconocer un concepto)\n   - causa (identificar causa o consecuencia)\n   - mito (afirmación: ¿mito o ciencia? con la explicación correcta)\n   - casos (situación práctica basada en el PDF)\n   - mision (resolver una misión con pistas)\n   - prediccion (¿qué pasaría si…?)\n   - clasificacion (identificar la categoría correcta)\n   - evidencia (elegir la evidencia que respalda una conclusión)\n   - matematica (problema numérico con datos del PDF)\n   - espanol (comprensión: idea principal, vocabulario, inferencia)\n   - crucigrama (incluye \"palabra\" y \"pista\")\n   - rompecabezas (incluye \"piezas\" y \"orden_correcto\")\n   - decisiones (reto de decisiones: elegir la mejor decisión científica)\n4. Opciones:\n   - Todas las preguntas tienen \"opciones\" con EXACTAMENTE 4 alternativas distintas y una sola correcta, salvo verdadero_falso, que usa exactamente [\"Verdadero\",\"Falso\"].\n   - \"respuesta\" debe ser TEXTUALMENTE idéntica a una de las opciones.\n   - Los distractores deben ser plausibles pero claramente incorrectos según el PDF. Varía la posición de la respuesta correcta.\n   - completar: el enunciado incluye un espacio \"_____\".\n5. Crucigrama: \"palabra\" = una sola palabra en minúsculas, sin tildes ni espacios, tomada del PDF; \"pista\" = definición clara. Además llena \"opciones\" y \"respuesta\" (la palabra correcta entre 4 alternativas).\n6. Rompecabezas: \"piezas\" = 3 a 5 elementos desordenados; \"orden_correcto\" = esos mismos elementos en el orden correcto (proceso, secuencia o jerarquía del PDF). Además llena \"opciones\" y \"respuesta\" (opciones = 4 órdenes posibles escritos con flechas, ej. \"Membrana → Citoplasma → Núcleo\"; respuesta = el correcto).\n7. Para los tipos que no son crucigrama ni rompecabezas, deja \"palabra\" y \"pista\" como \"\" y \"piezas\" y \"orden_correcto\" como [].\n8. Toda pregunta incluye \"explicacion\" breve (1 o 2 frases) que justifique la respuesta según el PDF, y \"pagina\" con el número aproximado de página del PDF donde está el contenido (o \"\" si no lo sabes).\n9. Si el PDF no da contenido suficiente para la cantidad pedida, genera menos y dime cuántas hiciste y por qué. No rellenes con preguntas inventadas.\n\nFORMATO DE SALIDA (MUY IMPORTANTE)\n- Responde SOLO con JSON válido, sin texto antes ni después, dentro de un bloque de código. Comillas dobles rectas, sin comas finales, sin comentarios.\n- Estructura exacta:\n\n{\n  \"paquete\": {\n    \"materia\": \"{{MATERIA}}\",\n    \"grado\": \"{{GRADO}}\",\n    \"tema\": \"\",\n    \"fuente\": \"nombre del PDF\",\n    \"total\": 0\n  },\n  \"preguntas\": [\n    {\n      \"id\": \"P001\",\n      \"titulo\": \"\",\n      \"tipo\": \"seleccion_multiple\",\n      \"tema\": \"\",\n      \"dificultad\": \"facil\",\n      \"enunciado\": \"\",\n      \"opciones\": [\"\", \"\", \"\", \"\"],\n      \"respuesta\": \"\",\n      \"explicacion\": \"\",\n      \"palabra\": \"\",\n      \"pista\": \"\",\n      \"piezas\": [],\n      \"orden_correcto\": [],\n      \"pagina\": \"\"\n    }\n  ]\n}\n\n- \"dificultad\" solo puede ser: \"facil\", \"medio\" o \"dificil\".\n- Los ids son consecutivos: P001, P002, P003…\n\nENTREGA DEL BANCO COMPLETO\nEntrega todas las preguntas solicitadas en un único objeto JSON con la estructura indicada. No te detengas en 25 preguntas ni pidas CONTINUAR. La cantidad solicitada corresponde al banco completo; el docente elegirá después cuántas usar en cada evaluación sin borrar las restantes.\nSi puedes crear archivos, entrega un único archivo .json completo para descargar. Si el contenido del PDF no alcanza, no inventes ni repitas: entrega las preguntas justificables e indica la limitación en paquete.tema. paquete.total debe ser exactamente igual a preguntas.length, nunca una cantidad prevista.\nAntes de entregar verifica JSON válido, respuestas idénticas a una opción, alternativas distintas, títulos únicos y fidelidad al PDF.";
const pqPrompt=(mat,grado,cant)=>PQ_PROMPT.split('{{MATERIA}}').join(mat).split('{{GRADO}}').join(grado+'.º').split('{{CANTIDAD}}').join(cant==='todas'?'todas las que permita la lectura (mínimo 100 si el texto alcanza; máximo 200)':cant);
const PQ_TIPOS={seleccion_multiple:'Selección múltiple',verdadero_falso:'Verdadero o falso',completar:'Completar el espacio',detective:'Detective de errores',quien:'¿Quién soy?',causa:'Causa y efecto',mito:'Mito o ciencia',casos:'Casos prácticos',mision:'Misión científica',prediccion:'¿Qué pasaría si…?',clasificacion:'Clasificación',evidencia:'Encuentra la evidencia',matematica:'Matemática científica',espanol:'Español científico',crucigrama:'Crucigrama científico',rompecabezas:'Rompecabezas científico',decisiones:'Reto de decisiones'};
const PQ_SINON={multiple:'seleccion_multiple',opcion_multiple:'seleccion_multiple',seleccion:'seleccion_multiple',vf:'verdadero_falso',verdadero_o_falso:'verdadero_falso',errores:'detective',detective_de_errores:'detective',quien_soy:'quien',causa_efecto:'causa',causa_y_efecto:'causa',mito_o_ciencia:'mito',caso:'casos',casos_practicos:'casos',decision:'decisiones',reto_de_decisiones:'decisiones',matematica_cientifica:'matematica',espanol_cientifico:'espanol',crucigrama_cientifico:'crucigrama',rompecabezas_cientifico:'rompecabezas',que_pasaria_si:'prediccion',completar_el_espacio:'completar'};
/* Cada tipo del paquete se asigna a la técnica más parecida de cada evaluación, así el mismo paquete sirve para cualquiera. */
const PQ_MAPA={
 e2:{seleccion_multiple:'casos',verdadero_falso:'mito',completar:'casos',detective:'detective',quien:'quien',causa:'causa',mito:'mito',casos:'casos',mision:'casos',prediccion:'causa',clasificacion:'quien',evidencia:'causa',matematica:'casos',espanol:'casos',crucigrama:'quien',rompecabezas:'causa',decisiones:'casos'},
 e3:{seleccion_multiple:'evidencia3',verdadero_falso:'errores3',completar:'clasificacion3',detective:'errores3',quien:'clasificacion3',causa:'prediccion3',mito:'errores3',casos:'mision3',mision:'mision3',prediccion:'prediccion3',clasificacion:'clasificacion3',evidencia:'evidencia3',matematica:'mision3',espanol:'evidencia3',crucigrama:'clasificacion3',rompecabezas:'mision3',decisiones:'mision3'},
 e4:{seleccion_multiple:'espanol4',verdadero_falso:'espanol4',completar:'espanol4',detective:'decisiones4',quien:'crucigrama4',causa:'decisiones4',mito:'espanol4',casos:'decisiones4',mision:'decisiones4',prediccion:'decisiones4',clasificacion:'rompecabezas4',evidencia:'espanol4',matematica:'matematica4',espanol:'espanol4',crucigrama:'crucigrama4',rompecabezas:'rompecabezas4',decisiones:'decisiones4'}};
const PQ_EVALS={banco:'Evaluación 1',e2:'Evaluación 2',e3:'Evaluación 3',e4:'Evaluación 4'};
const PQ_TERCERA='No se puede saber con la información del texto';
function pqNormalizar(raw,i){
 if(!raw||typeof raw!=='object')return{error:'Registro vacío o inválido'};
 let t=e2Sin(raw.tipo??raw.tecnica??'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');t=PQ_SINON[t]||t;
 if(!PQ_TIPOS[t])return{error:'Tipo no reconocido: '+String(raw.tipo??'sin tipo')};
 let enun=String(raw.enunciado??raw.pregunta??'').trim();if(!enun)return{error:'Enunciado vacío'};
 let ops=(Array.isArray(raw.opciones??raw.alternativas)?(raw.opciones??raw.alternativas):[]).map(x=>typeof x==='string'?x:String(x?.texto??x??'')).map(x=>x.trim()).filter(Boolean);
 ops=ops.filter((x,k)=>ops.findIndex(y=>e2Sin(y)===e2Sin(x))===k);
 let cor=String(raw.respuesta??raw.correcta??raw.respuesta_correcta??'').trim();
 if(/^[A-D]$/i.test(cor)&&ops.length>=cor.toUpperCase().charCodeAt(0)-64)cor=ops[cor.toUpperCase().charCodeAt(0)-65];
 const ex=ops.find(x=>e2Sin(x)===e2Sin(cor));if(ex)cor=ex;
 if(!cor)return{error:'Sin respuesta correcta'};
 if(!ops.includes(cor))return{error:'La respuesta no coincide con ninguna opción'};
 if(t==='verdadero_falso'){if(ops.length!==2)return{error:'Verdadero/falso debe tener 2 opciones'};}
 else if(ops.length<3)return{error:'Menos de tres opciones'};
 const lista=a=>(Array.isArray(a)?a:[]).map(x=>String(x??'').trim()).filter(Boolean);
 const palabra=String(raw.palabra??'').trim(),pista=String(raw.pista??'').trim(),piezas=lista(raw.piezas),orden=lista(raw.orden_correcto);
 if(t==='crucigrama'&&pista&&!e2Sin(enun).includes(e2Sin(pista)))enun='Crucigrama · Pista: '+pista+'. '+enun;
 if(t==='rompecabezas'&&piezas.length&&!piezas.every(p=>e2Sin(enun).includes(e2Sin(p))))enun=enun+' Piezas: '+piezas.join(', ')+'.';
 const nivel=['facil','medio','dificil'].includes(e2Sin(raw.dificultad??raw.nivel))?e2Sin(raw.dificultad??raw.nivel):'medio';
 const titulo=String(raw.titulo??raw.title??'').trim().slice(0,100)||enun.replace(/\s+/g,' ').slice(0,70);
 return{id:String(raw.id||'P'+String(i+1).padStart(3,'0')),titulo,tipo:t,tema:String(raw.tema??'').trim(),nivel,enunciado:enun,opciones:ops,correcta:cor,explicacion:String(raw.explicacion??raw.justificacion??'').trim(),palabra,pista,piezas,orden,pagina:String(raw.pagina??'').trim()};
}
function pqExtraer(texto){
 const t=String(texto||'').replace(/^\uFEFF/,''),cand=[],re=/```(?:json)?\s*([\s\S]*?)```/gi;let m;
 while((m=re.exec(t)))cand.push(m[1]);if(!cand.length)cand.push(t);
 const preguntas=[];let paquete=null,fallos=0;
 for(const c of cand){
  let obj;
  try{obj=JSON.parse(c.trim());}
  catch{
   try{obj=JSON.parse(c.slice(c.indexOf('{'),c.lastIndexOf('}')+1));}
   catch{try{obj=JSON.parse(c.slice(c.indexOf('['),c.lastIndexOf(']')+1));}catch{fallos++;continue;}}
  }
  if(Array.isArray(obj))preguntas.push(...obj);
  else if(obj&&typeof obj==='object'){if(obj.paquete&&!paquete)paquete=obj.paquete;if(Array.isArray(obj.preguntas))preguntas.push(...obj.preguntas);}
 }
 return{preguntas,paquete,fallos};

   b.disabled=true;let error,data;
   if(k==='e2')({data,error}=await sb.from('cia14_preguntas').delete().eq('id',id).eq('docente_id',c.uid).select('id'));
   else{await sb.from('cia_pregunta_materia').delete().eq('pregunta_id',id).eq('docente_id',c.uid);({data,error}=await sb.from('cia_preguntas').delete().eq('id',id).eq('docente_id',c.uid).select('id'));}
   if(error||!data?.length){alert('No se pudo eliminar: '+(error?.message||'sin permiso (revise las políticas RLS de delete).'));b.disabled=false;return;}
   matPreguntas(c,root);});
 };
 $('#pt').onchange=()=>{$('#pq-ok').checked=false;lista();};$('#pg').onchange=()=>{$('#pq-ok').checked=false;lista();};$('#pq-ok').onchange=pintarQ;$('#pq-b').onclick=()=>borrarItems(vistas,$('#pq-m'),$('#pq-b'));lista();
 {const sel=()=>{const ev=$('#bk-ev').value,g=$('#bk-g').value,t=$('#bk-t').value,d=$('#bk-d').value;return items.filter(i=>(ev==='all'||(ev==='banco'?i.k==='banco':ev==='e2'?(i.k==='e2'&&!!E2_TECNICAS[i.tec]):(ev==='e3'?(i.k==='e2'&&!!E3_TECNICAS[i.tec]):(i.k==='e2'&&!!E4_TECNICAS[i.tec]))))&&(!g||i.grado===g)&&(!t||i.tec===t)&&(!d||i.dia===d));};
  const pintar=()=>{const n=sel().length;$('#bk-n').textContent=n?`Se eliminarán ${n} pregunta(s).`:'No hay preguntas con esta selección.';$('#bk-b').disabled=!n||!$('#bk-ok').checked;};
  ['#bk-ev','#bk-g','#bk-t','#bk-d'].forEach(x=>$(x).onchange=()=>{$('#bk-ok').checked=false;pintar();});$('#bk-ok').onchange=pintar;pintar();
  $('#bk-b').onclick=async()=>{const v=sel();if(!v.length)return;const bt=$('#bk-b'),m=$('#bk-m');bt.disabled=true;m.textContent='Eliminando…';
   try{const e2ids=v.filter(i=>i.k==='e2').map(i=>i.id),bids=v.filter(i=>i.k==='banco').map(i=>i.id);
    for(let i=0;i<e2ids.length;i+=100){const r=await sb.from('cia14_preguntas').delete().eq('docente_id',c.uid).in('id',e2ids.slice(i,i+100)).select('id');if(r.error)throw r.error;}
    for(let i=0;i<bids.length;i+=100){const part=bids.slice(i,i+100);let r=await sb.from('cia_pregunta_materia').delete().eq('docente_id',c.uid).in('pregunta_id',part);if(r.error)throw r.error;r=await sb.from('cia_preguntas').delete().eq('docente_id',c.uid).in('id',part).select('id');if(r.error)throw r.error;}
    await matPreguntas(c,root);const mm=$('#bk-m');if(mm)mm.textContent='Listo: se eliminaron '+v.length+' pregunta(s).';
   }catch(e){m.textContent='No se pudo eliminar: '+(e.message||e)+' (revisa los permisos de borrado en Supabase).';bt.disabled=false;}};}

}

/* ======== ENLACE 2 · ESTUDIANTE (práctica de 8 preguntas) ======== */
const E2_DESC={detective:'Encuentra el error en cada afirmación.',quien:'Adivina el concepto a partir de las pistas.',causa:'Relaciona cada causa con su efecto.',mito:'Distingue lo que es mito de lo que es ciencia.',casos:'Aplica lo aprendido a situaciones reales.',
 errores3:'Encuentra el error en una situación aplicada.',mision3:'Resuelve una misión científica paso a paso.',prediccion3:'Predice qué pasaría si cambia una condición.',clasificacion3:'Clasifica cada caso según su característica científica.',evidencia3:'Elige la evidencia que respalda la afirmación.'};
const e2PanelHTML=()=>`<h3>${etiquetaEval(MODO_E)}</h3><label id=e2mw>Materia<select id=e2m><option>Cargando…</option></select></label>
 <label id=e2cw>Evaluación<select id=e2catalogo><option value="">${etiquetaEval(MODO_E)} (original)</option></select></label><p id="e2-resumen-aviso" class="s" role="status" aria-live="polite"></p><div class=matgrid>${Object.entries(tecnicasDe(MODO_E)).map(([k,n])=>`<button class=big data-e2t="${k}" disabled style="text-align:left;display:block;width:100%;margin:6px 0"><b>${esc(n)}</b><br><span style="font-weight:400;font-size:.85rem">${esc(E2_DESC[k]||'')}</span><span class=e2-estado style="display:block;font-size:.8rem"></span></button>`).join('')}</div>`;
async function e2Cablear(seleccionAnterior){
 const {data,error}=await sb.rpc('cia14_materias',{p_cedula:est.cedula});
 if(error){$('#m').textContent=error.message;return;}
 const unicas=[...new Map((data||[]).map(x=>[x.materia_id||x.id,x])).values()].filter(x=>x.materia_id||x.id);
 if(!unicas.length){$('#e2m').innerHTML='';$('#m').textContent='Tu salón aún no tiene materias asignadas. Consulta al profesor.';return;}
 // El grado y el salón provienen de la matrícula; la materia se elige solo cuando hay varias.
 $('#e2m').innerHTML=unicas.map(x=>`<option value="${esc(x.materia_id||x.id)}">${esc(x.materia||x.nombre||'Materia asignada')}</option>`).join('');
 const selectorMateria=$('#e2m');
 const avisoMateria=document.createElement('p');avisoMateria.className='s';avisoMateria.id='cia-aviso-materia';
 selectorMateria.insertAdjacentElement('afterend',avisoMateria);
 avisoMateria.textContent=unicas.length>1?'Tienes varias materias. Elige la que deseas practicar.':'Materia asignada automáticamente según tu matrícula.';
 if(unicas.length===1){const mw=$('#e2mw');if(mw)mw.style.display='none';avisoMateria.style.display='none';}
 const {data:cats,error:catError}=await sb.rpc('cia14_catalogos_estudiante',{p_cedula:est.cedula});
 if(catError){$('#m').textContent='No se pudo cargar el catálogo: '+catError.message;return;}
 const lista=(Array.isArray(cats)?cats:[]).filter(c=>MODO_E!=='e3'||!c.motor||c.motor==='e3');
 $('#e2catalogo').innerHTML='<option value="">'+etiquetaEval(MODO_E)+' (original)</option>'+lista.map(c=>`<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join('');
 {const w=$('#e2cw');if(w&&!lista.length)w.style.display='none';}
 async function actualizarEstadoE2(){
  const cat=$('#e2catalogo').value;
  let resumen={};let servidorDisponible=false;let errorResumen='';
  try {
   const {data,error}=await sb.rpc('cia14_resumen_catalogo',{p_cedula:est.cedula,p_catalogo:cat?Number(cat):null});
   if(error)throw error;
   if(!Array.isArray(data))throw new Error('El resumen no devolvió una lista válida');
   servidorDisponible=true;
   for(const x of data)if(x&&x.tecnica)resumen[x.tecnica]=x;
  }catch(e){errorResumen=e?.message||String(e);console.warn('Resumen E2:',errorResumen)}
  const aviso=$('#e2-resumen-aviso');
  if(aviso)aviso.textContent=servidorDisponible?'Puedes repetir cualquier técnica las veces que quieras.':'No se pudo consultar Supabase ('+errorResumen+'). Las marcas de este dispositivo son provisionales.';
  document.querySelectorAll('[data-e2t]').forEach(b=>{
   const x=resumen[b.dataset.e2t];const tipo=cat?MODO_E+':'+cat+':'+b.dataset.e2t:MODO_E+':'+b.dataset.e2t;
   let local=false;try{local=localStorage.getItem(claveMarca(tipo))==='1'}catch(_){}
   b.classList.toggle('practica-hecha',Boolean(x)||( !servidorDisponible && local));
   const t=b.querySelector('.e2-estado');if(t)t.textContent=x?' ✓ Realizado · Mejor nota: '+(Number.isFinite(Number(x.mejor_nota))?Number(x.mejor_nota).toFixed(2):'sin dato'):(!servidorDisponible&&local)?' ✓ Realizado en este dispositivo (provisional)':'';
  });
 }
 if(seleccionAnterior && [...$('#e2catalogo').options].some(o=>o.value===String(seleccionAnterior.catalogo))) $('#e2catalogo').value=String(seleccionAnterior.catalogo);
 if(seleccionAnterior && [...$('#e2m').options].some(o=>o.value===String(seleccionAnterior.materia))) $('#e2m').value=String(seleccionAnterior.materia);
 // Mostrar el banco vinculado a la evaluación seleccionada, sin impedir practicar si RLS no permite consultarlo.
 const selectorCatalogo=$('#e2catalogo');
 const estadoBanco=document.createElement('p');
 estadoBanco.className='s';
 estadoBanco.setAttribute('aria-live','polite');
 estadoBanco.style.margin='8px 0';
 selectorCatalogo.insertAdjacentElement('afterend',estadoBanco);
 let consultaBancoVersion=0;
 async function revisarBancoE2(){
  const version=++consultaBancoVersion;
  const catalogo=selectorCatalogo.value;
  if(!catalogo){estadoBanco.textContent=etiquetaEval(MODO_E)+' original: utiliza su banco habitual.';return;}
  estadoBanco.textContent='Comprobando preguntas vinculadas a esta evaluación…';
  try{
   const {count,error}=await sb.from('cia_catalogo_preguntas').select('pregunta_id',{count:'exact',head:true}).eq('catalogo_id',Number(catalogo));
   if(version!==consultaBancoVersion)return;
   if(error){estadoBanco.textContent='No se pudo consultar el número de preguntas. Puedes intentar la práctica.';return;}
   estadoBanco.textContent=count===0?'Esta evaluación todavía no tiene preguntas vinculadas. El docente debe asignarlas.':`${count} pregunta(s) vinculada(s) a esta evaluación. Cada técnica requiere preguntas compatibles.`;
  }catch(_){if(version===consultaBancoVersion)estadoBanco.textContent='No se pudo comprobar el banco. Puedes intentar la práctica.';}
 }
 $('#e2catalogo').onchange=()=>{actualizarEstadoE2();revisarBancoE2();};
 // Evitar conservar marcas de otra materia en pantalla al cambiar la selección.
 $('#e2m').onchange=()=>{actualizarEstadoE2();revisarBancoE2();};
 pintarRealizados();$('#e2catalogo').onchange();if(unicas.length===1)$('#e2mw').style.display='none';
 document.querySelectorAll('[data-e2t]').forEach(b=>{b.disabled=false;b.onclick=()=>iniciarE2(b.dataset.e2t);});
}
async function practicaE2(seleccionAnterior){
 // Refrescar el periodo vigente al abrir ejercicios: no reutilizar el motor e2 de una visita anterior.
 if(est?.cedula){
  const consulta=await obtenerPeriodo();
  if(consulta.periodo){
   window.__ciaPeriodoActual=consulta.periodo;
   MODO_E=['e2','e3'].includes(consulta.periodo.tecnica)?consulta.periodo.tecnica:'banco';

async function iniciarE2(tec){
 document.querySelectorAll('[data-e2t]').forEach(b=>b.disabled=true);
 {
  const catalogo=$('#e2catalogo').value;
  const materiaElegida=$('#e2m').value;
  const {data:d,error:er}=catalogo
   ?await sb.rpc('cia14_iniciar_catalogo',{p_cedula:est.cedula,p_materia:$('#e2m').value,p_tecnica:tec,p_catalogo:catalogo})
   :await sb.rpc('cia14_iniciar',{p_cedula:est.cedula,p_materia:$('#e2m').value,p_tecnica:tec});
  if(er){$('#m').textContent=/al menos ocho preguntas/i.test(er.message)?'Esta técnica aún no está lista: faltan preguntas activas para tu materia y grado. Informa al profesor; tus notas anteriores se conservan.':er.message;document.querySelectorAll('[data-e2t]').forEach(b=>b.disabled=false);return;}
  if(!d||!Array.isArray(d.preguntas)||d.preguntas.length!==8||!d.intento){$('#m').textContent='La evaluación no devolvió exactamente ocho preguntas. Informa al profesor; no se iniciará una evaluación incompleta.';document.querySelectorAll('[data-e2t]').forEach(b=>b.disabled=false);return;}
  const items=d.preguntas||[],intento=d.intento,tecnicaNombre=tecnicasDe(MODO_E)[tec];

  $('#e2env').onclick=async()=>{
   const resp={};
   for(let i=0;i<items.length;i++){const el=document.querySelector(`input[name="q${i}"]:checked`);if(!el)return $('#m').textContent='Responde la pregunta '+(i+1);resp[items[i].id]=items[i].opciones[Number(el.value)]}
   $('#e2env').disabled=true;
   const {data:r,error:ee}=await sb.rpc('cia14_enviar',{p_cedula:est.cedula,p_intento:intento,p_respuestas:resp});
