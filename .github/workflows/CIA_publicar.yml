
# PROYECTO: CIENCIAS IA
# CODIGO: CIA
# Publica Ciencias IA sin eliminar los HTML anteriores.

name: CIA - Publicar Ciencias IA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias de Ciencias IA
        working-directory: ciencias-ia
        run: npm install

      - name: Compilar Ciencias IA
        working-directory: ciencias-ia
        env:
          VITE_SUPABASE_URL: ${{ vars.CIA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.CIA_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Preparar sitio completo
        run: |
          mkdir -p publicacion
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='publicacion/' \
            --exclude='ciencias-ia/' \
            ./ publicacion/

          mkdir -p publicacion/ciencias-ia
          cp -a ciencias-ia/dist/. publicacion/ciencias-ia/
          touch publicacion/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicacion

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
