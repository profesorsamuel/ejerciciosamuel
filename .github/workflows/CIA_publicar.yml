# CIA - Publicación de páginas estáticas en GitHub Pages
# Conserva el contenido del repositorio y publica CIA-CIENCIAS-IA sin compilación.
name: CIA - Publicar Ciencias IA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar sitio estático
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publicacion
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='publicacion/' \
            --exclude='*.zip' \
            ./ publicacion/
          test -f publicacion/CIA-CIENCIAS-IA/index.html || {
            echo 'ERROR: falta CIA-CIENCIAS-IA/index.html en la rama publicada.'
            exit 1
          }
          touch publicacion/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicacion

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
