
# PROYECTO: CIENCIAS IA
# CODIGO: CIA
# Publicacion automatica con GitHub Pages
# Conserva los ejercicios HTML anteriores.

name: CIA - Publicar Ciencias IA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # CIA_001: Descargar repositorio
      - name: CIA - Descargar repositorio
        uses: actions/checkout@v4

      # CIA_002: Preparar Node.js
      - name: CIA - Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # CIA_003: Instalar dependencias
      - name: CIA - Instalar dependencias
        working-directory: ciencias-ia
        run: npm install

      # CIA_004: Compilar React y Vite
      - name: CIA - Compilar aplicacion
        working-directory: ciencias-ia
        env:
          VITE_SUPABASE_URL: ${{ vars.CIA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.CIA_SUPABASE_ANON_KEY }}
        run: npm run build

      # CIA_005: Conservar paginas anteriores
      - name: CIA - Preparar sitio completo
        run: |
          mkdir -p publicacion

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='publicacion/' \
            --exclude='ciencias-ia/' \
            ./ publicacion/

          mkdir -p publicacion/ciencias-ia

          cp -a ciencias-ia/dist/. publicacion/ciencias-ia/

          touch publicacion/.nojekyll

      # CIA_006: Configurar Pages
      - name: CIA - Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # CIA_007: Subir sitio compilado
      - name: CIA - Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicacion

      # CIA_008: Publicar
      - name: CIA - Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
