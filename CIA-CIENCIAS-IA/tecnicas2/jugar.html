<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIA · Prácticas reales Enlace 2</title><style>body{font:16px system-ui;background:#f3f7f5;color:#19382d;margin:0}main{max-width:850px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #d9e6df;border-radius:13px;padding:20px;margin:12px 0}input,select,textarea{font:inherit;padding:10px;border:1px solid #b8cdc1;border-radius:7px;width:100%;box-sizing:border-box;margin:5px 0 12px}button{background:#197450;color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer;margin:5px}button:disabled{opacity:.5}.muted{color:#526e60}.item{border:1px solid #d8e5dc;padding:12px;border-radius:9px;margin:10px 0}label{display:block;margin:8px 0}a{color:#145e44}</style><main><p><a href="./">← Enlace 2</a></p><h1>Prácticas · Enlace 2</h1><p class="muted">Ocho preguntas aleatorias. Nota de práctica registrada; no es una evaluación oficial.</p><div class="card" id="inicio"><label>Cédula<input id="cedula" autocomplete="off"></label><button id="consultar">Consultar materias</button><div id="config" hidden><label>Materia<select id="materia"></select></label><label>Técnica<select id="tecnica"><option value="detective">Detective de errores</option><option value="quien">¿Quién soy?</option><option value="causa">Causa y efecto</option><option value="mito">Mito o ciencia</option><option value="casos">Casos prácticos</option></select></label><button id="comenzar">Iniciar ocho preguntas</button></div></div><section class="card" id="ejercicio" hidden><h2 id="titulo"></h2><div id="preguntas"></div><button id="enviar">Enviar respuestas</button></section><section class="card" id="resultado" hidden></section><p id="msg" role="status"></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://luewrpzgetqslxqmdcxv.supabase.co','sb_publishable_zJc68aiTxJs7HBgaqeHxrQ_JDcm91xG');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let intento=null,items=[];function aviso(t){$('msg').textContent=t}
$('consultar').onclick=async()=>{try{const c=$('cedula').value.trim();if(!c)throw Error('Ingrese la cédula');const {data:e,error:a}=await sb.rpc('cia_ingresar_cedula',{p_cedula:c});if(a)throw a;if(!e?.id)throw Error('No se encontró el estudiante');const {data:m,error:b}=await sb.rpc('cia14_materias',{p_cedula:c});if(b)throw b;const uniques=[...new Map((m||[]).map(x=>[x.materia_id||x.id,x])).values()];$('materia').innerHTML=uniques.filter(x=>x.materia_id||x.id).map(x=>`<option value="${esc(x.materia_id||x.id)}">${esc(x.materia)}</option>`).join('');if(!$('materia').options.length)throw Error('No hay materias asignadas o la consulta no devuelve materia_id. Consulte al docente.');$('config').hidden=false;aviso('Estudiante: '+e.nombres)}catch(e){aviso(e.message)}};
$('comenzar').onclick=async()=>{try{const {data,error}=await sb.rpc('cia14_iniciar',{p_cedula:$('cedula').value.trim(),p_materia:$('materia').value,p_tecnica:$('tecnica').value});if(error)throw error;intento=data.intento;items=data.preguntas;$('inicio').hidden=true;$('ejercicio').hidden=false;$('titulo').textContent='Responda las ocho preguntas';$('preguntas').innerHTML=items.map((q,i)=>`<div class="item"><b>${i+1}. ${esc(q.enunciado)}</b>${q.opciones.map((o,j)=>`<label><input style="width:auto" type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('');aviso('')}catch(e){aviso(e.message)}};
$('enviar').onclick=async()=>{try{let resp={};items.forEach((q,i)=>{let el=document.querySelector(`input[name="q${i}"]:checked`);if(!el)throw Error('Responda la pregunta '+(i+1));resp[q.id]=q.opciones[Number(el.value)]});$('enviar').disabled=true;const {data,error}=await sb.rpc('cia14_enviar',{p_cedula:$('cedula').value.trim(),p_intento:intento,p_respuestas:resp});if(error)throw error;$('ejercicio').hidden=true;$('resultado').hidden=false;$('resultado').innerHTML=`<h2>Resultado guardado</h2><p>Correctas: ${data.aciertos} de ${data.total}</p><h2>Nota de práctica: ${data.nota} / 5.00</h2><p>La calificación no corresponde a una evaluación oficial.</p><a href="jugar.html">Hacer otra práctica</a>`;aviso('')}catch(e){aviso(e.message);$('enviar').disabled=false}};
</script></html>
