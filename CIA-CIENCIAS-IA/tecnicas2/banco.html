<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIA · Banco Enlace 2</title><style>body{font:16px system-ui;background:#f3f7f5;color:#19382d;margin:0}main{max-width:850px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #d9e6df;border-radius:13px;padding:20px;margin:12px 0}input,select,textarea{font:inherit;padding:10px;border:1px solid #b8cdc1;border-radius:7px;width:100%;box-sizing:border-box;margin:5px 0 12px}button{background:#197450;color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer;margin:5px}button:disabled{opacity:.5}.muted{color:#526e60}.item{border:1px solid #d8e5dc;padding:12px;border-radius:9px;margin:10px 0}label{display:block;margin:8px 0}a{color:#145e44}</style><main><p><a href="./">← Enlace 2</a></p><h1>Banco docente · Técnicas 2</h1><p class="muted">Cree ocho o más preguntas por materia, grado y técnica. Se guardan únicamente en el banco nuevo.</p><div class="card" id="login"><h2>Ingreso docente</h2><input id="correo" placeholder="Correo" type="email"><input id="clave" type="password" placeholder="Contraseña"><button id="entrar">Entrar</button></div><div class="card" id="editor" hidden><h2>Agregar pregunta</h2><label>Materia<select id="materia"></select></label><label>Grado<select id="grado"><option value="7">7.º</option><option value="8">8.º</option><option value="9">9.º</option></select></label><label>Técnica<select id="tecnica"><option value="detective">Detective de errores</option><option value="quien">¿Quién soy?</option><option value="causa">Causa y efecto</option><option value="mito">Mito o ciencia</option><option value="casos">Casos prácticos</option></select></label><label>Enunciado<textarea id="enunciado" rows="3"></textarea></label><label>Alternativa A<input id="a"></label><label>Alternativa B<input id="b"></label><label>Alternativa C<input id="c"></label><label>Respuesta correcta<select id="correcta"><option value="a">A</option><option value="b">B</option><option value="c">C</option></select></label><label>Explicación<textarea id="explicacion" rows="2"></textarea></label><button id="guardar">Guardar pregunta</button><button id="listar">Ver preguntas del banco</button><div id="lista"></div></div><p id="msg" role="status"></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://luewrpzgetqslxqmdcxv.supabase.co','sb_publishable_zJc68aiTxJs7HBgaqeHxrQ_JDcm91xG');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uid=null;function aviso(t){$('msg').textContent=t}
$('entrar').onclick=async()=>{try{const {data,error}=await sb.auth.signInWithPassword({email:$('correo').value,password:$('clave').value});if(error)throw error;uid=data.user.id;const {data:d,error:de}=await sb.from('cia_docentes').select('id').eq('id',uid).maybeSingle();if(de||!d)throw Error('La cuenta no es docente CIA');const {data:m,error:me}=await sb.from('cia_materias').select('id,nombre').eq('docente_id',uid).order('nombre');if(me)throw me;$('materia').innerHTML=(m||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.nombre)}</option>`).join('');$('login').hidden=true;$('editor').hidden=false;aviso('Sesión docente iniciada')}catch(e){aviso(e.message)}};
$('guardar').onclick=async()=>{try{let opciones=['a','b','c'].map(x=>$(x).value.trim());if(!uid||!$('materia').value||!$('enunciado').value.trim()||opciones.some(x=>!x)||new Set(opciones).size!==3)throw Error('Complete materia, enunciado y tres alternativas distintas');let correcta=opciones[['a','b','c'].indexOf($('correcta').value)];let {error}=await sb.from('cia14_preguntas').insert({docente_id:uid,materia_id:$('materia').value,grado:$('grado').value,tecnica:$('tecnica').value,enunciado:$('enunciado').value.trim(),opciones,correcta,explicacion:$('explicacion').value.trim()});if(error)throw error;aviso('Pregunta guardada');$('enunciado').value='';['a','b','c','explicacion'].forEach(x=>$(x).value='')}catch(e){aviso(e.message)}};
$('listar').onclick=async()=>{const {data,error}=await sb.from('cia14_preguntas').select('enunciado,grado,tecnica,activa').eq('docente_id',uid).eq('materia_id',$('materia').value).order('creado_en',{ascending:false}).limit(100);if(error)return aviso(error.message);$('lista').innerHTML=(data||[]).map(x=>`<div class="item"><b>${esc(x.tecnica)} · ${esc(x.grado)}.º</b><p>${esc(x.enunciado)}</p></div>`).join('')||'Sin preguntas'};
</script></html>
