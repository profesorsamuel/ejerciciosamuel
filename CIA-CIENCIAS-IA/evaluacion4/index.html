<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIA · Evaluación 4</title><style>body{font:17px system-ui;background:#eef4fa;color:#17324d;margin:0}main{max-width:850px;margin:30px auto;padding:18px}.card{background:white;border-radius:15px;padding:22px;margin:16px 0;box-shadow:0 2px 12px #b5c6d566}button,input{font:inherit;padding:11px;border-radius:9px;margin:5px}button{background:#1767ad;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.choice{display:block;background:#eaf3fc;color:#17324d;text-align:left;width:100%}.selected{outline:3px solid #2d9d7d}input{max-width:95%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.piece{background:#dbeafe;color:#17324d}.muted{color:#566}#feedback{font-weight:bold}</style><main><h1>Evaluación 4 · Desafíos interdisciplinarios</h1><p>Matemática, Español, Crucigrama, Rompecabezas científico y Reto de decisiones.</p><div class="card"><label>Tema o contenido de la clase <input id="tema" value="La célula"></label><button id="start">Comenzar práctica demostrativa</button><p class="muted">Esta práctica es una demostración local. No publica evaluaciones, no utiliza Gemini y no guarda notas oficiales en Supabase.</p></div><section id="area"></section><p><a href="../index.html">Volver a CIA</a></p></main><script>
const area=document.querySelector('#area');const exercises=[
{title:'1. Matemática científica',text:'Una célula mide 12 μm y otra mide el triple. ¿Cuánto mide la segunda?',choices:['24 μm','36 μm','48 μm'],answer:1},
{title:'2. Español científico',text:'Lee: «La membrana celular regula el intercambio de sustancias». ¿Cuál es la idea principal?',choices:['La membrana controla qué entra y sale','La membrana fabrica energía','La membrana guarda ADN'],answer:0},
{title:'3. Crucigrama científico',text:'Escribe las respuestas de las pistas. Horizontal: estructura que contiene ADN. Vertical: barrera que delimita la célula.',words:['nucleo','membrana']},
{title:'4. Rompecabezas científico',text:'Ordena las piezas desde la estructura externa hasta el centro de una célula animal.',pieces:['Núcleo','Membrana','Citoplasma'],order:['Membrana','Citoplasma','Núcleo']},
{title:'5. Reto de decisiones',text:'En un experimento, las células pierden agua en una solución muy concentrada. ¿Qué decisión permite comprobar el efecto del agua?',choices:['Cambiar varias condiciones a la vez','Comparar con células en agua de distinta concentración, manteniendo constantes las demás variables','No medir resultados'],answer:1}
];let index=0,score=0,selection=null,order=[];
function render(){if(index===exercises.length){area.innerHTML=`<div class="card"><h2>Resultado de práctica</h2><p>Respuestas correctas: ${score} de 5</p><h2>Nota orientativa: ${(1+score*4/5).toFixed(1)} / 5.0</h2><p>Esta nota no se envió al registro oficial.</p><button onclick="reset()">Repetir</button></div>`;return}const q=exercises[index];selection=null;order=[];let content='';if(q.choices)content=q.choices.map((c,i)=>`<button class="choice" data-answer="${i}">${c}</button>`).join('');else if(q.words)content=q.words.map((_,i)=>`<label>${i?'Vertical':'Horizontal'} <input id="word${i}" autocomplete="off"></label>`).join('<p></p>');else content=`<div class="grid">${q.pieces.map(p=>`<button class="piece" data-piece="${p}">${p}</button>`).join('')}</div><p>Tu orden: <b id="orden"></b></p><button id="clear">Reiniciar orden</button>`;area.innerHTML=`<div class="card"><p>Actividad ${index+1} de 5</p><h2>${q.title}</h2><p>${q.text}</p>${content}<p id="feedback"></p><button id="check">Comprobar y continuar</button></div>`;area.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{selection=Number(b.dataset.answer);area.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('selected',x===b))});area.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{if(order.includes(b.dataset.piece))return;order.push(b.dataset.piece);b.disabled=true;document.querySelector('#orden').textContent=order.join(' → ')});const clear=document.querySelector('#clear');if(clear)clear.onclick=render;document.querySelector('#check').onclick=()=>{let valid,correct;if(q.choices){valid=selection!==null;correct=selection===q.answer}else if(q.words){let words=q.words.map((_,i)=>document.querySelector('#word'+i).value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));valid=words.every(Boolean);correct=words.every((w,i)=>w===q.words[i])}else{valid=order.length===q.order.length;correct=order.every((v,i)=>v===q.order[i])}if(!valid){document.querySelector('#feedback').textContent='Completa la actividad antes de continuar.';return}if(correct)score++;index++;render()}}
function reset(){index=0;score=0;render()}document.querySelector('#start').onclick=reset;
</script></html>
