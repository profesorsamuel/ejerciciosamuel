<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIA · Ciencias IA</title>
<style>
:root{--ink:#10302f;--hoja:#2e8b57;--papel:#f5f7f2;--sol:#e9a23b;--mal:#b83b2e;--ok:#1f7a4a;--linea:#cfd9cc}
*{box-sizing:border-box}body{margin:0;background:var(--papel);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;line-height:1.2;margin:.2em 0 .5em}
header{background:var(--ink);color:#fff;padding:18px 20px}header h1{margin:0;font-size:1.5rem}header p{margin:0;opacity:.8;font-size:.9rem}
main{max-width:860px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:20px;margin:14px 0}
button,select,input,textarea{font:inherit}button{background:var(--hoja);color:#fff;border:0;border-radius:10px;padding:12px 18px;margin:4px;cursor:pointer;font-weight:600}
button.sec{background:#e4ebe1;color:var(--ink)}button.big{padding:18px 24px;font-size:1.1rem}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
input,select,textarea{width:100%;padding:11px;border:1px solid #9fb09c;border-radius:8px;margin:4px 0 12px;background:#fff}
.op{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--linea)}.op.sel{border-color:var(--hoja);background:#e8f4ec}
.bien{border-left:6px solid var(--ok)}.mal{border-left:6px solid var(--mal)}.bar{height:10px;background:#dde6da;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sol)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid var(--linea);text-align:left}
.tabs button.on{background:var(--ink)}.err{color:var(--mal);font-weight:600}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.s{font-size:.9rem;color:#4a625f}.wrap{overflow-x:auto}.editor-fondo{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px;z-index:1000}.editor-caja{width:min(680px,100%);max-height:94vh;overflow:auto;background:white;border-radius:12px;padding:22px;box-shadow:0 12px 40px #0004}.editor-caja label{display:block;font-weight:600;margin-top:8px}.editor-caja textarea{min-height:80px}.editor-acciones{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.editor-caja .err{min-height:1em}
.resumen-banco{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin:12px 0}.resumen-banco>div{padding:12px;background:#edf5ef;border-radius:10px;text-align:center}.resumen-banco b{display:block;font-size:1.7rem}.resumen-banco span{font-size:.85rem}
@media print{header,.tabs,button,input,select,.editor-fondo{display:none!important}body{background:#fff;color:#111}main{max-width:none;padding:0}.card{break-inside:avoid;border:0;padding:8px;margin:5px 0}table{font-size:11px}tr{break-inside:avoid}}
</style></head><body>
<header><h1>CIA · Ciencias IA</h1><p>C.E.B.G. El Jiral · Ciencias Naturales</p></header><main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// ▼▼ Pega aquí la URL del proyecto y la clave "anon/publishable" (NUNCA la service_role) ▼▼
const CONFIG={url:'https://luewrpzgetqslxqmdcxv.supabase.co',key:'sb_publishable_zJc68aiTxJs7HBgaqeHxrQ_JDcm91xG'};
const sb=createClient(CONFIG.url||'https://sin-configurar.supabase.co',CONFIG.key||'sin-configurar');
const $=s=>document.querySelector(s),app=$('#app'),draw=h=>app.innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
const TIPOS={multiple:'Selección múltiple',verdadero_falso:'Verdadero o falso',completar:'Completar el espacio',relacionar:'Relacionar columnas',ordenar:'Ordenar la secuencia'};
const META=18; // 18 por tipo x 5 tipos = 90 preguntas (mínimo pedido: 80)
let est=null;
const fmt=c=>Array.isArray(c)?(Array.isArray(c[0])?c.map(p=>p.join(' = ')).join('; '):c.join(' → ')):c;

function inicio(){draw(`<div class=card><h2>¿Quién eres?</h2>${CONFIG.url?'':'<p class=err>Falta configurar Supabase en index.html (CONFIG).</p>'}<button class=big id=e>Soy estudiante</button><button class="big sec" id=d>Soy docente</button></div>`);$('#e').onclick=loginEst;$('#d').onclick=loginDoc;}

/* ---------- ESTUDIANTE ---------- */
function loginEst(){draw(`<div class=card><h2>Ingreso de estudiante</h2><label>Nombre<input id=n autocomplete=name></label><label>Cédula<input id=c inputmode=text></label><p class=err id=m></p><button id=go>Entrar</button><button class=sec id=b>Volver</button></div>`);
$('#b').onclick=inicio;
$('#go').onclick=async()=>{const n=$('#n').value.trim(),c=$('#c').value.trim();if(!n||!c)return $('#m').textContent='Escribe tu nombre y tu cédula.';
 const {data,error}=await sb.rpc('cia_ingresar',{p_cedula:c,p_nombre:n});if(error){$('#m').textContent=error.code==='PGRST202'?'Falta instalar o recuperar la función cia_ingresar en Supabase. Avise al profesor.':error.message;return;}if(!data||!data.id){$('#m').textContent='No se encontró un estudiante válido. Revise la matrícula.';return;}est={...data,cedula:c,nombreVerificacion:n};menu();};}
async function menu(){draw(`<div class=card><h2>Hola, ${esc(est.nombres)}</h2><p>Elige un ejercicio. Cada intento trae 8 preguntas distintas. Responde todas antes de enviar.</p>${Object.entries(TIPOS).map(([k,v])=>`<button class=big data-t=${k}>${v}</button>`).join('')}<p class=err id=m></p><button class=sec id=s>Salir</button></div>`);
const contenedor=document.createElement('div');contenedor.className='card';contenedor.innerHTML='<h2>Evaluaciones asignadas</h2><p id=ev-est-msg>Buscando evaluaciones vigentes…</p><div id=ev-est-list></div><button class=sec id=ev-est-recargar>Actualizar evaluaciones</button>';app.append(contenedor);
 const historial=document.createElement('div');historial.className='card';historial.innerHTML='<h2>Mi historial de evaluaciones</h2><p id=hist-estado>Consultando intentos…</p><div class=wrap id=hist-tabla></div><button class=sec id=hist-actualizar>Actualizar historial</button>';app.append(historial);
 const cargarHistorial=async()=>{const {data,error}=await sb.rpc('cia_eval_historial',{p_est:est.id,p_cedula:est.cedula,p_nombre:est.nombreVerificacion});const estado=$('#hist-estado'),tabla=$('#hist-tabla');if(!estado||!tabla)return;if(error){estado.textContent='Historial no disponible: '+error.message;return;}const filas=data||[];estado.textContent=filas.length?`${filas.length} intento(s) registrado(s). La mejor nota se calcula por evaluación y día.`:'Aún no hay intentos registrados.';tabla.innerHTML=filas.length?`<table><tr><th>Evaluación</th><th>Fecha</th><th>Estado</th><th>Nota</th><th>Mejor del día</th></tr>${filas.map(x=>`<tr><td>${esc(x.titulo)}</td><td>${esc(new Date(x.inicio).toLocaleString('es-PA'))}</td><td>${x.enviado_en?'Entregado':'Pendiente'}</td><td>${x.nota_5==null?'—':Number(x.nota_5).toFixed(2)}</td><td>${x.mejor_dia==null?'—':Number(x.mejor_dia).toFixed(2)}</td></tr>`).join('')}</table>`:'';};$('#hist-actualizar').onclick=cargarHistorial;await cargarHistorial();
 const cargarEvaluaciones=async()=>{const {data,error}=await sb.rpc('cia_eval_listar',{p_est:est.id,p_cedula:est.cedula,p_nombre:est.nombreVerificacion});const msg=$('#ev-est-msg'),lista=$('#ev-est-list');if(!msg||!lista)return;if(error){msg.textContent='No se pudieron consultar evaluaciones: '+error.message;return;}const a=data||[];msg.textContent=a.length?`${a.length} evaluación(es) disponible(s) o pendiente(s).`:'No hay evaluaciones activas para tu salón en este momento.';lista.innerHTML=a.map(v=>`<div class=card><b>${esc(v.titulo)}</b><p>${esc(v.estado)} · ${v.duracion_min} minutos · ${v.preguntas} preguntas</p><button data-ev-iniciar="${esc(v.id)}" ${v.estado!=='Disponible'?'disabled':''}>Iniciar evaluación</button></div>`).join('');lista.querySelectorAll('[data-ev-iniciar]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {data:r,error:er}=await sb.rpc('cia_eval_iniciar',{p_est:est.id,p_cedula:est.cedula,p_nombre:est.nombreVerificacion,p_eval:b.dataset.evIniciar});if(er){alert(er.message);b.disabled=false;return;}quizEvaluacion(r);});};$('#ev-est-recargar').onclick=cargarEvaluaciones;await cargarEvaluaciones();
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{const {data,error}=await sb.rpc('cia_iniciar',{p_est:est.id,p_tipo:b.dataset.t});if(error)return $('#m').textContent=error.message;quiz(data);});$('#s').onclick=()=>{est=null;inicio();};}
function quiz(d){let i=0;const R={};const inicioIntento=Date.now();let enviando=false;
 const resumen=()=>{const total=d.preguntas.length,contestadas=d.preguntas.filter(q=>R[q.id]!==undefined).length;return `${contestadas} de ${total} respondidas`;};
 const enviar=async()=>{if(enviando)return;const pendientes=d.preguntas.filter(q=>R[q.id]===undefined);if(pendientes.length){alert(`Faltan ${pendientes.length} preguntas por responder.`);return;}if(!confirm(`¿Enviar las ${d.preguntas.length} respuestas para calificar? No podrá modificarlas después.`))return;enviando=true;draw('<div class=card><h2>Guardando respuestas…</h2><p>Espere mientras Supabase calcula su resultado.</p></div>');const {data,error}=await sb.rpc('cia_enviar',{p_est:est.id,p_intento:d.intento,p_resp:R});if(error){enviando=false;draw(`<div class=card><h2>No se pudo enviar</h2><p class=err>${esc(error.message)}</p><button id=reintentar>Reintentar envío</button></div>`);$('#reintentar').onclick=enviar;return;}resultado(data);};
 const paso=()=>{const q=d.preguntas[i],x=q.datos;let cu='';
  if(q.tipo=='multiple'||q.tipo=='completar')cu=x.opciones.map(o=>`<button class=op data-v="${esc(o)}">${esc(o)}</button>`).join('');
  else if(q.tipo=='verdadero_falso')cu=['Verdadero','Falso'].map(o=>`<button class=op data-v="${o}">${o}</button>`).join('');
  else if(q.tipo=='relacionar')cu=x.izq.map(a=>`<label>${esc(a)}<select data-a="${esc(a)}"><option value="">Elige…</option>${x.der.map(b=>`<option>${esc(b)}</option>`).join('')}</select></label>`).join('');
  else{R[q.id]=R[q.id]||[...x.items];cu='<div id=lst></div>';}
  draw(`<div class=card><div class=bar><i style="width:${i/d.preguntas.length*100}%"></i></div><p class=s>Pregunta ${i+1} de ${d.preguntas.length} · ${resumen()}</p><h3>${esc(q.enunciado)}</h3>${cu}<p class=err id=m></p><button id=nx>${i<d.preguntas.length-1?'Siguiente':'Revisar y enviar'}</button><button class=sec id=anterior ${i===0?'disabled':''}>Anterior</button><p class=s>Tiempo transcurrido: ${Math.floor((Date.now()-inicioIntento)/60000)} minutos</p></div>`);
  app.querySelectorAll('.op').forEach(b=>{b.classList.toggle('sel',R[q.id]===b.dataset.v);b.onclick=()=>{R[q.id]=b.dataset.v;app.querySelectorAll('.op').forEach(o=>o.classList.toggle('sel',o==b));};});
  app.querySelectorAll('select').forEach(s=>{s.value=R[q.id]?.[s.dataset.a]||'';s.onchange=()=>{(R[q.id]=R[q.id]||{})[s.dataset.a]=s.value;};});
  if(q.tipo=='ordenar'){const L=()=>{$('#lst').innerHTML=R[q.id].map((o,k)=>`<div class=row><span>${k+1}. ${esc(o)}</span><span><button class=sec data-m="${k}:-1" aria-label="Subir">▲</button><button class=sec data-m="${k}:1" aria-label="Bajar">▼</button></span></div>`).join('');
   $('#lst').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const [k,s]=b.dataset.m.split(':').map(Number),a=R[q.id];if(a[k+s]===undefined)return;[a[k],a[k+s]]=[a[k+s],a[k]];L();});};L();}
  $('#anterior').onclick=()=>{if(i>0){i--;paso();}};
  $('#nx').onclick=()=>{const r=R[q.id];if(q.tipo==='relacionar'?(!r||x.izq.some(a=>!r[a])):r===undefined||r===null||r==='')return $('#m').textContent='Responde antes de continuar.';if(i<d.preguntas.length-1){i++;return paso();}const faltan=d.preguntas.filter(v=>R[v.id]===undefined).length;draw(`<div class=card><h2>Revisar intento</h2><p>${resumen()}</p><p>${faltan?'Aún faltan '+faltan+' respuestas.':'Todas las respuestas están registradas.'}</p><p>Tiempo transcurrido: ${Math.floor((Date.now()-inicioIntento)/60000)} minutos.</p><button id=confirmar ${faltan?'disabled':''}>Enviar y calificar</button><button class=sec id=volver>Volver a revisar</button></div>`);$('#confirmar').onclick=enviar;$('#volver').onclick=()=>{i=d.preguntas.length-1;paso();};};};
 paso();}
function quizEvaluacion(d){let pos=0,env=false;const respuestas={};const preguntas=d.preguntas||[];const vence=new Date(d.vence).getTime();let reloj;
 const tiempo=()=>Math.max(0,Math.ceil((vence-Date.now())/1000));
 const entregar=async(forzado=false)=>{if(env)return;if(!forzado&&!confirm('¿Entregar la evaluación? Ya no podrá modificar sus respuestas.'))return;env=true;clearInterval(reloj);draw('<div class=card><h2>Calificando evaluación…</h2></div>');const {data,error}=await sb.rpc('cia_eval_entregar',{p_est:est.id,p_cedula:est.cedula,p_nombre:est.nombreVerificacion,p_intento:d.intento,p_respuestas:respuestas});if(error){draw(`<div class=card><h2>Problema al entregar</h2><p class=err>${esc(error.message)}</p><button id=reintentar>Reintentar</button></div>`);$('#reintentar').onclick=()=>{env=false;entregar(true)};return;}draw(`<div class=card><h2>Evaluación entregada</h2><p>Calificación: <b>${Number(data.nota_5).toFixed(2)} / 5.00</b></p><p>Aciertos: ${data.aciertos} de ${data.total}</p><button id=volver>Volver a mis actividades</button></div>`);$('#volver').onclick=menu;};
 const mostrar=()=>{if(tiempo()<=0)return entregar(true);const q=preguntas[pos],op=q.datos?.opciones|| (q.tipo==='verdadero_falso'?['Verdadero','Falso']:[]);draw(`<div class=card><h2>${esc(d.titulo)}</h2><p>Pregunta ${pos+1} de ${preguntas.length} · <strong id=cronometro></strong></p><div class=bar><i style="width:${100*(pos+1)/preguntas.length}%"></i></div><h3>${esc(q.enunciado)}</h3>${op.map(o=>`<button class="op ${respuestas[q.id]===o?'sel':''}" data-resp="${esc(o)}">${esc(o)}</button>`).join('')}<p class=err id=aviso></p><button id=atras ${pos===0?'disabled':''}>Anterior</button><button id=adelante>${pos===preguntas.length-1?'Revisar y entregar':'Siguiente'}</button><button class=sec id=entregar>Entregar ahora</button></div>`);app.querySelectorAll('[data-resp]').forEach(b=>b.onclick=()=>{respuestas[q.id]=b.dataset.resp;app.querySelectorAll('[data-resp]').forEach(x=>x.classList.toggle('sel',x===b));});$('#atras').onclick=()=>{pos--;mostrar()};$('#adelante').onclick=()=>{if(pos<preguntas.length-1){pos++;mostrar()}else{const sin=preguntas.filter(x=>respuestas[x.id]===undefined).length;if(sin&&!confirm(`Quedan ${sin} preguntas sin responder. ¿Desea entregar?`))return;entregar()}};$('#entregar').onclick=()=>entregar();actualizar();};
 const actualizar=()=>{const c=$('#cronometro');if(c)c.textContent=`Tiempo restante: ${Math.floor(tiempo()/60)}:${String(tiempo()%60).padStart(2,'0')}`;if(tiempo()<=0){clearInterval(reloj);entregar(true)}};mostrar();reloj=setInterval(actualizar,1000);
}
function resultado(r){const nota5=r.total?Math.max(1,Math.min(5,1+4*r.nota/r.total)):1;draw(`<div class=card><h2>Resultado: ${nota5.toFixed(2)} / 5.00</h2><p>Aciertos: ${r.nota} de ${r.total} (${r.total?Math.round(r.nota/r.total*100):0}%). Escala orientativa de 1 a 5; el registro oficial sigue dependiendo de Supabase.</p><button id=o>Hacer otro ejercicio</button></div>${r.detalle.map((q,k)=>`<div class="card ${q.ok?'bien':'mal'}"><b>${k+1}. ${esc(q.enunciado)}</b><p>${q.ok?'Correcta':'Incorrecta'}. Respuesta: <b>${esc(fmt(q.correcta))}</b></p><p class=s>${esc(q.explicacion)}</p></div>`).join('')}`);$('#o').onclick=menu;}

/* ---------- DOCENTE ---------- */
async function loginDoc(){const {data:{session}}=await sb.auth.getSession();if(session)return panel();
 draw(`<div class=card><h2>Ingreso docente</h2><label>Correo<input id=em type=email></label><label>Contraseña<input id=pw type=password></label><p class=err id=m></p><button id=go>Entrar</button><button class=sec id=b>Volver</button></div>`);$('#b').onclick=inicio;
 $('#go').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return $('#m').textContent=error.message;panel();};}
async function panel(){
 const {data:ud,error:ue}=await sb.auth.getUser();
 const user=ud?.user;
 if(ue||!user){draw(`<div class=card><p class=err>No se pudo verificar la sesión: ${esc(ue?.message||'sesión no disponible')}.</p><button id=x>Volver</button></div>`);$('#x').onclick=loginDoc;return;}
 const {data:dc,error:de}=await sb.from('cia_docentes').select('id').eq('id',user.id).maybeSingle();
 if(de||!dc){
  const detalle=de?`Error de consulta (${esc(de.code||'sin código')}): ${esc(de.message)}. ${esc(de.details||'')}`:'La consulta no devolvió el registro. Compruebe que la sesión pertenezca al mismo proyecto Supabase que contiene el docente.';
  draw(`<div class=card><h2>No se pudo verificar el acceso docente</h2><p class=err>${detalle}</p><p class=s>Cuenta: ${esc(user.email||'sin correo')} · ID: ${esc(user.id)}</p><button id=x class=sec>Salir</button></div>`);
  $('#x').onclick=async()=>{await sb.auth.signOut();inicio();};return;
 }
 draw(`<div class="card tabs"><button data-p=informe>Resumen</button><button data-p=banco>Banco de preguntas</button><button data-p=est>Estudiantes</button><button data-p=eval>Evaluaciones</button><button data-p=res>Resultados</button><button class=sec id=x>Salir</button></div><div id=v></div>`);
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-p]').forEach(o=>o.classList.toggle('on',o==b));({informe:tInforme,banco:tBanco,est:tEst,eval:tEvaluaciones,res:tRes})[b.dataset.p](user.id);});
 $('#x').onclick=async()=>{await sb.auth.signOut();inicio();};app.querySelector('[data-p=informe]').click();}

let texto='';
const clavePregunta=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const descargarArchivo=(nombre,contenido,tipo)=>{const url=URL.createObjectURL(new Blob([contenido],{type:tipo}));const a=document.createElement('a');a.href=url;a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);};
const csvCelda=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const avisoError=(e)=>`<p class="err">Error de Supabase: ${esc(e.message)} (${esc(e.code||'')})</p>`;
async function tInforme(uid){
 $('#v').innerHTML='<div class=card><h2>Resumen general</h2><p>Consultando datos del proyecto…</p></div>';
 const [p,e,i,x]=await Promise.all([
  sb.from('cia_preguntas').select('id,tema,nivel').eq('docente_id',uid),
  sb.from('cia_estudiantes').select('id,nombres,grado,seccion').eq('docente_id',uid),
  sb.from('cia_intentos').select('id,nota,revision_pendiente,estudiante_id,creado_en').eq('docente_id',uid),
  sb.from('cia_ejercicios').select('id,titulo').eq('docente_id',uid)]);
 const error=[p,e,i,x].find(r=>r.error)?.error;
 if(error){$('#v').innerHTML=`<div class=card>${avisoError(error)}</div>`;return;}
 const grupos=new Map();e.data.forEach(a=>{const k=`${a.grado||'Sin grado'} ${a.seccion||''}`.trim();grupos.set(k,(grupos.get(k)||0)+1);});
 const notas=i.data.map(r=>Number(r.nota)).filter(n=>Number.isFinite(n));
 const promedio=notas.length?(notas.reduce((a,b)=>a+b,0)/notas.length).toFixed(2):'Sin notas';
 const pendientes=i.data.filter(r=>r.revision_pendiente).length;
 const porTema=new Map();p.data.forEach(q=>{const t=q.tema||'Sin tema';porTema.set(t,(porTema.get(t)||0)+1);});

 $('#exportar-mejores').onclick=()=>{const filas=[['estudiante','cedula','ejercicio','mejor_nota','nota_maxima','porcentaje'],...[...mejores.values()].map(m=>{const a=alumnos.get(m.estudiante_id)||{},e=ejercicios.get(m.ejercicio_id)||{};return[a.nombres||'',a.cedula||'',e.titulo||'',m.nota,m.max,m.pct.toFixed(1)+'%'];})];descargarArchivo('cia_mejores_notas.csv','\ufeff'+filas.map(r=>r.map(csvCelda).join(',')).join('\r\n'),'text/csv;charset=utf-8');};
 $('#imprimir-resultados').onclick=()=>window.print();
 $('#ex').onclick=()=>{const csv='\ufeffnombre,cedula,ejercicio,nota,fecha,revision\n'+f.filter((r,i)=>!app.querySelectorAll('[data-resultado]')[i].hidden).map(r=>r.map(c=>csvCelda(c)).join(',')).join('\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=url;a.download='resultados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
}
