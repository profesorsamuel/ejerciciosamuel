<script type="module">

const CONFIG={url:'https://luewrpzgetqslxqmdcxv.supabase.co',key:'sb_publishable_zJc68aiTxJs7HBgaqeHxrQ_JDcm91xG'};
const sb=createClient(CONFIG.url||'https://sin-configurar.supabase.co',CONFIG.key||'sin-configurar');
const $=s=>document.querySelector(s),app=$('#app'),draw=h=>app.innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
const TIPOS={multiple:'Selección múltiple',verdadero_falso:'Verdadero o falso',completar:'Completar el espacio',relacionar:'Relacionar columnas',ordenar:'Ordenar la secuencia'};
const etiquetaEval=t=>t==='e2'?'Evaluación 2':'Evaluación 1';
function claveMarca(tipo){const p=window.__ciaPeriodoActual;return 'cia-realizado:'+est?.id+':'+(p?.id||'sin-periodo')+':'+(p?.tecnica||'defecto')+':'+tipo;}

async function recuperarRealizados(){
 if(!est?.cedula)return;
 try{const {data,error}=await sb.rpc('cia_marcas_realizadas',{p_cedula:est.cedula});
 if(error)throw error;const p=window.__ciaPeriodoActual;
 for(const x of (Array.isArray(data)?data:[])){if(String(x.periodo_id||'sin-periodo')===String(p?.id||'sin-periodo')){try{localStorage.setItem(claveMarca(x.tipo),'1')}catch(_){}}}
 pintarRealizados();
 }catch(e){console.warn('Marcas de servidor no disponibles; se mantienen las locales:',e.message)}
}
async function registrarRealizadoServidor(tipo){
 try{const {error}=await sb.rpc('cia_registrar_marca',{p_cedula:est.cedula,p_periodo:window.__ciaPeriodoActual?.id||null,p_tipo:tipo});if(error)throw error;}catch(e){console.warn('No se pudo sincronizar marca:',e.message||e)}
}

const META=18; // 18 por tipo x 5 tipos = 90 preguntas (mínimo pedido: 80)
let est=null;
const fmt=c=>Array.isArray(c)?(Array.isArray(c[0])?c.map(p=>p.join(' = ')).join('; '):c.join(' → ')):c;

function inicio(){draw(`<div class=card><h2>¿Quién eres?</h2>${CONFIG.url?'':'<p class=err>Falta configurar Supabase en index.html (CONFIG).</p>'}<button class=big id=e>Soy estudiante</button><button class="big sec" id=d>Soy docente</button></div>`);$('#e').onclick=loginEst;$('#d').onclick=loginDoc;}

/* ---------- ESTUDIANTE ---------- */
function loginEst(){draw(`<div class=card><h2>Ingreso de estudiante</h2><p>Escribe tu cédula tal como aparece en la matrícula de Portal 2027.</p><label>Cédula<input id=c inputmode=text autocomplete=off placeholder="Ejemplo: 3-123-456"></label><p class=err id=m></p><button id=go>Entrar</button><button class=sec id=b>Volver</button></div>`);
$('#b').onclick=inicio;
$('#c').onkeydown=e=>{if(e.key==='Enter')$('#go').click();};
$('#go').onclick=async()=>{const c=$('#c').value.trim();if(!c)return $('#m').textContent='Escribe tu cédula.';
 const boton=$('#go');boton.disabled=true;$('#m').textContent='Comprobando matrícula…';
 try{const {data,error}=await sb.rpc('cia_ingresar_cedula',{p_cedula:c});if(error){$('#m').textContent=error.code==='PGRST202'?'Primero ejecute cia_acceso_solo_cedula.sql en Supabase.':error.message;return;}
 if(!data||!data.id){$('#m').textContent='No se encontró una cédula única en la matrícula. Consulte al profesor.';return;}
 est={...data,cedula:c,nombreVerificacion:data.nombres};menu();}finally{boton.disabled=false;}};}
async function tecnicaActiva(){try{const {data,error}=await sb.rpc('cia_tecnica_activa',{p_cedula:est.cedula});return !error&&data==='e2'?'e2':'banco';}catch{return 'banco';}}
async function obtenerPeriodo(){
 try{const {data,error}=await sb.rpc('cia_periodo_activo',{p_cedula:est.cedula});if(error)throw error;return {periodo:Array.isArray(data)?data[0]:data,error:null};}
 catch(e){return {periodo:null,error:e.message||String(e)};}
}
function periodoHtml(p){if(!p)return '<div class="card"><h3>Periodos de práctica</h3><p>No hay un periodo vigente para tu salón.</p></div>';
 const cierre=p.fin||p.cierre,fecha=cierre?new Date(cierre):null;
 return `<div class="card"><h3>${esc(p.titulo||'Periodo de práctica')}</h3><p class="s">${esc(p.inicio?new Date(p.inicio).toLocaleString('es-PA'):'')} — ${esc(fecha&&!isNaN(fecha)?fecha.toLocaleString('es-PA'):'')}</p><b id="periodo-reloj">Calculando tiempo…</b><div id="periodo-notas" class="wrap"><p class="s">Consultando notas…</p></div></div>`;
}
let periodoReloj=null;
function iniciarReloj(p){if(periodoReloj)clearInterval(periodoReloj);if(!p)return;
 const fin=new Date(p.fin||p.cierre).getTime();const actualizar=()=>{const el=$('#periodo-reloj');if(!el){clearInterval(periodoReloj);periodoReloj=null;return;}if(!Number.isFinite(fin)){el.textContent='Cierre sin fecha válida';return;}let t=Math.max(0,Math.floor((fin-Date.now())/1000));if(!t){el.textContent='Cerrado';app.querySelectorAll('[data-t],[data-e2t]').forEach(b=>b.disabled=true);return;}const d=Math.floor(t/86400);t%=86400;el.textContent=`Te faltan ${d} días ${Math.floor(t/3600)} horas ${Math.floor(t%3600/60)} minutos`;};actualizar();periodoReloj=setInterval(actualizar,15000);
}
async function mostrarNotasPeriodo(){const el=$('#periodo-notas');if(!el)return;const {data,error}=await sb.rpc('cia_periodo_notas',{p_est:est.id});if(!$('#periodo-notas'))return;if(error){el.textContent='No se pudieron consultar las notas: '+error.message;return;}
 const filas=Array.isArray(data)?data:(data?.practicas||data?.notas||[]);if(!Array.isArray(filas)||!filas.length){el.innerHTML='<p class="s">Todavía no hay notas para este periodo.</p>';return;}
 const nota=x=>{const n=Number(x);return Number.isFinite(n)?n.toFixed(2):'1.00'};
 const periodoActual=window.__ciaPeriodoActual;
 const tipos=periodoActual?.tecnica==='e2'?{detective:'Detective de errores',quien:'¿Quién soy?',causa:'Causa y efecto',mito:'Mito o ciencia',casos:'Casos prácticos'}:TIPOS;
 const detalle=filas.filter(f=>tipos[f.practica||f.tipo||f.tecnica||f.nombre]);
 const completas=detalle.length===5;
 const items=Object.entries(tipos).map(([clave,nombre])=>{
   const f=detalle.find(x=>(x.practica||x.tipo||x.tecnica||x.nombre)===clave);
   return `<tr><td>${esc(nombre)}</td><td>${nota(f?.mejor_nota??f?.nota_5??f?.nota??1)}</td></tr>`;
 });
 const promedio=Object.keys(tipos).reduce((suma,k)=>{
   const f=detalle.find(x=>(x.practica||x.tipo||x.tecnica||x.nombre)===k);
   return suma+Number(f?.mejor_nota??f?.nota_5??f?.nota??1);
 },0)/5;
 el.innerHTML=`<table><thead><tr><th>Práctica</th><th>Mejor nota</th></tr></thead><tbody>${items.join('')}</tbody></table><p><b>Nota final: ${nota(promedio)} / 5.00</b></p>${!completas?'<p class="s">Aviso: Supabase no está devolviendo el detalle de las cinco prácticas; las notas faltantes aparecen como 1.00 hasta corregir la función SQL.</p>':''}`;
}
async function menu(auto){const consulta=await obtenerPeriodo(),periodo=consulta.periodo;window.__ciaPeriodoActual=periodo;const activa=periodo?(periodo.tecnica==='e2'?'e2':'banco'):await tecnicaActiva();const cerrado=periodo&&new Date(periodo.fin||periodo.cierre).getTime()<=Date.now();draw(`<div class=card><h2>Hola, ${esc(est.nombres)}</h2>${activa==='e2'?`<p>Elige tu ejercicio. Cada intento trae 8 preguntas. Responde todas antes de enviar.</p>${e2PanelHTML()}`:`<p>Elige un ejercicio. Cada intento trae 8 preguntas distintas. Responde todas antes de enviar.</p>${`<h3>Evaluación 1</h3><div class="practicas-grid">`+Object.entries(TIPOS).map(([k,v])=>`<button class=big data-t=${k}>${v}</button>`).join('')+`</div>`}`}<p class=err id=m></p><button class=sec id=s>Salir</button></div>${periodoHtml(periodo)}`);if(periodo){iniciarReloj(periodo);await mostrarNotasPeriodo();}pintarRealizados();await recuperarRealizados();if(cerrado)app.querySelectorAll('[data-t],[data-e2t]').forEach(b=>b.disabled=true);
const contenedor=document.createElement('div');contenedor.className='card';contenedor.innerHTML='<h2>Evaluaciones asignadas</h2><p id=ev-est-msg>Buscando evaluaciones vigentes…</p><div id=ev-est-list></div><button class=sec id=ev-est-recargar>Actualizar evaluaciones</button>';app.append(contenedor);
 const historial=document.createElement('div');historial.className='card';historial.innerHTML='<h2>Mi historial de evaluaciones</h2><p id=hist-estado>Consultando intentos…</p><div class=wrap id=hist-tabla></div><button class=sec id=hist-actualizar>Actualizar historial</button>';app.append(historial);
 const cargarHistorial=async()=>{const {data,error}=await sb.rpc('cia_eval_historial',{p_est:est.id,p_cedula:est.cedula,p_nombre:est.nombreVerificacion});const estado=$('#hist-estado'),tabla=$('#hist-tabla');if(!estado||!tabla)return;if(error){estado.textContent='Historial no disponible: '+error.message;return;}const filas=data||[];estado.textContent=filas.length?`${filas.length} intento(s) registrado(s). La mejor nota se calcula por evaluación y día.`:'Aún no hay intentos registrados.';tabla.innerHTML=filas.length?`<table><tr><th>Evaluación</th><th>Fecha</th><th>Estado</th><th>Nota</th><th>Mejor del día</th></tr>${filas.map(x=>`<tr><td>${esc(x.titulo)}</td><td>${esc(new Date(x.inicio).toLocaleString('es-PA'))}</td><td>${x.enviado_en?'Entregado':'Pendiente'}</td><td>${x.nota_5==null?'—':Number(x.nota_5).toFixed(2)}</td><td>${x.mejor_dia==null?'—':Number(x.mejor_dia).toFixed(2)}</td></tr>`).join('')}</table>`:'';};$('#hist-actualizar').onclick=cargarHistorial;await cargarHistorial();
 const cargarEvaluaciones=async()=>{const {data,error}=await sb.rpc('cia_eval_listar',{p_est:est.id,p_cedula:est.cedula,p_nombre:est.nombreVerificacion});const msg=$('#ev-est-msg'),lista=$('#ev-est-list');if(!msg||!lista)return;if(error){msg.textContent='No se pudieron consultar evaluaciones: '+error.message;return;}const a=data||[];msg.textContent=a.length?`${a.length} evaluación(es) disponible(s) o pendiente(s).`:'No hay evaluaciones activas para tu salón en este momento.';lista.innerHTML=a.map(v=>`<div class=card><b>${esc(v.titulo)}</b><p>${esc(v.estado)} · ${v.duracion_min} minutos · ${v.preguntas} preguntas</p><button data-ev-iniciar="${esc(v.id)}" ${v.estado!=='Disponible'?'disabled':''}>Iniciar evaluación</button></div>`).join('');lista.querySelectorAll('[data-ev-iniciar]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {data:r,error:er}=await sb.rpc('cia_eval_iniciar',{p_est:est.id,p_cedula:est.cedula,p_nombre:est.nombreVerificacion,p_eval:b.dataset.evIniciar});if(er){alert(er.message);b.disabled=false;return;}quizEvaluacion(r);});};$('#ev-est-recargar').onclick=cargarEvaluaciones;await cargarEvaluaciones();
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{if(cerrado)return $('#m').textContent='Periodo cerrado.';const {data,error}=await sb.rpc('cia_iniciar',{p_est:est.id,p_tipo:b.dataset.t});if(error)return $('#m').textContent=error.message;quiz(data,b.dataset.t);});if(activa==='e2'&&!cerrado)e2Cablear();$('#s').onclick=()=>{est=null;inicio();};}
// Mezcla Fisher-Yates: se aplica una sola vez por intento, nunca al volver atrás.
function mezclarOpciones(valores){const a=[...valores];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quiz(d,tipoPractica){
 const opcionesIntento=new Map();
 for(const q of d.preguntas){const x=q.datos||{};
  if(q.tipo==='multiple'||q.tipo==='completar')opcionesIntento.set(q.id,mezclarOpciones(x.opciones||[]));
  else if(q.tipo==='verdadero_falso')opcionesIntento.set(q.id,mezclarOpciones(['Verdadero','Falso']));
  else if(q.tipo==='relacionar')opcionesIntento.set(q.id,mezclarOpciones(x.der||[]));
  else if(q.tipo==='ordenar')opcionesIntento.set(q.id,mezclarOpciones(x.items||[]));
 }
 let i=0;const R={};const inicioIntento=Date.now();let enviando=false;
 const resumen=()=>{const total=d.preguntas.length,contestadas=d.preguntas.filter(q=>R[q.id]!==undefined).length;return `${contestadas} de ${total} respondidas`;};
 const enviar=async()=>{if(enviando)return;const pendientes=d.preguntas.filter(q=>R[q.id]===undefined);if(pendientes.length){alert(`Faltan ${pendientes.length} preguntas por responder.`);return;}if(!confirm(`¿Enviar las ${d.preguntas.length} respuestas para calificar? No podrá modificarlas después.`))return;enviando=true;draw('<div class=card><h2>Guardando respuestas…</h2><p>Espere mientras Supabase calcula su resultado.</p></div>');const {data,error}=await sb.rpc('cia_enviar',{p_est:est.id,p_intento:d.intento,p_resp:R});if(error){enviando=false;draw(`<div class=card><h2>No se pudo enviar</h2><p class=err>${esc(error.message)}</p><button id=reintentar>Reintentar envío</button></div>`);$('#reintentar').onclick=enviar;return;}marcarRealizado("banco:"+tipoPractica);await registrarRealizadoServidor("banco:"+tipoPractica);resultado(data);};
 const paso=()=>{const q=d.preguntas[i],x=q.datos;let cu='';
  if(q.tipo=='multiple'||q.tipo=='completar')cu=opcionesIntento.get(q.id).map(o=>`<button class=op data-v="${esc(o)}">${esc(o)}</button>`).join('');
  else if(q.tipo=='verdadero_falso')cu=opcionesIntento.get(q.id).map(o=>`<button class=op data-v="${o}">${o}</button>`).join('');
  else if(q.tipo=='relacionar')cu=x.izq.map(a=>`<label>${esc(a)}<select data-a="${esc(a)}"><option value="">Elige…</option>${opcionesIntento.get(q.id).map(b=>`<option>${esc(b)}</option>`).join('')}</select></label>`).join('');

   $('#no').onclick=()=>{pv.innerHTML='';$('#f').value='';};

/* ======== ENLACE 2 · DOCENTE (banco de técnicas con Gemini) ======== */
const E2_TECNICAS={detective:'Detective de errores',quien:'¿Quién soy?',causa:'Causa y efecto',mito:'Mito o ciencia',casos:'Casos prácticos'};
const E2_META=8,E2_GRADOS=['7','8','9','10','11','12'];
const e2Sin=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const e2Clave=s=>e2Sin(s).replace(/[^a-z0-9]+/g,' ').trim();

function e2Normalizar(p){
 if(!p||typeof p!=='object')return{error:'Registro vacío o inválido'};
 const clave=e2Sin(p.tipo??p.tecnica??p.tipo_pregunta).replace(/[^a-z0-9]+/g,'_');
 const mapa={detective:'detective',detective_de_errores:'detective',error:'detective',quien:'quien',quien_soy:'quien',quien_soy_:'quien',causa:'causa',causa_efecto:'causa',causa_y_efecto:'causa',mito:'mito',mito_o_ciencia:'mito',caso:'casos',casos:'casos',casos_practicos:'casos',caso_practico:'casos'};
 const tipo=mapa[clave];if(!tipo)return{error:'Técnica no reconocida: '+String(p.tipo??p.tecnica??'sin tipo')};
 const pregunta=String(p.pregunta??p.enunciado??'').trim();if(!pregunta)return{error:'Enunciado vacío'};
 const fuente=p.opciones??p.alternativas??[];
 let opciones=Array.isArray(fuente)?fuente.map(x=>typeof x==='string'?x:String(x?.texto??x?.valor??'')).map(x=>x.trim()).filter(Boolean):[];
 let respuesta=String(p.respuesta??p.respuesta_correcta??p.correcta??'').trim();
 if(/^[A-D]$/i.test(respuesta)&&opciones.length>=respuesta.toUpperCase().charCodeAt(0)-64)respuesta=opciones[respuesta.toUpperCase().charCodeAt(0)-65];
 const igual=(a,b)=>e2Sin(a).replace(/\s+/g,' ')===e2Sin(b).replace(/\s+/g,' ');
 const existente=opciones.find(x=>igual(x,respuesta));if(existente)respuesta=existente;
 if(!respuesta)return{error:'Sin respuesta correcta'};
 if(!opciones.some(x=>igual(x,respuesta)))opciones.unshift(respuesta);
 opciones=opciones.filter((x,i)=>opciones.findIndex(y=>igual(x,y))===i);
 if(opciones.length<3)return{error:'Menos de tres alternativas distintas'};
 opciones=[respuesta,...opciones.filter(x=>!igual(x,respuesta)).slice(0,2)];
 for(let i=opciones.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opciones[i],opciones[j]]=[opciones[j],opciones[i]]}
 return{tipo,pregunta,opciones,respuesta,explicacion:String(p.explicacion??p.justificacion??'').trim(),guardada:false};
}

/* ======== MATERIAS · flujo guiado: materia → salones → PDF, grado y técnica → preguntas ======== */
const SECCIONES=['A','B','C','D'];
const BANCO_TIPOS={seleccion_multiple:'Selección múltiple',verdadero_falso:'Verdadero o falso',completar:'Completar el espacio'};
const NIVELES=['facil','medio','dificil'];
let matActual=null,pdfCache=null;
const porGrado=(a,b)=>(Number(a)||0)-(Number(b)||0);
async function leerPdf(file){
 if(!file||file.type!=='application/pdf')throw Error('Seleccione un archivo PDF');
 if(file.size>10*1024*1024)throw Error('El PDF supera 10 MB');
 if(!window.pdfjsLib)throw Error('No se cargó el lector de PDF; revise la conexión');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
 const pag=[];for(let n=1;n<=doc.numPages;n++){const c=await(await doc.getPage(n)).getTextContent();pag.push(c.items.map(x=>x.str).join(' '));}
 const texto=pag.join('\n').slice(0,45000);
 if(texto.trim().length<150)throw Error('PDF sin texto suficiente; los PDF escaneados requieren OCR');
 return {nombre:file.name,texto,paginas:doc.numPages};
}
async function invocarIA(body){
 const {data,error}=await sb.functions.invoke('cia-generar',{body});
 if(error){let msg=error.message;try{const j=await error.context.json();if(j?.error)msg=j.error}catch{}throw Error(msg)}
 if(data?.error)throw Error(data.error);return data;
}
function bancoNormalizar(p){
 if(!p||typeof p!=='object')return{error:'Registro inválido'};
 const tipo=String(p.tipo||'').trim();if(!BANCO_TIPOS[tipo])return{error:'Tipo no reconocido: '+tipo};
 const enunciado=String(p.pregunta??p.enunciado??'').trim();if(!enunciado)return{error:'Enunciado vacío'};
 let ops=(Array.isArray(p.opciones)?p.opciones:[]).map(x=>String(x??'').trim()).filter(Boolean);
 ops=ops.filter((x,i)=>ops.findIndex(y=>e2Sin(y)===e2Sin(x))===i);
 let correcta=String(p.respuesta??p.correcta??'').trim();
 const ex=ops.find(x=>e2Sin(x)===e2Sin(correcta));if(ex)correcta=ex;
 if(!correcta||!ops.includes(correcta))return{error:'La respuesta no está entre las opciones'};
 if(tipo==='verdadero_falso'){if(ops.length!==2)return{error:'Verdadero/falso mal formado'};}
 else if(ops.length<3)return{error:'Menos de tres opciones'};
 return{tipo,enunciado,opciones:ops,correcta,explicacion:String(p.explicacion??'').trim(),nivel:NIVELES.includes(p.dificultad)?p.dificultad:'medio'};
}
const e2Unificar=r=>{const p=e2Normalizar(r);return p.error?p:{tipo:p.tipo,enunciado:p.pregunta,opciones:p.opciones,correcta:p.respuesta,explicacion:p.explicacion,nivel:'medio'};};

 const estadoPdf=()=>{$('#gpi').textContent=pdfCache?`PDF listo: ${pdfCache.nombre} · ${pdfCache.paginas} páginas. Puedes generar con otra técnica sin subirlo de nuevo.`:'Aún no has subido un PDF.';$('#gen').disabled=!pdfCache;};

 let pregs=[],gctx=null;const pend=()=>pregs.filter(p=>!p.guardada);

 const guardar=async(p,enun,vals,idx,exp)=>{
  if(!enun)throw Error('Falta el enunciado');
  if(vals.some(x=>!x)||new Set(vals.map(e2Sin)).size!==vals.length)throw Error('Las alternativas deben estar completas y ser distintas');
  const correcta=vals[idx];
  if(gctx.e2){
   const {data:ex,error:er}=await sb.from('cia14_preguntas').select('id').eq('docente_id',c.uid).eq('materia_id',c.mat.id).eq('grado',gctx.grado).eq('tecnica',p.tipo).eq('enunciado',enun).limit(1);
   if(er)throw er;if(ex?.length)throw Error('Esta pregunta ya está en el banco');
   const {error}=await sb.from('cia14_preguntas').insert({docente_id:c.uid,materia_id:c.mat.id,grado:gctx.grado,tecnica:p.tipo,enunciado:enun,opciones:vals,correcta,explicacion:exp,activa:true});
   if(error)throw error;return;
  }
  if(!gctx.bancoId){const {data:b,error:be}=await sb.from('cia_bancos').insert({docente_id:c.uid,nombre:`${c.mat.nombre} · ${gctx.grado}.º · ${gctx.tema}`.slice(0,150),fuente:'PDF / Gemini'}).select('id').single();if(be)throw be;gctx.bancoId=b.id;}
  const {data:q,error:qe}=await sb.from('cia_preguntas').insert({docente_id:c.uid,banco_id:gctx.bancoId,enunciado:enun,correcta,explicacion:exp,distractores:vals.filter((_,j)=>j!==idx),tema:gctx.tema,nivel:p.nivel||'medio',metadatos:{origen:'gemini_pdf',tipo:p.tipo}}).select('id').single();
  if(qe)throw qe;
  const {error:ce}=await sb.from('cia_pregunta_materia').upsert({pregunta_id:q.id,docente_id:c.uid,materia_id:c.mat.id,grado:gctx.grado},{onConflict:'pregunta_id'});
  if(ce){await sb.from('cia_preguntas').delete().eq('id',q.id).eq('docente_id',c.uid);throw Error('No se pudo asignar a la materia: '+ce.message);}
 };
 const resumenPend=()=>{const n=pend().length;root.querySelectorAll('[data-lote]').forEach(b=>{b.style.display=n?'':'none';b.textContent=`Guardar todas las pendientes (${n})`});$('#ges').textContent=n?`Pendientes por revisar: ${n}.`:'No quedan preguntas pendientes. Revisa el paso 3 para verlas.';};
 const pintar=()=>{
  const cont=$('#grev');cont.innerHTML='';
  const T=gctx.e2?E2_TECNICAS:BANCO_TIPOS;
  const cab=document.createElement('div');cab.className='card';cab.innerHTML=`<b>Se guardarán en:</b> ${esc(c.mat.nombre)} · ${esc(gctx.grado)}.º · ${gctx.e2?'Evaluación 2':'Evaluación 1'}<br><span class=s>Revisa cada pregunta (puedes editarla), luego guárdala o descártala. Nada se guarda solo.</span><br><button data-lote></button>`;cont.append(cab);
  pregs.forEach((p,i)=>{
   if(p.guardada)return;
   const d=document.createElement('div');d.className='card e2-item';
   const t=document.createElement('b');t.textContent=`Pregunta ${i+1} · ${T[p.tipo]||p.tipo}`;d.append(t);
   const en=document.createElement('textarea');en.rows=3;en.value=p.enunciado;en.setAttribute('aria-label','Enunciado');d.append(en);
   const ops=p.opciones.map((o,j)=>{const x=document.createElement('input');x.value=o;x.setAttribute('aria-label','Alternativa '+(j+1));d.append(x);return x;});
   const sel=document.createElement('select');ops.forEach((_,j)=>{const o=document.createElement('option');o.value=j;o.textContent='Respuesta correcta: '+String.fromCharCode(65+j);sel.append(o);});sel.value=Math.max(0,p.opciones.indexOf(p.correcta));d.append(sel);
   const ex=document.createElement('textarea');ex.rows=2;ex.value=p.explicacion||'';ex.setAttribute('aria-label','Explicación');d.append(ex);
   const er=document.createElement('p');er.className='err';d.append(er);
   p.guardar=async()=>{er.textContent='';d.style.borderColor='';try{await guardar(p,en.value.trim(),ops.map(x=>x.value.trim()),Number(sel.value),ex.value.trim());p.guardada=true;d.remove();return true;}catch(e){er.textContent=e.message;d.style.borderColor='var(--mal)';return false;}};
   const b1=document.createElement('button');b1.textContent='Guardar';b1.onclick=async()=>{b1.disabled=true;const ok=await p.guardar();b1.disabled=false;if(ok)resumenPend();};

 $('#gen').onclick=async()=>{
  const btn=$('#gen'),st=$('#ges');btn.disabled=true;
  try{
   const e2=tipoSel()==='e2',tec=[...root.querySelectorAll('.gs:checked')].map(x=>x.value);
   if(!pdfCache)throw Error('Sube primero el PDF');
   if(!tec.length)throw Error('Marca al menos un tipo de pregunta');
   if(pend().length&&!confirm('Hay preguntas pendientes sin guardar. Si generas de nuevo se perderán. ¿Continuar?'))return;
   gctx={e2,grado:$('#gg').value,tema:$('#gt').value.trim()||pdfCache.nombre.replace(/\.pdf$/i,''),bancoId:null};
   st.textContent='Revisando las preguntas que ya tienes…';
   let r;
   if(e2)r=await sb.from('cia14_preguntas').select('enunciado').eq('docente_id',c.uid).eq('materia_id',c.mat.id).eq('grado',gctx.grado).in('tecnica',tec).limit(1000);
   else r=await sb.from('cia_preguntas').select('enunciado').eq('docente_id',c.uid).limit(2000);
   if(r.error)throw r.error;
   const previas=r.data||[],enBanco=new Set(previas.map(x=>e2Clave(x.enunciado))),evitar=previas.slice(-30).map(x=>x.enunciado);
   const objetivo=Number($('#gc').value),vistos=new Set(),rech=[],norm=e2?e2Unificar:bancoNormalizar;let recib=0,rondas=0;pregs=[];
   while(pregs.length<objetivo&&rondas<4){
    rondas++;st.textContent=`Generando lote ${rondas} de 4 · ${pregs.length} de ${objetivo} preguntas válidas…`;
    let data;
    try{data=await invocarIA({texto:pdfCache.texto,materia:c.mat.nombre,tema:gctx.tema,grado:gctx.grado,cantidad:Math.min(20,Math.max(5,objetivo-pregs.length)),tecnicas:tec,modo:e2?'enlace2':'banco',evitar:[...evitar,...pregs.slice(-30).map(x=>x.enunciado)].slice(-40)});}
    catch(err){if(!pregs.length)throw err;rech.push('Lote '+rondas+' falló: '+err.message);break;}
    const crudas=Array.isArray(data?.preguntas)?data.preguntas:[];recib+=crudas.length;
    for(const raw of crudas){
     const p=norm(raw);
     if(p.error){rech.push(p.error);continue;}
     if(!tec.includes(p.tipo)){rech.push('Tipo no solicitado');continue;}
     const k=e2Clave(p.enunciado);
     if(enBanco.has(k)){rech.push('Ya estaba guardada');continue;}
     if(vistos.has(k)){rech.push('Repetida');continue;}
     vistos.add(k);pregs.push(p);if(pregs.length===objetivo)break;
    }
    if(!crudas.length)break;
   }
   pintar();
   const res=Object.entries(rech.reduce((a,x)=>{const k=x.slice(0,80);a[k]=(a[k]||0)+1;return a;},{})).map(([k,n])=>k+' ('+n+')').join('; ');
   st.textContent=`Gemini devolvió ${recib} preguntas en ${rondas} lote(s); ${pregs.length} de ${objetivo} listas para revisar.${rech.length?' Descartadas '+rech.length+': '+res+'.':''}${pregs.length<objetivo?' Puedes generar de nuevo para completar las que faltan.':''}`;
  }catch(err){st.textContent='Error: '+(err.message||err);}
  finally{btn.disabled=!pdfCache;}
 };
}

async function matPreguntas(c,root){
 root.innerHTML='<div class=card><p>Cargando preguntas…</p></div>';

 const items=[...(e.data||[]).map(x=>({k:'e2',id:x.id,grado:String(x.grado),tec:x.tecnica,et:E2_TECNICAS[x.tecnica]||x.tecnica,enun:x.enunciado,cor:x.correcta,act:x.activa!==false})),...bq.map(x=>({k:'banco',id:x.id,grado:gMap.get(String(x.id))||'',tec:'banco',et:'Banco de preguntas',enun:x.enunciado,cor:x.correcta,act:true}))];
 const gr=(c.grados.length?c.grados:[...new Set(items.map(i=>i.grado).filter(Boolean))]).sort(porGrado),tipos=Object.keys(E2_TECNICAS);
 const cnt=(t,g)=>items.filter(i=>i.tec===t&&i.grado===g&&i.act).length;
 const cob=gr.length?`<div class=wrap><table class=e2cob><thead><tr><th>Técnica</th>${gr.map(g=>`<th>${g}.º</th>`).join('')}</tr></thead><tbody><tr><td>Banco de preguntas</td>${gr.map(g=>`<td>${cnt('banco',g)}</td>`).join('')}</tr>${tipos.map(t=>`<tr><td>${esc(E2_TECNICAS[t])}</td>${gr.map(g=>{const n=cnt(t,g);return `<td class="${n>=E2_META?'e2ok':'e2falta'}">${n}/${E2_META}${n>=E2_META?' ✓':''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class=s>Técnicas Enlace 2: meta de ${E2_META} preguntas por técnica y grado. El banco no tiene meta fija.</p>`:'<p class=s>Asigna salones en el paso 1 para ver la cobertura por grado.</p>';
 root.innerHTML=`<div class=card><h3>3 · Preguntas de ${esc(c.mat.nombre)}</h3><div class=resumen-banco><div><b>${items.filter(i=>i.k==='banco').length}</b><span>En el banco</span></div><div><b>${items.filter(i=>i.k==='e2').length}</b><span>Enlace 2</span></div></div>${cob}</div>
<div class=card><h3>Ver y eliminar preguntas</h3><div class=grid2><label>Técnica<select id=pt><option value="">Todas</option><option value=banco>Banco de preguntas</option>${tipos.map(t=>`<option value=${t}>${esc(E2_TECNICAS[t])}</option>`).join('')}</select></label><label>Grado<select id=pg><option value="">Todos</option>${gr.map(g=>`<option value=${g}>${g}.º</option>`).join('')}</select></label></div><p id=pc class=s></p><div id=pl></div></div>
<div class=card><details><summary><b>Crear una pregunta de Enlace 2 a mano</b></summary><label>Técnica<select id=mt>${tipos.map(t=>`<option value=${t}>${esc(E2_TECNICAS[t])}</option>`).join('')}</select></label><label>Grado<select id=mg>${(gr.length?gr:E2_GRADOS).map(g=>`<option value=${g}>${g}.º</option>`).join('')}</select></label><label>Enunciado<textarea id=me rows=3></textarea></label><label>Alternativa A<input id=ma1></label><label>Alternativa B<input id=ma2></label><label>Alternativa C<input id=ma3></label><label>Respuesta correcta<select id=mc><option value=0>A</option><option value=1>B</option><option value=2>C</option></select></label><label>Explicación<textarea id=mx rows=2></textarea></label><button id=mgd>Guardar pregunta</button><p id=mmsg class=s role=status></p></details></div>

 }
 if(seleccionAnterior && [...$('#e2catalogo').options].some(o=>o.value===String(seleccionAnterior.catalogo))) $('#e2catalogo').value=String(seleccionAnterior.catalogo);
 if(seleccionAnterior && [...$('#e2m').options].some(o=>o.value===String(seleccionAnterior.materia))) $('#e2m').value=String(seleccionAnterior.materia);
 // Mostrar el banco vinculado a la evaluación seleccionada, sin impedir practicar si RLS no permite consultarlo.
 const selectorCatalogo=$('#e2catalogo');
 const estadoBanco=document.createElement('p');
 estadoBanco.className='s';
 estadoBanco.setAttribute('aria-live','polite');
 estadoBanco.style.margin='8px 0';
 selectorCatalogo.insertAdjacentElement('afterend',estadoBanco);
 let consultaBancoVersion=0;
 async function revisarBancoE2(){
  const version=++consultaBancoVersion;
  const catalogo=selectorCatalogo.value;
  if(!catalogo){estadoBanco.textContent='Evaluación 2 original: utiliza su banco habitual.';return;}
  estadoBanco.textContent='Comprobando preguntas vinculadas a esta evaluación…';
  try{
   const {count,error}=await sb.from('cia_catalogo_preguntas').select('pregunta_id',{count:'exact',head:true}).eq('catalogo_id',Number(catalogo));
   if(version!==consultaBancoVersion)return;
   if(error){estadoBanco.textContent='No se pudo consultar el número de preguntas. Puedes intentar la práctica.';return;}
   estadoBanco.textContent=count===0?'Esta evaluación todavía no tiene preguntas vinculadas. El docente debe asignarlas.':`${count} pregunta(s) vinculada(s) a esta evaluación. Cada técnica requiere preguntas compatibles.`;
  }catch(_){if(version===consultaBancoVersion)estadoBanco.textContent='No se pudo comprobar el banco. Puedes intentar la práctica.';}
 }
 $('#e2catalogo').onchange=()=>{actualizarEstadoE2();revisarBancoE2();};
 pintarRealizados();$('#e2catalogo').onchange();if(unicas.length===1)$('#e2mw').style.display='none';
 document.querySelectorAll('[data-e2t]').forEach(b=>{b.disabled=false;b.onclick=()=>iniciarE2(b.dataset.e2t);});
}
async function practicaE2(seleccionAnterior){
 draw(`<div class=card><h2>Elige tu ejercicio</h2><p class=s>Toca una tarjeta para empezar. Cada intento trae ocho preguntas. La nota es de práctica; no es una evaluación oficial.</p>${e2PanelHTML()}<p class=err id=m></p><button class=sec id=e2b>Volver al menú</button></div>`);
 $('#e2b').onclick=()=>menu();
 await e2Cablear(seleccionAnterior);
}
async function iniciarE2(tec){
 document.querySelectorAll('[data-e2t]').forEach(b=>b.disabled=true);
 {
  const catalogo=$('#e2catalogo').value;
  const materiaElegida=$('#e2m').value;
  const {data:d,error:er}=catalogo
   ?await sb.rpc('cia14_iniciar_catalogo',{p_cedula:est.cedula,p_materia:$('#e2m').value,p_tecnica:tec,p_catalogo:catalogo})
   :await sb.rpc('cia14_iniciar',{p_cedula:est.cedula,p_materia:$('#e2m').value,p_tecnica:tec});
  if(er){$('#m').textContent=er.message;document.querySelectorAll('[data-e2t]').forEach(b=>b.disabled=false);return;}
  if(!d||!Array.isArray(d.preguntas)||!d.preguntas.length||!d.intento){$('#m').textContent='No hay preguntas disponibles para esta evaluación y técnica.';document.querySelectorAll('[data-e2t]').forEach(b=>b.disabled=false);return;}
  const items=d.preguntas||[],intento=d.intento,tecnicaNombre=E2_TECNICAS[tec];
  draw(`<div class=card><h2>${esc(tecnicaNombre)}</h2><p class=s>Responde las ${items.length} preguntas y pulsa Enviar.</p>${items.map((q,i)=>`<div class=card><b>${i+1}. ${esc(q.enunciado)}</b>${q.opciones.map((o,j)=>`<label style="display:block;margin:8px 0"><input style="width:auto;margin:0 8px 0 0" type=radio name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<p class=err id=m></p><button id=e2env>Enviar respuestas</button></div>`);
  $('#e2env').onclick=async()=>{
   const resp={};
   for(let i=0;i<items.length;i++){const el=document.querySelector(`input[name="q${i}"]:checked`);if(!el)return $('#m').textContent='Responde la pregunta '+(i+1);resp[items[i].id]=items[i].opciones[Number(el.value)]}
   $('#e2env').disabled=true;
   const {data:r,error:ee}=await sb.rpc('cia14_enviar',{p_cedula:est.cedula,p_intento:intento,p_respuestas:resp});
   if(ee){$('#m').textContent=ee.message;$('#e2env').disabled=false;return;}
   const tipoE2=catalogo?'e2:'+catalogo+':'+tec:'e2:'+tec;
   marcarRealizado(tipoE2);
   await registrarRealizadoServidor(tipoE2);
   draw(`<div class=card><h2>Resultado guardado</h2><p>Correctas: <b>${esc(r.aciertos)}</b> de <b>${esc(r.total)}</b></p><h3>Nota de práctica: ${esc(r.nota)} / 5.00</h3><p class=s>Esta calificación no corresponde a una evaluación oficial.</p><button id=e2otra>Hacer otra práctica</button><button class=sec id=e2menu>Volver al menú</button></div>`);
   $('#e2otra').onclick=()=>practicaE2({catalogo,materia:materiaElegida});$('#e2menu').onclick=()=>menu();
  };
 }
}

if(/^#docente/.test(hash0))loginDoc();else if(/^#estudiante/.test(hash0))loginEst();else inicio();
