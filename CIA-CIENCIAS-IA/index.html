<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIA · Ciencias IA</title>
<style>
:root{--ink:#10302f;--hoja:#2e8b57;--papel:#f5f7f2;--sol:#e9a23b;--mal:#b83b2e;--ok:#1f7a4a;--linea:#cfd9cc}
*{box-sizing:border-box}body{margin:0;background:var(--papel);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;line-height:1.2;margin:.2em 0 .5em}
header{background:var(--ink);color:#fff;padding:18px 20px}header h1{margin:0;font-size:1.5rem}header p{margin:0;opacity:.8;font-size:.9rem}
main{max-width:860px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:20px;margin:14px 0}
button,select,input,textarea{font:inherit}button{background:var(--hoja);color:#fff;border:0;border-radius:10px;padding:12px 18px;margin:4px;cursor:pointer;font-weight:600}
button.sec{background:#e4ebe1;color:var(--ink)}button.big{padding:18px 24px;font-size:1.1rem}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
input,select,textarea{width:100%;padding:11px;border:1px solid #9fb09c;border-radius:8px;margin:4px 0 12px;background:#fff}
.op{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--linea)}.op.sel{border-color:var(--hoja);background:#e8f4ec}
.bien{border-left:6px solid var(--ok)}.mal{border-left:6px solid var(--mal)}.bar{height:10px;background:#dde6da;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sol)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid var(--linea);text-align:left}
.tabs button.on{background:var(--ink)}.err{color:var(--mal);font-weight:600}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.s{font-size:.9rem;color:#4a625f}.wrap{overflow-x:auto}.editor-fondo{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px;z-index:1000}.editor-caja{width:min(680px,100%);max-height:94vh;overflow:auto;background:white;border-radius:12px;padding:22px;box-shadow:0 12px 40px #0004}.editor-caja label{display:block;font-weight:600;margin-top:8px}.editor-caja textarea{min-height:80px}.editor-acciones{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.editor-caja .err{min-height:1em}
</style></head><body>
<header><h1>CIA · Ciencias IA</h1><p>C.E.B.G. El Jiral · Ciencias Naturales</p></header><main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// ▼▼ Pega aquí la URL del proyecto y la clave "anon/publishable" (NUNCA la service_role) ▼▼
const CONFIG={url:'https://luewrpzgetqslxqmdcxv.supabase.co',key:'sb_publishable_zJc68aiTxJs7HBgaqeHxrQ_JDcm91xG'};
const sb=createClient(CONFIG.url||'https://sin-configurar.supabase.co',CONFIG.key||'sin-configurar');
const $=s=>document.querySelector(s),app=$('#app'),draw=h=>app.innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
const TIPOS={multiple:'Selección múltiple',verdadero_falso:'Verdadero o falso',completar:'Completar el espacio',relacionar:'Relacionar columnas',ordenar:'Ordenar la secuencia'};
const META=18; // 18 por tipo x 5 tipos = 90 preguntas (mínimo pedido: 80)
let est=null;
const fmt=c=>Array.isArray(c)?(Array.isArray(c[0])?c.map(p=>p.join(' = ')).join('; '):c.join(' → ')):c;

function inicio(){draw(`<div class=card><h2>¿Quién eres?</h2>${CONFIG.url?'':'<p class=err>Falta configurar Supabase en index.html (CONFIG).</p>'}<button class=big id=e>Soy estudiante</button><button class="big sec" id=d>Soy docente</button></div>`);$('#e').onclick=loginEst;$('#d').onclick=loginDoc;}

/* ---------- ESTUDIANTE ---------- */
function loginEst(){draw(`<div class=card><h2>Ingreso de estudiante</h2><label>Nombre<input id=n autocomplete=name></label><label>Cédula<input id=c inputmode=text></label><p class=err id=m></p><button id=go>Entrar</button><button class=sec id=b>Volver</button></div>`);
$('#b').onclick=inicio;
$('#go').onclick=async()=>{const n=$('#n').value.trim(),c=$('#c').value.trim();if(!n||!c)return $('#m').textContent='Escribe tu nombre y tu cédula.';
 const {data,error}=await sb.rpc('cia_ingresar',{p_cedula:c,p_nombre:n});if(error)return $('#m').textContent=error.message;est=data;menu();};}
function menu(){draw(`<div class=card><h2>Hola, ${esc(est.nombres)}</h2><p>Elige un ejercicio. Cada intento trae 8 preguntas distintas.</p>${Object.entries(TIPOS).map(([k,v])=>`<button class=big data-t=${k}>${v}</button>`).join('')}<p class=err id=m></p><button class=sec id=s>Salir</button></div>`);
app.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{const {data,error}=await sb.rpc('cia_iniciar',{p_est:est.id,p_tipo:b.dataset.t});if(error)return $('#m').textContent=error.message;quiz(data);});$('#s').onclick=()=>{est=null;inicio();};}
function quiz(d){let i=0;const R={};
 const paso=()=>{const q=d.preguntas[i],x=q.datos;let cu='';
  if(q.tipo=='multiple'||q.tipo=='completar')cu=x.opciones.map(o=>`<button class=op data-v="${esc(o)}">${esc(o)}</button>`).join('');
  else if(q.tipo=='verdadero_falso')cu=['Verdadero','Falso'].map(o=>`<button class=op data-v="${o}">${o}</button>`).join('');
  else if(q.tipo=='relacionar')cu=x.izq.map(a=>`<label>${esc(a)}<select data-a="${esc(a)}"><option value="">Elige…</option>${x.der.map(b=>`<option>${esc(b)}</option>`).join('')}</select></label>`).join('');
  else{R[q.id]=R[q.id]||[...x.items];cu='<div id=lst></div>';}
  draw(`<div class=card><div class=bar><i style="width:${i/8*100}%"></i></div><p class=s>Pregunta ${i+1} de 8</p><h3>${esc(q.enunciado)}</h3>${cu}<p class=err id=m></p><button id=nx>${i<7?'Siguiente':'Terminar y calificar'}</button></div>`);
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{R[q.id]=b.dataset.v;app.querySelectorAll('.op').forEach(o=>o.classList.toggle('sel',o==b));});
  app.querySelectorAll('select').forEach(s=>s.onchange=()=>{(R[q.id]=R[q.id]||{})[s.dataset.a]=s.value;});
  if(q.tipo=='ordenar'){const L=()=>{$('#lst').innerHTML=R[q.id].map((o,k)=>`<div class=row><span>${k+1}. ${esc(o)}</span><span><button class=sec data-m="${k}:-1" aria-label="Subir">▲</button><button class=sec data-m="${k}:1" aria-label="Bajar">▼</button></span></div>`).join('');
   $('#lst').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const [k,s]=b.dataset.m.split(':').map(Number),a=R[q.id];if(a[k+s]===undefined)return;[a[k],a[k+s]]=[a[k+s],a[k]];L();});};L();}
  $('#nx').onclick=async()=>{const r=R[q.id];
   if(q.tipo=='relacionar'?(!r||x.izq.some(a=>!r[a])):!r)return $('#m').textContent='Responde antes de continuar.';
   if(i<7){i++;return paso();}
   $('#nx').disabled=true;const {data,error}=await sb.rpc('cia_enviar',{p_est:est.id,p_intento:d.intento,p_resp:R});if(error)return $('#m').textContent=error.message;resultado(data);};};
 paso();}
function resultado(r){draw(`<div class=card><h2>Nota: ${r.nota} / ${r.total} (${Math.round(r.nota/r.total*100)}%)</h2><button id=o>Hacer otro ejercicio</button></div>${r.detalle.map((q,k)=>`<div class="card ${q.ok?'bien':'mal'}"><b>${k+1}. ${esc(q.enunciado)}</b><p>${q.ok?'Correcta':'Incorrecta'}. Respuesta: <b>${esc(fmt(q.correcta))}</b></p><p class=s>${esc(q.explicacion)}</p></div>`).join('')}`);$('#o').onclick=menu;}

/* ---------- DOCENTE ---------- */
async function loginDoc(){const {data:{session}}=await sb.auth.getSession();if(session)return panel();
 draw(`<div class=card><h2>Ingreso docente</h2><label>Correo<input id=em type=email></label><label>Contraseña<input id=pw type=password></label><p class=err id=m></p><button id=go>Entrar</button><button class=sec id=b>Volver</button></div>`);$('#b').onclick=inicio;
 $('#go').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return $('#m').textContent=error.message;panel();};}
async function panel(){
 const {data:ud,error:ue}=await sb.auth.getUser();
 const user=ud?.user;
 if(ue||!user){draw(`<div class=card><p class=err>No se pudo verificar la sesión: ${esc(ue?.message||'sesión no disponible')}.</p><button id=x>Volver</button></div>`);$('#x').onclick=loginDoc;return;}
 const {data:dc,error:de}=await sb.from('cia_docentes').select('id').eq('id',user.id).maybeSingle();
 if(de||!dc){
  const detalle=de?`Error de consulta (${esc(de.code||'sin código')}): ${esc(de.message)}. ${esc(de.details||'')}`:'La consulta no devolvió el registro. Compruebe que la sesión pertenezca al mismo proyecto Supabase que contiene el docente.';
  draw(`<div class=card><h2>No se pudo verificar el acceso docente</h2><p class=err>${detalle}</p><p class=s>Cuenta: ${esc(user.email||'sin correo')} · ID: ${esc(user.id)}</p><button id=x class=sec>Salir</button></div>`);
  $('#x').onclick=async()=>{await sb.auth.signOut();inicio();};return;
 }
 draw(`<div class="card tabs"><button data-p=banco>Banco de preguntas</button><button data-p=est>Estudiantes</button><button data-p=res>Resultados</button><button class=sec id=x>Salir</button></div><div id=v></div>`);
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-p]').forEach(o=>o.classList.toggle('on',o==b));({banco:tBanco,est:tEst,res:tRes})[b.dataset.p](user.id);});
 $('#x').onclick=async()=>{await sb.auth.signOut();inicio();};app.querySelector('[data-p=banco]').click();}

let texto='';
const avisoError=(e)=>`<p class="err">Error de Supabase: ${esc(e.message)} (${esc(e.code||'')})</p>`;
async function tBanco(uid){
 const {data:pr,error}=await sb.from('cia_preguntas').select('id,enunciado,tema,nivel,creado_en').eq('docente_id',uid).order('creado_en',{ascending:false});
 if(error){$('#v').innerHTML=`<div class=card>${avisoError(error)}</div>`;return;}
 $('#v').innerHTML=`<div class=card><h2>Banco de preguntas: ${pr.length}</h2><p class=s>Suba un PDF con texto y genere preguntas mediante Gemini (plan gratuito sujeto a límites).</p><label>PDF de la clase<input id=pdf type=file accept="application/pdf"></label><p id=fu class=s></p><label>Nombre del banco<input id=bn placeholder="Ej. La célula, 9.º grado"></label><label>Cantidad<select id=cant><option selected>20</option><option>40</option><option>60</option><option>80</option></select></label><button id=gen disabled>Generar preguntas con IA</button><p class=s id=st role=status>Primero seleccione un PDF. Revise las preguntas antes de guardarlas.</p><div id=prev></div></div><div class=card>${pr.map(p=>`<div class=row><span><b>${esc(p.tema||'Sin tema')}</b> · ${esc(p.nivel||'Sin nivel')}<p>${esc(p.enunciado)}</p></span><button class=sec data-e="${p.id}">Editar</button></div><hr>`).join('')||'<p>Aún no hay preguntas.</p>'}</div>`;
 $('#pdf').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024)throw Error('El PDF supera 10 MB');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let t=[];for(let i=1;i<=doc.numPages;i++){const c=await(await doc.getPage(i)).getTextContent();t.push(c.items.map(x=>x.str).join(' '));}texto=t.join('\n').slice(0,45000);if(texto.trim().length<150)throw Error('No se detectó texto suficiente. Para PDF escaneado se requiere OCR.');$('#fu').textContent=`PDF leído: ${doc.numPages} páginas, ${texto.length} caracteres.`;$('#gen').disabled=false;}catch(err){$('#fu').textContent=err.message;$('#gen').disabled=true;}};
 $('#gen').onclick=async()=>{const st=$('#st'),gen=$('#gen');gen.disabled=true;st.textContent='Generando preguntas. Puede tardar varios minutos...';try{const {data,error}=await sb.functions.invoke('cia-generar',{body:{texto,tema:$('#bn').value.trim()||'Ciencias Naturales',grado:'9',cantidad:Number($('#cant').value)}});if(error){let detalle=data?.error||error.message;try{if(error.context){const j=await error.context.json();detalle=j.error||detalle;}}catch{}throw Error(detalle);}if(data?.error)throw Error(data.error);const qs=(data.preguntas||[]).map(q=>({enunciado:String(q.enunciado||q.pregunta||'').trim(),correcta:String(q.correcta||q.respuesta||'').trim(),distractores:Array.isArray(q.distractores)?q.distractores:(Array.isArray(q.opciones)?q.opciones.filter(o=>o!==q.respuesta).slice(0,3):[]),explicacion:q.explicacion||'',tema:q.tema||$('#bn').value.trim()||'Ciencias Naturales',nivel:({facil:'facil',medio:'medio',dificil:'dificil'})[q.nivel||q.dificultad]||'medio',tipo:q.tipo||'multiple'})).filter(q=>q.enunciado&&q.correcta);if(!qs.length)throw Error('La IA no devolvió preguntas');st.textContent=`${qs.length} preguntas generadas. Revise, edite o descarte antes de guardar. No se han guardado todavía.`;$('#prev').innerHTML=qs.map((q,i)=>`<div class=card><label><input type=checkbox data-keep="${i}" checked> Guardar pregunta ${i+1}</label><textarea data-q="${i}" rows=3 style="width:100%;font:inherit;padding:10px">${esc(q.enunciado)}</textarea><p class=s>Respuesta: ${esc(q.correcta)} · ${esc(q.nivel)}</p><p class=s>${esc(q.explicacion)}</p></div>`).join('')+'<button id=save>Guardar preguntas seleccionadas</button>';
 $('#save').onclick=async()=>{const nombre=$('#bn').value.trim()||'Banco generado desde PDF';const selected=qs.map((q,i)=>({...q,enunciado:app.querySelector(`[data-q="${i}"]`).value.trim(),keep:app.querySelector(`[data-keep="${i}"]`).checked})).filter(q=>q.keep&&q.enunciado);if(!selected.length)return st.textContent='Seleccione al menos una pregunta.';$('#save').disabled=true;try{const {data:b,error:be}=await sb.from('cia_bancos').insert({docente_id:uid,nombre,fuente:'PDF / Gemini'}).select('id').single();if(be)throw be;const filas=selected.map(q=>({docente_id:uid,banco_id:b.id,enunciado:q.enunciado,correcta:q.correcta,explicacion:q.explicacion,distractores:q.distractores||[],tema:q.tema||nombre,nivel:q.nivel||'medio',metadatos:{origen:'gemini_pdf',tipo:q.tipo||'multiple'}}));const {error:pe}=await sb.from('cia_preguntas').insert(filas);if(pe)throw pe;await tBanco(uid);}catch(e){st.textContent='No se pudo guardar: '+e.message;$('#save').disabled=false;}};
 }catch(e){st.textContent='Error de generación: '+e.message;gen.disabled=false;}};
 app.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{
  const id=b.dataset.e;
  const {data:p,error:consultaError}=await sb.from('cia_preguntas')
    .select('id,enunciado,correcta,explicacion,distractores,tema,nivel,metadatos')
    .eq('id',id).eq('docente_id',uid).single();
  if(consultaError){alert('No se pudo abrir la pregunta: '+consultaError.message);return;}
  const fondo=document.createElement('div');fondo.className='editor-fondo';
  fondo.innerHTML=`<section class="editor-caja" role="dialog" aria-modal="true" aria-labelledby="editor-titulo">
    <h2 id="editor-titulo">Editar pregunta</h2>
    <p class="s">Cambie los datos y pulse Guardar. Las modificaciones se guardan en Supabase.</p>
    <label for="ed-enunciado">Enunciado</label><textarea id="ed-enunciado" rows="3" required>${esc(p.enunciado)}</textarea>
    <label for="ed-correcta">Respuesta correcta</label><textarea id="ed-correcta" rows="2" required>${esc(typeof p.correcta==='string'?p.correcta:JSON.stringify(p.correcta??''))}</textarea>
    <label for="ed-distractores">Opciones incorrectas (una por línea)</label><textarea id="ed-distractores" rows="4">${esc(Array.isArray(p.distractores)?p.distractores.map(x=>typeof x==='string'?x:JSON.stringify(x)).join('\n'):'')}</textarea>
    <label for="ed-explicacion">Explicación</label><textarea id="ed-explicacion" rows="3">${esc(p.explicacion||'')}</textarea>
    <label for="ed-tema">Tema</label><input id="ed-tema" value="${esc(p.tema||'')}">
    <label for="ed-nivel">Dificultad</label><select id="ed-nivel"><option value="facil">Fácil</option><option value="medio">Medio</option><option value="dificil">Difícil</option></select>
    <p id="ed-error" class="err" role="alert"></p>
    <div class="editor-acciones"><button class="sec" id="ed-cancelar">Cancelar</button><button id="ed-guardar">Guardar cambios</button></div>
  </section>`;
  document.body.appendChild(fondo);
  const get=x=>fondo.querySelector(x);
  get('#ed-nivel').value=['facil','medio','dificil'].includes(p.nivel)?p.nivel:'medio';
  const cerrar=()=>fondo.remove();
  get('#ed-cancelar').onclick=cerrar;
  fondo.addEventListener('click',e=>{if(e.target===fondo)cerrar();});
  get('#ed-enunciado').focus();
  get('#ed-guardar').onclick=async()=>{
    const enunciado=get('#ed-enunciado').value.trim();
    const correcta=get('#ed-correcta').value.trim();
    const distractores=get('#ed-distractores').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const explicacion=get('#ed-explicacion').value.trim();
    const tema=get('#ed-tema').value.trim();
    if(!enunciado||!correcta){get('#ed-error').textContent='El enunciado y la respuesta correcta son obligatorios.';return;}
    if(distractores.some(x=>x.toLowerCase()===correcta.toLowerCase())){get('#ed-error').textContent='La respuesta correcta no debe repetirse entre las incorrectas.';return;}
    const guardar=get('#ed-guardar');guardar.disabled=true;
    get('#ed-error').textContent='Guardando...';
    const {data:actualizada,error}=await sb.from('cia_preguntas').update({enunciado,correcta,distractores,explicacion,tema,nivel:get('#ed-nivel').value})
      .eq('id',p.id).eq('docente_id',uid).select('id');
    if(error||!actualizada?.length){get('#ed-error').textContent='No se pudo guardar: '+(error?.message||'Sin permiso para modificar esta pregunta.');guardar.disabled=false;return;}
    cerrar();await tBanco(uid);
  };
});
}
async function tEst(uid){
 const {data:L,error}=await sb.from('cia_estudiantes').select('id,nombres,cedula,grado,seccion,creado_en').eq('docente_id',uid).order('nombres');
 if(error){$('#v').innerHTML=`<div class=card>${avisoError(error)}</div>`;return;}
 $('#v').innerHTML=`<div class=card><h2>Estudiantes: ${L.length}</h2><p class=s>Importar Excel/CSV con nombres, cedula, grado, seccion. Las filas existentes con la misma cédula se actualizarán.</p><input id=f type=file accept=".xlsx,.xls,.csv"><p id=st class=s role=status></p></div><div class="card wrap"><table><tr><th>Nombre</th><th>Cédula</th><th>Grado</th><th>Creado</th></tr>${L.map(s=>`<tr><td>${esc(s.nombres)}</td><td>${esc(s.cedula)}</td><td>${esc((s.grado||'')+' '+(s.seccion||''))}</td><td>${esc(s.creado_en?.slice(0,10)||'')}</td></tr>`).join('')}</table></div>`;
 $('#f').onchange=async e=>{const st=$('#st');try{const wb=XLSX.read(await e.target.files[0].arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});const g=(r,k)=>{const key=Object.keys(r).find(x=>norm(x)===k);return key?String(r[key]).trim():'';};const filas=rows.map(r=>({docente_id:uid,nombres:g(r,'nombres')||g(r,'nombre'),cedula:g(r,'cedula'),grado:g(r,'grado'),seccion:g(r,'seccion')})).filter(f=>f.nombres&&f.cedula);if(!filas.length){st.textContent='No hay nombres y cédulas válidos.';return;}
 const ids=new Map(L.filter(x=>x.cedula).map(x=>[x.cedula,x.id]));let ok=0;for(const f of filas){const id=ids.get(f.cedula);const q=id?sb.from('cia_estudiantes').update(f).eq('id',id).eq('docente_id',uid):sb.from('cia_estudiantes').insert(f);const {error}=await q;if(error)throw Error(`Fila ${ok+1}: ${error.message}`);ok++;}await tEst(uid);$('#st').textContent=`${ok} filas procesadas.`;}catch(err){st.textContent='Error: '+err.message;}};
}
async function tRes(uid){
 const {data:R,error}=await sb.from('cia_intentos').select('id,estudiante_id,ejercicio_id,nota,creado_en,revision_pendiente').eq('docente_id',uid).order('creado_en',{ascending:false});
 if(error){$('#v').innerHTML=`<div class=card>${avisoError(error)}</div>`;return;}
 const [er,ex]=await Promise.all([sb.from('cia_estudiantes').select('id,nombres,cedula').eq('docente_id',uid),sb.from('cia_ejercicios').select('id,titulo,max_nota').eq('docente_id',uid)]);
 if(er.error||ex.error){$('#v').innerHTML=`<div class=card>${avisoError(er.error||ex.error)}</div>`;return;}
 const alumnos=new Map(er.data.map(x=>[x.id,x])),ejercicios=new Map(ex.data.map(x=>[x.id,x]));
 const f=R.map(r=>{const a=alumnos.get(r.estudiante_id)||{},e=ejercicios.get(r.ejercicio_id)||{};return[a.nombres||'Sin estudiante',a.cedula||'',e.titulo||'Sin ejercicio',`${r.nota??'—'} / ${e.max_nota??'—'}`,r.creado_en?new Date(r.creado_en).toLocaleString('es-PA'):'',r.revision_pendiente?'Pendiente':'—'];});
 $('#v').innerHTML=`<div class=card><h2>Resultados: ${f.length}</h2><button id=ex ${f.length?'':'disabled'}>Exportar CSV</button></div><div class="card wrap"><table><tr><th>Nombre</th><th>Cédula</th><th>Ejercicio</th><th>Nota</th><th>Fecha</th><th>Revisión</th></tr>${f.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')}</table></div>`;
 $('#ex').onclick=()=>{const csv='\ufeffnombre,cedula,ejercicio,nota,fecha,revision\n'+f.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=url;a.download='resultados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
}

inicio();
</script></body></html>
