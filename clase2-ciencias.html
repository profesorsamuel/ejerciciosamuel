<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clase 2 - Ciencias Naturales</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(160deg,#0b2c5f,#1769e0);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  color:#17233a;
}
.card{
  width:min(480px,100%);
  background:#fff;
  border-radius:26px;
  padding:30px 20px;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
  text-align:center;
}
.school{
  font-weight:900;
  color:#1769e0;
  font-size:18px;
  margin-bottom:10px;
}
.icon{font-size:52px;margin:5px 0 8px}
h1{font-size:29px;line-height:1.12;margin:8px 0;color:#102a56}
.subtitle{color:#607089;font-size:16px;margin:0 0 28px}
.level{
  display:block;
  text-decoration:none;
  border-radius:18px;
  padding:21px 15px;
  margin:14px 0;
  font-size:25px;
  font-weight:900;
  transition:.15s;
}
.level:active{transform:scale(.98)}
.nine{background:#1769e0;color:#fff}
.eight{background:#eaf3ff;color:#124f9d;border:2px solid #1769e0}
.level small{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-top:6px;
  opacity:.9;
}
.note{font-size:12px;color:#718096;margin-top:22px}
</style>
</head>
<body>
<main class="card">
  <div class="school">C.E.B.G. EL JIRAL</div>
  <div class="icon">🔬</div>
  <h1>Clase 2<br>Ciencias Naturales</h1>
  <p class="subtitle">Selecciona tu nivel para comenzar</p>

  <a class="level nine" href="https://profesorsamuel.github.io/ejerciciosamuel/clase2-noveno.html">
    NIVEL 9.º
    <small>Entrar a la práctica de noveno</small>
  </a>

  <a class="level eight" href="https://profesorsamuel.github.io/ejerciciosamuel/clase2-octavo.html">
    NIVEL 8.º
    <small>Entrar a la práctica de octavo</small>
  </a>

  <p class="note">Ciencias Naturales · Clase 2</p>
</main>
</body>
</html>
