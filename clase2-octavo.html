function startExercise(i){if(!selected.length)return alert('Seleccione estudiante(s).');currentEx=i;qi=correct=wrong=unanswered=0;attemptId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());startedAt=new Date().toISOString();questions=buildQuestions(EXERCISES[i][1]);$('setup').classList.add('hidden');$('exSection').classList.add('hidden');$('play').classList.remove('hidden');$('who').textContent=selected.join(', ')+' · 8A';$('exTitle').textContent=(i+1)+'. '+EXERCISES[i][0];renderQuestion()}
