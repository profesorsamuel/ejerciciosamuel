else if(type==='match') out=shuffle(PAIRS).slice(0,10).map(x=>({kind:'match',q:'Relaciona: '+x[0],ok:x[1],opts:shuffle([x[1],...shuffle(PAIRS.filter(p=>p[1]!==x[1])).slice(0,3).map(p=>p[1])]),time:45}));
else if(type==='order'){let seq=['Precámbrico','Paleozoico','Mesozoico','Cenozoico'];out=Array.from({length:10},(_,k)=>({kind:'order',q:'Ordena de más antiguo a más reciente estas etapas:',items:shuffle(seq),ok:seq,time:60}))}
else if(type==='classify'){let items=[['Voyager 1 y 2','No tripulada'],['Mars Rovers','No tripulada'],['Cassini-Huygens','No tripulada'],['New Horizons','No tripulada'],['Soyuz','Tripulada'],['Crew Dragon','Tripulada'],['EEI','Tripulada']];out=shuffle(items).concat(shuffle(items)).slice(0,12).map(x=>({kind:'classify',q:'Clasifica: '+x[0],ok:x[1],time:25}))}
else if(type==='intruder'){let sets=[[['Voyager','Cassini','New Horizons','Soyuz'],'Soyuz'],[['Eón','Era','Periodo','Telescopio'],'Telescopio'],[['Dinosaurios','Pterosaurios','Ictiosaurios','Primates'],'Primates'],[['Cráteres lunares','Fases de Venus','Lunas de Júpiter','Pangea'],'Pangea']];out=Array.from({length:12},(_,k)=>{let s=sets[k%sets.length];return{kind:'intruder',q:'¿Cuál es el intruso?',opts:shuffle(s[0]),ok:s[1],time:30}})}
else if(type==='riddle'||type==='clues') out=shuffle(PAIRS).slice(0,n).map(x=>({kind:'fill',q:'Adivina el concepto: '+x[1],ok:x[0],time:40}));
else if(type==='cross') out=shuffle(PAIRS).slice(0,10).map(x=>({kind:'fill',q:'Crucigrama · '+x[1],ok:x[0],time:60}));
else if(type==='wordsearch') out=shuffle(PAIRS).slice(0,10).map(x=>({kind:'word',q:'Encuentra/identifica el término: '+x[1],ok:x[0],time:45}));
else if(type==='draw') out=shuffle(PAIRS).slice(0,10).map(x=>({kind:'draw',q:'Dibuja un esquema sencillo relacionado con: '+x[0]+' — '+x[1],ok:'manual',time:180}));
return out}
function renderQuestion(){if(qi>=questions.length)return finish();answer=null;$('feedback').classList.add('hidden');let q=questions[qi];$('qcount').textContent='Pregunta '+(qi+1)+' de '+questions.length;$('progress').style.width=(qi/questions.length*100)+'%';let h=`<div class="question">${q.q}</div>`;
if(q.kind==='mc')h+='<div class="opts">'+q.opts.map((o,i)=>`<button class="opt" onclick="pick(this,${o.ok})">${o.v}</button>`).join('')+'</div>';
else if(q.kind==='tf')h+='<div class="row"><button class="opt" onclick="pick(this,'+(q.ok===true)+')">CIERTO</button><button class="opt" onclick="pick(this,'+(q.ok===false)+')">FALSO</button></div>';
else if(q.kind==='fill')h+='<input id="textAnswer" type="text" placeholder="Escribe tu respuesta" oninput="answer=this.value">';
else if(q.kind==='match')h+='<div class="opts">'+q.opts.map(o=>`<button class="opt" onclick="pick(this,${JSON.stringify(o===q.ok)})">${o}</button>`).join('')+'</div>';
else if(q.kind==='classify')h+='<div class="row"><button class="opt" onclick="pick(this,'+(q.ok==='Tripulada')+')">Tripulada</button><button class="opt" onclick="pick(this,'+(q.ok==='No tripulada')+')">No tripulada</button></div>';
else if(q.kind==='intruder')h+='<div class="opts">'+q.opts.map(o=>`<button class="opt" onclick="pick(this,${JSON.stringify(o===q.ok)})">${o}</button>`).join('')+'</div>';
else if(q.kind==='order')h+='<div id="orderBox">'+q.items.map((o,i)=>`<div class="chip" data-v="${o}">${o} <button onclick="moveUp(this)">↑</button></div>`).join('')+'</div><p class="small">Use ↑ para ordenar de más antiguo a más reciente.</p>';
else if(q.kind==='word')h+=wordSearch(q.ok);
else if(q.kind==='draw')h+='<canvas id="drawCanvas" width="600" height="500"></canvas><div class="row"><button class="secondary" onclick="clearCanvas()">🗑 Borrar</button><button class="secondary" onclick="answer=&quot;manual&quot;">✓ Listo</button></div>';
$('task').innerHTML=h;if(q.kind==='draw')initCanvas();startTimer(q.time)}
function pick(el,ok){document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');answer=ok}
function moveUp(btn){let d=btn.parentElement;if(d.previousElementSibling)d.parentElement.insertBefore(d,d.previousElementSibling);answer='ordered'}
function normalize(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function submitCurrent(timeout=false){clearInterval(timerId);let q=questions[qi],ok=false;if(timeout){unanswered++;beep(220,.15)}else if(q.kind==='fill'||q.kind==='word'){ok=normalize(answer)===normalize(q.ok)}else if(q.kind==='order'){let arr=[...document.querySelectorAll('#orderBox .chip')].map(x=>x.dataset.v);ok=JSON.stringify(arr)===JSON.stringify(q.ok)}else if(q.kind==='draw'){ok=true}else ok=answer===true;
if(!timeout){if(ok){correct++;beep(900,.08)}else{wrong++;beep(260,.1)}}qi++;setTimeout(renderQuestion,500)}
function startTimer(sec){clearInterval(timerId);deadline=Date.now()+sec*1000;tick();timerId=setInterval(tick,250)}
function tick(){let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=5&&s>0&&Math.ceil((deadline-Date.now())/1000)===s)beep(500,.03);if(s<=0)submitCurrent(true)}
function grade(){let auto=questions.filter(q=>q.kind!=='draw').length, c=Math.min(correct,auto);return Math.round((1+(auto?c/auto:0)*4)*100)/100}
async function finish(){clearInterval(timerId);$('play').classList.add('hidden');let g=grade();$('bigGrade').textContent=g.toFixed(2);$('resultMsg').textContent=g>=4.6?'🎉 ¡Excelente trabajo!':g>=4?'🌟 ¡Muy buen trabajo!':g>=3?'👍 Buen esfuerzo':'📚 Sigue practicando';$('resultDetail').textContent=`${correct} correctas · ${wrong} incorrectas · ${unanswered} sin responder`;$('resultModal').classList.remove('hidden');beep(1000,.2);await saveAttempt(g)}
function fechaPanama(){let p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Panama',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}`}
async function getStudentMap(){
  if(!supa) throw Error('Sin conexión a Supabase');
  let salon=$('salon').value;
  let {data,error}=await supa.from('practica_estudiantes').select('id,nombre,salon').eq('salon',salon).in('nombre',selected);
  if(error) throw error;
  let map={}; (data||[]).forEach(x=>map[x.nombre]=x.id);
  return map;
}
async function saveAttempt(g){
  let st=$('saveStatus'); st.textContent='☁️ Guardando en Internet…';
  let salon=$('salon').value, fecha=fechaPanama(), fin=new Date().toISOString();
  try{
    if(!supa) throw Error('Sin conexión a Supabase');
    let ids=await getStudentMap();
    let missing=selected.filter(n=>!ids[n]);
    if(missing.length) throw Error('No encontré en practica_estudiantes: '+missing.join(', '));
    let groupId=mode==='Grupo' ? attemptId : null;
    let rows=selected.map(n=>({
      attempt_id:attemptId+'-'+normalize(n).replace(/[^a-z0-9]/g,'').slice(0,18),
      estudiante_id:ids[n], salon:salon, estudiante_nombre:n, clase:2,
      ejercicio:currentEx+1, ejercicio_nombre:EXERCISES[currentEx][0],
      modalidad:mode==='Grupo'?'grupo':'individual', group_attempt_id:groupId,
      fecha_panama:fecha, hora_inicio:startedAt, hora_final:fin,
      correctas:correct, incorrectas:wrong, sin_responder:unanswered,
      total_preguntas:questions.length,
      porcentaje:Math.round((correct/Math.max(1,questions.length))*10000)/100,
      nota:g, duracion_segundos:Math.max(0,Math.round((new Date(fin)-new Date(startedAt))/1000)),
      estado:'terminado'
    }));
    let r=await supa.from('practica_intentos').upsert(rows,{onConflict:'attempt_id'});
    if(r.error) throw r.error;
    st.textContent='✅ Nota guardada en Internet para '+selected.length+' estudiante(s).';
    localStorage.removeItem('clase2_pending_'+attemptId);
  }catch(e){
    let backup={attemptId,selected:[...selected],salon,fecha,startedAt,fin,g,currentEx,correct,wrong,unanswered,total:questions.length,mode};
    localStorage.setItem('clase2_pending_'+attemptId,JSON.stringify(backup));
    st.textContent='⚠️ No se pudo sincronizar ahora. Quedó pendiente en este celular y se intentará nuevamente al volver Internet. '+(e.message||'');
  }
}
function closeResult(){$('resultModal').classList.add('hidden');$('setup').classList.remove('hidden');$('exSection').classList.remove('hidden');syncPending()}
async function syncPending(){
 if(!supa||!navigator.onLine)return;
 for(let i=localStorage.length-1;i>=0;i--){
  let k=localStorage.key(i); if(!k||!k.startsWith('clase2_pending_'))continue;
  try{
   let b=JSON.parse(localStorage.getItem(k));
   if(Array.isArray(b)) { localStorage.removeItem(k); continue; }
   let {data,error}=await supa.from('practica_estudiantes').select('id,nombre').eq('salon',b.salon).in('nombre',b.selected);
   if(error)throw error; let ids={};(data||[]).forEach(x=>ids[x.nombre]=x.id);
   if(b.selected.some(n=>!ids[n]))continue;
   let rows=b.selected.map(n=>({attempt_id:b.attemptId+'-'+normalize(n).replace(/[^a-z0-9]/g,'').slice(0,18),estudiante_id:ids[n],salon:b.salon,estudiante_nombre:n,clase:2,ejercicio:b.currentEx+1,ejercicio_nombre:EXERCISES[b.currentEx][0],modalidad:b.mode==='Grupo'?'grupo':'individual',group_attempt_id:b.mode==='Grupo'?b.attemptId:null,fecha_panama:b.fecha,hora_inicio:b.startedAt,hora_final:b.fin,correctas:b.correct,incorrectas:b.wrong,sin_responder:b.unanswered,total_preguntas:b.total,porcentaje:Math.round((b.correct/Math.max(1,b.total))*10000)/100,nota:b.g,duracion_segundos:Math.max(0,Math.round((new Date(b.fin)-new Date(b.startedAt))/1000)),estado:'terminado'}));
   let r=await supa.from('practica_intentos').upsert(rows,{onConflict:'attempt_id'}); if(!r.error)localStorage.removeItem(k);
  }catch(e){}
 }
}
window.addEventListener('online',syncPending);
function showGrades(){$('grades').classList.remove('hidden');let all=[...SALONES['9A'],...SALONES['9B'],...SALONES['9C']];$('gradeStudent').innerHTML='<option value="">Todos los estudiantes</option>'+all.map(n=>`<option>${n}</option>`).join('');loadGrades()}
function hideGrades(){$('grades').classList.add('hidden')}
async function loadGrades(){
 let b=$('gradeBody'),st=$('gradeStatus');b.innerHTML='';st.textContent='Cargando desde Internet…';
 if(!supa){st.textContent='Sin conexión a Supabase';return}
 try{
  let q=supa.from('practica_intentos').select('fecha_panama,estudiante_nombre,salon,ejercicio,nota,created_at').eq('clase',2).eq('estado','terminado').order('created_at',{ascending:false}).limit(500);
  if($('gradeSalon').value)q=q.eq('salon',$('gradeSalon').value);
  if($('gradeStudent').value)q=q.eq('estudiante_nombre',$('gradeStudent').value);
  let {data,error}=await q;if(error)throw error;
  let counts={};
  (data||[]).slice().reverse().forEach(r=>{let k=r.estudiante_nombre+'|'+r.ejercicio+'|'+r.fecha_panama;counts[k]=(counts[k]||0)+1;r._n=counts[k]});
  b.innerHTML=(data||[]).map(r=>`<tr><td>${r.fecha_panama||''}</td><td>${r.estudiante_nombre}</td><td>${r.salon}</td><td>${r.ejercicio}</td><td>${r._n||1}</td><td><b>${Number(r.nota).toFixed(2)}</b></td></tr>`).join('');
  st.textContent=(data||[]).length+' intentos mostrados. Datos cargados desde Supabase.';
 }catch(e){st.textContent='⚠️ No se pudieron cargar las notas: '+(e.message||'error de conexión')}
}
function speakQuestion(){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(questions[qi]?.q||''))}}
function wordSearch(word){let clean=normalize(word).replace(/[^a-z]/g,'').toUpperCase().slice(0,10),letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ',arr=Array.from({length:100},()=>letters[Math.floor(Math.random()*26)]);for(let i=0;i<clean.length;i++)arr[i]=clean[i];return '<div class="wordgrid">'+arr.map(x=>`<button class="letter">${x}</button>`).join('')+'</div><p class="small">La palabra está oculta horizontalmente. Escríbela:</p><input type="text" oninput="answer=this.value" placeholder="Respuesta">'}
let ctx,drawing=false;function initCanvas(){let c=$('drawCanvas');ctx=c.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';let pos=e=>{let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{drawing=true;let p=pos(e);ctx.beginPath();ctx.moveTo(...p)};c.onpointermove=e=>{if(!drawing)return;let p=pos(e);ctx.lineTo(...p);ctx.stroke();answer='manual'};c.onpointerup=()=>drawing=false}function clearCanvas(){if(ctx)ctx.clearRect(0,0,600,500)}
setTimeout(function(){renderStudents();syncPending();},0);
</script></body></html>
