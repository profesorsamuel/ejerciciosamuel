<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego educativo CIA</title><style>body{font:17px system-ui;background:#f0f6f3;color:#183e32;margin:0;padding:18px}main{max-width:750px;margin:auto;background:white;padding:24px;border-radius:15px}button{padding:12px;border:0;border-radius:8px;background:#12694f;color:white;cursor:pointer;margin:6px}button.option{display:block;width:100%;text-align:left;background:#e6f1ec;color:#123}button:disabled{opacity:.55}#status{font-weight:bold}small{color:#555}</style></head><body><main><h1>🎮 Ciencias IA · Juego educativo</h1><p id="status">Cargando preguntas…</p><section id="game"></section></main><script>
const url='https://luewrpzgetqslxqmdcxv.supabase.co',key='sb_publishable_zJc68aiTxJs7HBgaqeHxrQ_JDcm91xG';const id=new URLSearchParams(location.search).get('id');const LIMIT=15;let qs=[],i=0,correct=0;const st=document.getElementById('status'),g=document.getElementById('game');const clean=v=>String(v??'').trim().toLowerCase();
function shuffle(items){const a=items.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function optionData(o,index){const raw=typeof o==='string'?o:(o.texto??o.label??o.valor??'');const match=String(raw).match(/^\s*([A-D])[.)]\s*(.*)$/i);return {label:match?match[2]:String(raw),key:match?match[1].toUpperCase():String.fromCharCode(65+index),value:typeof o==='object'?(o.valor??o.value??raw):raw}}
function isCorrect(q,o){const ans=clean(q.respuesta);return ans===clean(o.key)||ans===clean(o.value)||ans===clean(o.label)}
function render(){g.replaceChildren();if(i>=qs.length){st.textContent='Juego terminado · '+correct+' de '+qs.length+' respuestas correctas';const p=document.createElement('p');p.textContent='Calificación orientativa: '+(1+4*correct/qs.length).toFixed(2)+' / 5.0. Este juego no guarda todavía notas por cédula.';g.append(p);const b=document.createElement('button');b.textContent='Jugar otra partida aleatoria';b.onclick=()=>location.reload();g.append(b);return}const q=qs[i];st.textContent='Pregunta '+(i+1)+' de '+qs.length+' · Aciertos: '+correct;const h=document.createElement('h2');h.textContent=q.enunciado;g.append(h);if(!['seleccion_multiple','verdadero_falso'].includes(q.tipo)){const p=document.createElement('p');p.textContent='Esta técnica necesita un motor de juego específico.';g.append(p);return}const source=q.opciones?.length?q.opciones:['Verdadero','Falso'];const opts=shuffle(source.map(optionData));for(const o of opts){const b=document.createElement('button');b.className='option';b.textContent=o.label;b.onclick=()=>{const right=isCorrect(q,o);if(right)correct++;g.querySelectorAll('button.option').forEach(x=>x.disabled=true);const p=document.createElement('p');p.textContent=(right?'✅ Correcto. ':'❌ Incorrecto. ')+(q.explicacion||'');g.append(p);const next=document.createElement('button');next.textContent=i===qs.length-1?'Ver resultado':'Siguiente';next.onclick=()=>{i++;render()};g.append(next)};g.append(b)}}
(async()=>{try{if(!id||!/^[0-9a-f-]{36}$/i.test(id))throw Error('Enlace inválido');const r=await fetch(url+'/rest/v1/cia_bancos_compartidos?id=eq.'+encodeURIComponent(id)+'&select=contenido',{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)throw Error('No se pudo consultar el banco ('+r.status+')');const rows=await r.json();if(!rows.length)throw Error('Banco no encontrado');const content=rows[0].contenido;const all=Array.isArray(content?.preguntas)?content.preguntas:[];if(!all.length)throw Error('Banco vacío');const supported=all.filter(q=>['seleccion_multiple','verdadero_falso'].includes(q.tipo));if(!supported.length)throw Error('Este banco todavía no tiene preguntas compatibles con el motor de juego.');qs=shuffle(supported).slice(0,LIMIT);render()}catch(e){st.textContent=e.message}})();
</script></body></html>
