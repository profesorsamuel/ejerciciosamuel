<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego educativo CIA</title><style>body{font:17px system-ui;background:#f0f6f3;color:#183e32;margin:0;padding:18px}main{max-width:750px;margin:auto;background:white;padding:24px;border-radius:15px}button{padding:12px;border:0;border-radius:8px;background:#12694f;color:white;cursor:pointer;margin:6px}button.option{display:block;width:100%;text-align:left;background:#e6f1ec;color:#123}button:disabled{opacity:.55}#status{font-weight:bold}small{color:#555}</style><main><h1>🎮 Ciencias IA · Juego educativo</h1><p id="status">Cargando preguntas…</p><section id="game"></section></main><script>
const url='https://luewrpzgetqslxqmdcxv.supabase.co',key='sb_publishable_zJc68aiTxJs7HBgaqeHxrQ_JDcm91xG';const id=new URLSearchParams(location.search).get('id');let qs=[],i=0,correct=0;const st=document.getElementById('status'),g=document.getElementById('game');const clean=v=>String(v??'').trim().toLowerCase();
function render(){g.replaceChildren();if(i>=qs.length){st.textContent='Juego terminado · '+correct+' de '+qs.length+' respuestas correctas';return}const q=qs[i];st.textContent='Pregunta '+(i+1)+' de '+qs.length+' · Aciertos: '+correct;const h=document.createElement('h2');h.textContent=q.enunciado;g.append(h);if(q.tipo!=='seleccion_multiple'&&q.tipo!=='verdadero_falso'){const p=document.createElement('p');p.textContent='Esta técnica requiere un motor de juego específico. Se muestra como ficha de estudio.';g.append(p);const a=document.createElement('p');a.textContent='Respuesta: '+JSON.stringify(q.respuesta);g.append(a);next();return}const opts=q.opciones?.length?q.opciones:['Verdadero','Falso'];for(const o of opts){const b=document.createElement('button');b.className='option';const label=typeof o==='string'?o:(o.texto||o.label||JSON.stringify(o));b.textContent=label;b.onclick=()=>{const ans=q.respuesta;const value=typeof o==='string'?o:(o.valor||o.texto||o.label);const right=clean(ans)===clean(value)||clean(ans)===clean(label)||clean(ans)===clean(label[0])||clean(ans)===clean(value?.[0]);if(right)correct++;g.querySelectorAll('button.option').forEach(x=>x.disabled=true);const p=document.createElement('p');p.textContent=(right?'✅ Correcto. ':'❌ Incorrecto. ')+'Respuesta: '+JSON.stringify(ans)+(q.explicacion?' · '+q.explicacion:'');g.append(p);next()};g.append(b)}}function next(){const b=document.createElement('button');b.textContent='Siguiente';b.onclick=()=>{i++;render()};g.append(b)}
(async()=>{try{if(!id||!/^[0-9a-f-]{36}$/i.test(id))throw Error('Enlace inválido');const r=await fetch(url+'/rest/v1/cia_bancos_compartidos?id=eq.'+encodeURIComponent(id)+'&select=contenido',{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)throw Error('No se pudo consultar el banco ('+r.status+')');const rows=await r.json();if(!rows.length)throw Error('Banco no encontrado');qs=rows[0].contenido.preguntas;if(!qs.length)throw Error('Banco vacío');qs=qs.slice().sort(()=>Math.random()-.5);render()}catch(e){st.textContent=e.message}})();</script></html>
