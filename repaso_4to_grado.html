<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso 4.º Grado · MEDUCA Panamá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff6e5;--card:#ffffff;--ink:#2a2140;--muted:#6b6483;--line:#e8dfcf;--acc:#e8590c;--acc-ink:#ffffff;
  --ok:#17803f;--okbg:#e2f7e9;--bad:#c93a3a;--badbg:#fde8e8;--soft:#f4efe4;
  --mat:#2563eb;--esp:#d9600b;--cn:#178a47;--cs:#d1383d;--ing:#7c4ddb;--cv:#0e7490;
  --fs:20px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17132a;--card:#241e3f;--ink:#f3effc;--muted:#b9b1d6;--line:#3a3260;--soft:#2d2650;
    --okbg:#12361f;--badbg:#3d1a1d;--ok:#5fd48a;--bad:#ff8a8a;
  }
}
:root[data-theme="dark"]{
  --bg:#17132a;--card:#241e3f;--ink:#f3effc;--muted:#b9b1d6;--line:#3a3260;--soft:#2d2650;
  --okbg:#12361f;--badbg:#3d1a1d;--ok:#5fd48a;--bad:#ff8a8a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3,.big{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:940px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.sm{padding:7px 14px;font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
small{font-size:.82rem;color:var(--muted)}

/* registro */
.hero{text-align:center;padding:8px 0 14px}
.hero .big{font-size:2.3rem;color:var(--acc)}
.hero .badge{display:inline-block;background:var(--acc);color:var(--acc-ink);padding:4px 16px;border-radius:999px;font-weight:800;margin-bottom:8px}
label.f{display:block;font-weight:800;margin:14px 0 6px}
input.t{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem}
input.t:focus{outline:3px solid var(--acc);border-color:var(--acc)}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.avs button{font-size:2rem;padding:8px 0;border-radius:16px;background:var(--soft);border:3px solid transparent}
.avs button.on{border-color:var(--acc);background:var(--card);transform:scale(1.07)}
.kids{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.kid{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:var(--soft);text-align:left;font-weight:800;width:100%}
.kid span.av{font-size:1.8rem}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acc);color:var(--acc-ink);border-radius:22px;padding:12px 16px;margin-bottom:12px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .av{font-size:2.2rem;background:rgba(255,255,255,.25);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;flex:none}
.who b{font-family:'Baloo 2',sans-serif;font-size:1.25rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:inherit;opacity:.92}
.pts{font-family:'Baloo 2',sans-serif;font-size:1.5rem;font-weight:800;text-align:right;white-space:nowrap}
.pts small{color:inherit;opacity:.85;font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;min-width:110px;padding:11px 10px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:800}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* misiones */
.area-h{display:flex;align-items:center;gap:10px;margin:20px 0 10px;font-size:1.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px;border-radius:20px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s;min-height:150px}
.mcard:hover{transform:translateY(-2px)}
.mcard:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.mcard .mem{font-size:2.4rem}
.mcard .mt{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.2rem;line-height:1.15}
.mcard .ms{letter-spacing:2px;font-size:1.2rem;margin-top:auto}
.mcard .mp{font-weight:800;font-size:.9rem;opacity:.95}
.a-mat{background:var(--mat)}.a-esp{background:var(--esp)}.a-cn{background:var(--cn)}.a-cs{background:var(--cs)}.a-ing{background:var(--ing)}.a-cv{background:var(--cv)}
.tx-mat{color:var(--mat)}.tx-esp{color:var(--esp)}.tx-cn{color:var(--cn)}.tx-cs{color:var(--cs)}.tx-ing{color:var(--ing)}.tx-cv{color:var(--cv)}

/* lectura */
.crumb{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.chip{display:inline-block;padding:4px 14px;border-radius:999px;color:#fff;font-weight:800;font-size:.9rem}
.reading{font-size:var(--fs);line-height:1.7}
.reading p{margin:0 0 .9em}
.reading h2{font-size:2rem;margin-bottom:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}

/* quiz */
.bar{height:16px;background:var(--soft);border-radius:999px;overflow:hidden;border:2px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .35s}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px;font-weight:800}
.streak{background:#ffedd5;color:#9a3412;border-radius:999px;padding:3px 12px}
.q{font-size:calc(var(--fs) + 2px);font-weight:800;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{padding:14px 18px;border-radius:16px;background:var(--card);border:3px solid var(--line);text-align:left;font-weight:700;font-size:var(--fs);transition:transform .08s}
.opt:hover:not([disabled]){border-color:var(--acc);transform:translateX(3px)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;flex-wrap:wrap}
.numrow input{flex:1;min-width:140px;font-size:1.5rem;font-weight:800;text-align:center}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px;font-weight:700;animation:pop .25s}
.fb.good{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb p{margin:4px 0 0;color:var(--ink);font-weight:600}
details.rd{margin-bottom:14px;border:2px dashed var(--line);border-radius:16px;padding:8px 14px;background:var(--card)}
details.rd summary{cursor:pointer;font-weight:800}
details.rd .reading{font-size:1rem;margin-top:8px}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}

/* resultado */
.res{text-align:center}
.res .stars{font-size:3.4rem;letter-spacing:6px;color:#f5a623}
.res .stars .off{color:var(--line)}
.res .big{font-size:2.2rem}
.res .score{font-family:'Baloo 2',sans-serif;font-size:3.5rem;font-weight:800;color:var(--acc)}
.lvl{display:inline-block;padding:5px 18px;border-radius:999px;font-weight:800}
.lvl.l3{background:var(--okbg);color:var(--ok)}
.lvl.l2{background:#fff3cd;color:#8a6100}
.lvl.l1{background:var(--badbg);color:var(--bad)}
.conf{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;animation:fall 2.8s linear forwards;z-index:50}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}*{animation:none!important;transition:none!important}}

/* notas */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sum div{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.sum b{display:block;font-family:'Baloo 2',sans-serif;font-size:1.9rem;color:var(--acc)}
.ablock{margin-bottom:12px}
.ablock h3{display:flex;justify-content:space-between;gap:8px;font-size:1.2rem;margin-bottom:8px}
.pbar{height:12px;background:var(--soft);border-radius:999px;overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;border-radius:999px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}

/* ranking */
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.chips button{white-space:nowrap;padding:7px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:.9rem}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.status{padding:10px 14px;border-radius:14px;background:var(--soft);font-size:.92rem;margin-bottom:12px}
.rk{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:var(--card);border:2px solid var(--line);margin-bottom:8px}
.rk.me{border-color:var(--acc);background:var(--soft)}
.rk .pos{font-family:'Baloo 2',sans-serif;font-size:1.5rem;min-width:44px;text-align:center}
.rk .av{font-size:2rem}
.rk .nm{flex:1;min-width:0}
.rk .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .sc{font-family:'Baloo 2',sans-serif;font-size:1.4rem;font-weight:800;color:var(--acc);text-align:right}
.mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.mini span{font-size:.72rem;font-weight:800;color:#fff;border-radius:999px;padding:1px 8px}
.foot{margin-top:26px;text-align:center;font-size:.82rem;color:var(--muted)}
.empty{text-align:center;padding:26px;color:var(--muted)}
</style>
</head>

<script>
(function(){
"use strict";
const D={"grade": 4, "label": "4.º grado", "heroTitle": "Súper Repaso de 4.º Grado", "heroEmoji": "🚀", "missions": [{"id": "m1", "area": "mat", "emoji": "🍌", "title": "La cosecha de Don Pedro", "reading": ["Don Pedro tiene una finca en Chiriquí. Cosechó 24 cajas de plátanos y en cada caja caben 15 plátanos. Cada caja se vende a B/.12.", "Don Pedro vendió 120 plátanos en el mercado y repartió los que le quedaron entre 6 vecinos en partes iguales. También empacó 48 mangos en bolsas de 8."], "questions": [{"t": "num", "q": "¿Cuántos plátanos cosechó en total?", "a": 360, "e": "24 × 15 = 360 plátanos."}, {"t": "num", "q": "Si vendió 120 plátanos, ¿cuántos le quedaron?", "a": 240, "e": "360 − 120 = 240."}, {"t": "num", "q": "Repartió 240 plátanos entre 6 vecinos. ¿Cuántos recibió cada uno?", "a": 40, "e": "240 ÷ 6 = 40."}, {"t": "num", "q": "¿Cuánto dinero recibe por las 24 cajas (en balboas)?", "a": 288, "e": "24 × 12 = 288, o sea B/.288."}, {"t": "num", "q": "¿Cuántas bolsas llenó con los 48 mangos?", "a": 6, "e": "48 ÷ 8 = 6 bolsas."}]}, {"id": "m2", "area": "mat", "emoji": "🍰", "title": "Fracciones y decimales", "reading": ["Sofía compró un pastel dividido en 8 porciones iguales. Sofía comió 3 porciones y Luis comió 2.", "Una fracción como 1/2 también se escribe con decimales: 0.5. Un lápiz cuesta B/.0.75 y un cuaderno B/.1.25."], "questions": [{"t": "num", "q": "¿Cuántas porciones del pastel quedaron?", "a": 3, "e": "3 + 2 = 5 comidas; 8 − 5 = 3 porciones."}, {"t": "num", "q": "Escribe 1/2 como decimal.", "a": 0.5, "e": "La mitad de 1 es 0.5."}, {"t": "num", "q": "¿Cuánto cuestan juntos el lápiz y el cuaderno (en balboas)?", "a": 2, "e": "0.75 + 1.25 = 2.00."}, {"t": "num", "q": "¿Cuánto es 1/4 de 20?", "a": 5, "e": "20 ÷ 4 = 5."}, {"t": "num", "q": "Calcula: 2.5 + 3.5", "a": 6, "e": "2.5 + 3.5 = 6."}]}, {"id": "m3", "area": "mat", "emoji": "📏", "title": "Medimos todo", "reading": ["Para medir longitudes usamos el kilómetro (km), el metro (m) y el centímetro (cm). Para el peso usamos el kilogramo (kg) y el gramo (g). Para líquidos usamos el litro (L) y el mililitro (ml).", "Recuerda: 1 km = 1000 m, 1 m = 100 cm, 1 kg = 1000 g y 1 L = 1000 ml. El perímetro de un rectángulo se calcula sumando todos sus lados."], "questions": [{"t": "num", "q": "¿Cuántos metros son 3 km?", "a": 3000, "e": "3 × 1000 = 3000 m."}, {"t": "num", "q": "¿Cuántos centímetros son 2 m?", "a": 200, "e": "2 × 100 = 200 cm."}, {"t": "num", "q": "¿Cuántos gramos son 4 kg?", "a": 4000, "e": "4 × 1000 = 4000 g."}, {"t": "num", "q": "¿Cuántos vasos de 500 ml se llenan con una jarra de 2 litros?", "a": 4, "e": "2 L = 2000 ml; 2000 ÷ 500 = 4 vasos."}, {"t": "num", "q": "¿Cuál es el perímetro de un rectángulo de 9 m de largo y 5 m de ancho?", "a": 28, "e": "9 + 5 + 9 + 5 = 28 m."}]}, {"id": "m4", "area": "esp", "emoji": "🦥", "title": "El perezoso de tres dedos", "reading": ["El perezoso de tres dedos vive en los bosques de Panamá. Pasa casi toda su vida en los árboles y se mueve muy despacio. Se alimenta de hojas.", "Solo baja al suelo una vez por semana. En su pelaje crecen algas que lo ponen verdoso y lo ayudan a esconderse entre las hojas."], "questions": [{"t": "mc", "q": "¿Dónde vive el perezoso de tres dedos?", "o": ["En el desierto", "En los bosques de Panamá", "En el fondo del mar", "En las cuevas heladas"], "a": 1, "e": "Vive en los bosques de Panamá."}, {"t": "mc", "q": "¿De qué se alimenta?", "o": ["De hojas", "De peces", "De carne", "De insectos grandes"], "a": 0, "e": "Se alimenta de hojas."}, {"t": "mc", "q": "¿Cada cuánto baja al suelo?", "o": ["Todos los días", "Una vez por semana", "Nunca", "Cada hora"], "a": 1, "e": "Solo baja una vez por semana."}, {"t": "mc", "q": "¿Por qué su pelaje se ve verdoso?", "o": ["Se pinta con hojas", "Porque nació así", "Porque le crecen algas", "Porque come pasto"], "a": 2, "e": "Las algas crecen en su pelaje y lo ayudan a esconderse."}, {"t": "mc", "q": "¿Cuál es la idea principal del texto?", "o": ["El perezoso es u function totalPts(st){return Object.values(st.progress||{}).reduce((a,p)=>a+(p.pts||0),0);}
function doneCount(st){return Object.keys(st.progress||{}).length;}
function areaAvg(st,a){
  const ms=D.missions.filter(m=>m.area===a&&st.progress&&st.progress[m.id]);
  if(!ms.length)return null;
  return Math.round(ms.reduce((s,m)=>s+st.progress[m.id].pct,0)/ms.length);
}
function overallAvg(st){
  const v=Object.values(st.progress||{});
  return v.length?Math.round(v.reduce((s,p)=>s+p.pct,0)/v.length):null;
}
function levelOf(pct){return pct>=80?{k:3,t:'Logrado'}:pct>=60?{k:2,t:'En proceso'}:{k:1,t:'Por reforzar'};}
function rankTitle(pts){const r=pts/MAXPTS;return r<.2?'Explorador 🧭':r<.5?'Aventurero 🎒':r<.8?'Campeón 🏅':'Gran Maestro 👑';}
function starsOf(pct){return pct>=80?3:pct>=60?2:pct>=20?1:0;}
function starStr(n){return '★'.repeat(n)+'<span style="opacity:.45">'+'★'.repeat(3-n)+'</span>';}

/* ---------- sincronización (ranking compartido) ---------- */
function entryOf(st){
  const areas={};for(const a in AREAS){const v=areaAvg(st,a);if(v!==null)areas[a]=v;}
  return{name:st.name,avatar:st.avatar,school:st.school||'',points:totalPts(st),done:doneCount(st),areas,updated:st.updated||st.created||Date.now()};
}
let pushing=false,pushAgain=false;
async function push(){
  if(!dbH||!myId)return;
  if(pushing){pushAgain=true;return;}
  pushing=true;
  try{
    do{
      pushAgain=false;
      const students={};
      for(const id in S.students)students[id]=entryOf(S.students[id]);
      await dbH.doc('ranking/'+myId).set({students,updated:Date.now()});
      sync='ok';
    }while(pushAgain);
  }catch(e){sync='denied';}
  pushing=false;
  refreshIfRank();
}
function refreshIfRank(){if(cur()&&ui.screen==='home'&&ui.tab==='rank')render();}
async function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db');
    if(!db)return;
    dbH=db;
    try{const u=await window.claude.use('user');if(u){myId=await u.id();}}catch(e){}
    dbH.collection('ranking').limit(500).onSnapshot(snap=>{
      remote=snap.docs.map(d=>({id:d.id,data:d.data()||{}}));
      remoteOk=true;
      refreshIfRank();
    },()=>{remoteOk=false;refreshIfRank();});
    if(cur())push();
  }catch(e){}
}
function buildRank(){
  const list=[];const seen=new Set();
  for(const d of remote){
    const st=d.data.students||{};
    for(const pid in st){
      const e=st[pid];if(!e||typeof e!=='object')continue;
      const mine=(d.id===myId)&&!!S.students[pid];
      const src=mine?entryOf(S.students[pid]):e;
      list.push({key:d.id+':'+pid,me:mine&&S.current===pid,mine,...src});
      if(mine)seen.add(pid);
    }
  }
  for(const pid in S.students){
    if(seen.has(pid))continue;
    list.push({key:'local:'+pid,me:S.current===pid,mine:true,local:true,...entryOf(S.students[pid])});
  }
  const f=ui.filter;
  const val=e=>f==='all'?e.points:(e.areas&&e.areas[f]!=null?e.areas[f]:-1);
  const arr=f==='all'?list:list.filter(e=>val(e)>=0);
  arr.sort((a,b)=>val(b)-val(a)||b.points-a.points||a.updated-b.updated);
  return{arr,val};
}

/* ---------- audio de lectura ---------- */
function stopSpeak(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}
function speak(m){
  if(!('speechSynthesis' in window)){alert('Tu dispositivo no tiene lectura en voz alta.');return;}
  if(speechSynthesis.speaking){speechSynthesis.cancel();return;}
  const u=new SpeechSynthesisUtterance(m.title+'. '+m.reading.join(' '));
  u.lang=m.area==='ing'?'en-US':'es-MX';u.rate=.9;
  speechSynthesis.speak(u);
}

function renderRank(){

}
function renderRead(){
  const m=mById(ui.mid);
  app.innerHTML=`<div class="crumb"><button class="btn ghost sm" data-act="home">← Misiones</button><span class="chip a-${m.area}">${AREAS[m.area].e} ${AREAS[m.area].n}</span></div>
  <div class="card"><div class="reading"><h2 class="tx-${m.area}">${m.emoji} ${esc(m.title)}</h2>
    <div class="tools"><button class="btn ghost sm" data-act="speak">🔊 Escuchar / parar</button><button class="btn ghost sm" data-act="fs" data-v="2">A+ más grande</button><button class="btn ghost sm" data-act="fs" data-v="-2">A− más pequeña</button></div>
    ${m.reading.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
    <div style="text-align:center;margin-top:18px"><button class="btn" data-act="start">✅ ¡Ya leí! A jugar</button><p class="muted" style="margin:10px 0 0"><small>Después de leer responderás ${m.questions.length} preguntas.</small></p></div></div>`;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){
  const m=mById(ui.mid);
  quiz={m,i:0,ok:0,streak:0,best:0,answered:false,
    qs:m.questions.map(q=>q.t==='mc'?{...q,order:shuffle(q.o.map((_,k)=>k))}:q)};
  ui.screen='quiz';render();
}
function renderQuiz(){
  const {m,i,qs}=quiz,q=qs[i];
  let ans='';
  if(q.t==='mc'){
    ans=`<div class="opts">${q.order.map(k=>`<button class="opt" data-act="pickopt" data-k="${k}">${esc(q.o[k])}</button>`).join('')}</div>`;
  }else{
    ans=`<div class="numrow"><input class="t" id="na" inputmode="decimal" autocomplete="off" placeholder="Escribe tu respuesta"><button class="btn" data-act="check">Comprobar</button></div>`;
  }
  app.innerHTML=`<div class="crumb"><button class="btn ghost sm" data-act="home">✕ Salir</button><span class="chip a-${m.area}">${m.emoji} ${esc(m.title)}</span></div>
  <div class="bar"><i style="width:${(i/qs.length)*100}%"></i></div>
  <div class="qhead"><span>Pregunta ${i+1} de ${qs.length}</span><span class="streak">🔥 Racha: ${quiz.streak}</span></div>
  <details class="rd"><summary>📖 Volver a leer la lectura</summary><div class="reading">${m.reading.map(p=>`<p>${esc(p)}</p>`).join('')}</div></details>
  <div class="card"><div class="q">${esc(q.q)}</div><div id="ans">${ans}</div><div id="fb"></div></div>`;
  const na=document.getElementById('na');if(na){na.focus();na.addEventListener('keydown',e=>{if(e.key==='Enter')check();});}
}
function parseNum(s){const t=String(s).trim().replace(',','.').replace(/[^0-9.\-]/g,'');return t===''?NaN:Number(t);}
function showFeedback(good,q,givenText){
  const fb=document.getElementById('fb');
  const correctText=q.t==='mc'?q.o[q.a]:String(q.a);
  quiz.answered=true;
  if(good){quiz.ok++;quiz.streak++;}else quiz.streak=0;
  const last=quiz.i===quiz.qs.length-1;
  fb.innerHTML=`<div class="fb ${good?'good':'bad'}">${good?'🎉 ¡Correcto! +20 puntos'+(quiz.streak>=3?' · ¡Racha de '+quiz.streak+'! 🔥':''):'💪 ¡Casi! La respuesta era: '+esc(correctText)}<p>${esc(q.e)}</p></div>
  <div style="text-align:center;margin-top:14px"><button class="btn" data-act="next">${last?'🏁 Ver mi resultado':'Siguiente →'}</button></div>`;
}
function pickOpt(k){
  if(quiz.answered)return;
  const q=quiz.qs[quiz.i];
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const kk=Number(b.dataset.k);if(kk===q.a)b.classList.add('good');else if(kk===k)b.classList.add('bad');});
  showFeedback(k===q.a,q);
}
function check(){
  if(quiz.answered)return;
  const q=quiz.qs[quiz.i],inp=document.getElementById('na');
  const v=parseNum(inp.value);
  if(isNaN(v)){inp.focus();inp.style.borderColor='var(--bad)';return;}
  inp.disabled=true;
  const good=Math.abs(v-q.a)<1e-6;
  inp.style.borderColor=good?'var(--ok)':'var(--bad)';
  document.querySelector('#ans .btn').disabled=true;
  showFeedback(good,q);
}
function finish(){
  const st=cur(),m=quiz.m,n=quiz.qs.length;
  const pct=Math.round(quiz.ok/n*100),pts=quiz.ok*20;
  const prev=st.progress[m.id];
  const improved=!prev||pts>prev.pts;
  st.progress[m.id]={pct:improved?pct:prev.pct,pts:improved?pts:prev.pts,tries:(prev?prev.tries:0)+1,t:Date.now()};
  st.updated=Date.now();
  save();push();
  lastResult={m,pct,pts,ok:quiz.ok,n,improved,prev:!!prev,best:st.progress[m.id]};
  ui.screen='result';render();
  if(pct>=60)confetti(pct>=80?['🎉','⭐','🎊','✨']:['⭐','✨']);
}
function renderResult(){
  const r=lastResult,s=starsOf(r.pct),lv=levelOf(r.pct);
  const msg=r.pct===100?'¡Perfecto! Eres increíble 🏆':r.pct>=80?'¡Excelente trabajo! 🎉':r.pct>=60?'¡Muy bien! Sigue practicando 💪':'¡No te rindas! Lee otra vez e inténtalo de nuevo 🌟';
  app.innerHTML=`<div class="card res"><div class="chip a-${r.m.area}">${r.m.emoji} ${esc(r.m.title)}</div>
  <div class="stars" style="margin-top:10px">${'★'.repeat(s)}<span class="off">${'★'.repeat(3-s)}</span></div>
  <div class="big">${msg}</div>
  <div class="score">${r.pct}%</div>
  <p style="margin:0 0 10px"><b>${r.ok} de ${r.n}</b> respuestas correctas · <span class="lvl l${lv.k}">${lv.t}</span></p>
  <p class="muted" style="margin:0 0 18px">${r.improved?(r.prev?'🆕 ¡Nueva mejor nota! Tu puntaje subió a '+r.best.pts+' puntos.':'⭐ Ganaste '+r.pts+' puntos y tu nota quedó guardada.'):'Tu mejor nota sigue siendo '+r.best.pct+'% ('+r.best.pts+' puntos).'}</p>
  <div class="row" style="justify-content:center"><button class="btn" data-act="retry">🔁 Jugar otra vez</button><button class="btn ghost" data-act="home">📋 Misiones</button><button class="btn ghost" data-act="ranking">🏆 Ver ranking</button></div></div>`;
}
function confetti(set){
  for(let i=0;i<26;i++){
    const s=document.createElement('span');s.className='conf';s.textContent=set[i%set.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDelay=(Math.random()*.9)+'s';s.style.animationDuration=(2.2+Math.random()*1.4)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),4500);
  }
}

/* ---------- control ---------- */
function render(){
  stopSpeak();
  if(!cur())return renderRegister();
  if(ui.screen==='read')return renderRead();
  if(ui.screen==='quiz'&&quiz)return renderQuiz();
  if(ui.screen==='result'&&lastResult)return renderResult();
  ui.screen='home';renderHome();
}
function register(){
  const name=reg.name.trim();if(name.length<2)return;
  const id=rid();
  S.students[id]={id,name,school:reg.school.trim(),avatar:reg.avatar,progress:{},created:Date.now(),updated:Date.now()};
  S.current=id;save();push();
  reg={name:'',school:'',avatar:AVATARS[0]};
  ui.screen='home';ui.tab='missions';render();
}
let fsz=null;
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  switch(a){
    case'av':reg.avatar=el.dataset.v;document.querySelectorAll('.avs button').forEach(b=>b.classList.toggle('on',b.dataset.v===reg.avatar));break;
    case'register':register();break;
    case'pick':S.current=el.dataset.id;save();ui.screen='home';ui.tab='missions';render();break;
    case'switch':S.current=null;save();render();break;
    case'tab':ui.tab=el.dataset.v;render();window.scrollTo(0,0);break;
    case'filter':ui.filter=el.dataset.v;render();break;
    case'open':ui.mid=el.dataset.id;ui.screen='read';render();window.scrollTo(0,0);break;
    case'home':ui.screen='home';quiz=null;render();window.scrollTo(0,0);break;
    case'ranking':ui.screen='home';ui.tab='rank';render();break;
    case'speak':speak(mById(ui.mid));break;
    case'fs':{const r=document.documentElement;const c=parseFloat(getComputedStyle(r).getPropertyValue('--fs'))||18;const n=Math.min(30,Math.max(15,c+Number(el.dataset.v)));r.style.setProperty('--fs',n+'px');break;}
    case'start':startQuiz();window.scrollTo(0,0);break;
    case'pickopt':pickOpt(Number(el.dataset.k));break;
    case'check':check();break;
    case'next':
      if(quiz.i>=quiz.qs.length-1){finish();}
      else{quiz.i++;quiz.answered=false;renderQuiz();window.scrollTo(0,0);}
      break;
    case'retry':ui.mid=lastResult.m.id;startQuiz();break;
  }
});
app.addEventListener('input',e=>{
  if(e.target.id==='rn'){reg.name=e.target.value;const g=document.getElementById('go');if(g)g.disabled=reg.name.trim().length<2;}
  if(e.target.id==='rs'){reg.school=e.target.value;}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rn'&&reg.name.trim().length>=2)register();});

render();
connect();
})();
</script>
</body>
